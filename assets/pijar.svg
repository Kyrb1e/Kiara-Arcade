<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" role="img" aria-label="Pijar, maskot Kiara Arcade" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b0" stop-opacity=".9"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></radialGradient>
    <radialGradient id="bulb" cx=".36" cy=".3" r=".78"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#fff1bf"/><stop offset=".75" stop-color="#ffd36b"/><stop offset="1" stop-color="#f5a623"/></radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d9cff"/><stop offset=".55" stop-color="#3b5bdb"/><stop offset="1" stop-color="#26389e"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3fb0"/><stop offset="1" stop-color="#1c2a80"/></linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3048b8"/><stop offset=".45" stop-color="#8fa8ff"/><stop offset="1" stop-color="#2a3fb0"/></linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f08a00"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2443c9"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f08a00"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d9cff"/><stop offset="1" stop-color="#2a3fb0"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <circle cx="60" cy="80" r="58" fill="url(#glow)"/>
  <ellipse cx="60" cy="144" rx="28" ry="4" fill="#0b1a5c" opacity=".3" filter="url(#soft)"/>

  <!-- panel surya di kepala -->
  <g transform="rotate(-10 60 18)">
    <rect x="56" y="22" width="8" height="14" rx="4" fill="url(#pole)"/>
    <path d="M30 26h60v4H30z" fill="#c9780c"/>
    <rect x="30" y="6" width="60" height="21" rx="4" fill="url(#frame)"/>
    <rect x="33" y="9" width="54" height="15" rx="2" fill="url(#cell)"/>
    <path d="M51 9v15M69 9v15M33 16.5h54" stroke="#9fd2ff" stroke-width="1.4" opacity=".8"/>
    <path d="M35 10h20l-6 6H35z" fill="#fff" opacity=".35"/>
  </g>

  <!-- lengan -->
  <path d="M34 86C24 82 18 74 15 63" fill="none" stroke="url(#arm)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="15" cy="62" r="5.5" fill="#ffd36b"/>
  <path d="M86 88C95 92 100 98 103 106" fill="none" stroke="url(#arm)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="103" cy="107" r="5.5" fill="#ffd36b"/>

  <!-- tiang dan kaki -->
  <rect x="53" y="104" width="14" height="30" rx="5" fill="url(#pole)"/>
  <ellipse cx="60" cy="139" rx="23" ry="6.5" fill="#d9780a"/>
  <ellipse cx="60" cy="135.5" rx="23" ry="6.5" fill="url(#foot)"/>
  <ellipse cx="52" cy="133.5" rx="8" ry="2" fill="#fff" opacity=".5"/>

  <!-- badan lampu -->
  <circle cx="60" cy="80" r="31" fill="url(#bulb)"/>
  <ellipse cx="46" cy="66" rx="9" ry="5.5" fill="#fff" opacity=".9" transform="rotate(-30 46 66)"/>

  <!-- tudung -->
  <path d="M25 56h70v4.5c0 2-1.5 3.5-3.5 3.5h-63c-2 0-3.5-1.5-3.5-3.5z" fill="url(#rim)"/>
  <path d="M25 57C25 41 39 33 60 33s35 8 35 24z" fill="url(#cap)"/>
  <path d="M36 46c5-6 13-9 22-9" fill="none" stroke="#c9d8ff" stroke-width="4" stroke-linecap="round" opacity=".8"/>

  <!-- wajah -->
  <ellipse cx="49" cy="81" rx="4.4" ry="5.6" fill="#1d2a6b"/>
  <ellipse cx="71" cy="81" rx="4.4" ry="5.6" fill="#1d2a6b"/>
  <circle cx="50.6" cy="78.8" r="1.8" fill="#fff"/>
  <circle cx="72.6" cy="78.8" r="1.8" fill="#fff"/>
  <ellipse cx="41" cy="91" rx="5.5" ry="3.2" fill="#ff8f7a" opacity=".55"/>
  <ellipse cx="79" cy="91" rx="5.5" ry="3.2" fill="#ff8f7a" opacity=".55"/>
  <path d="M52.5 90.5c2.5 6 12.5 6 15 0z" fill="#1d2a6b"/>
  <path d="M56 93.5c2 1.6 6 1.6 8 0" fill="none" stroke="#ff7a7a" stroke-width="2.4" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
