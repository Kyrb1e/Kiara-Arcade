<!DOCTYPE html>
<html lang="id" data-game="dash">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kiara Dash</title>
<style>
:root{box-sizing:border-box;--ink:#0e3b43;--card:#ffffffee;--btn:#f2b705;--btnt:#2b2200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8fff6;--card:#10262cee}}
:root[data-theme="dark"]{--ink:#e8fff6;--card:#10262cee}
html,body{height:100%;margin:0;background:#2a9d9a;font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#pz{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;margin:0;width:42px;height:42px;padding:0;border-radius:12px;background:rgba(8,28,36,.42);color:#fff;font-size:13px;letter-spacing:-2px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:22px 20px 18px;width:min(100%,380px);max-height:100%;overflow:auto;text-align:center;box-shadow:0 12px 40px #0005;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.5px}
.card p{margin:6px 0;font-size:14px;line-height:1.5}
.card .sub{font-weight:700;font-size:15px;margin:10px 0 2px}
.big{font-size:56px;font-weight:300;margin:4px 0}
.how{font-size:13px;opacity:.85}
.how2{display:flex;flex-direction:column;gap:3px;text-align:left;font-size:13px;line-height:1.4;margin:8px 0}
button{margin-top:12px;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px 8px}
.stat{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:13px;opacity:.9;margin-top:6px}
.edu{background:rgba(242,183,5,.18);border-radius:12px;padding:8px 12px;margin-top:8px;text-align:left;font-size:13px;line-height:1.45}
.edu b{display:block;font-size:12px;margin-bottom:2px}
.rec{display:inline-block;background:var(--btn);color:var(--btnt);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}.g3{grid-template-columns:repeat(3,1fr)}
.it{margin:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(127,127,127,.45);font-size:13px}
.it small{font-size:11px;font-weight:600;opacity:.85}
.it.sel{box-shadow:inset 0 0 0 3px var(--btn);background:rgba(242,183,5,.2)}
.it .sw{width:22px;height:22px;border-radius:6px;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.hide{display:none!important}
@media (max-width:520px),(max-height:520px){.card{padding:16px 14px 12px}.card h1{font-size:24px}button{min-height:44px}.big{font-size:44px}}
body{font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",sans-serif}
.card{--ink:#fff;--btn:#fff;--btnt:#243b6b;background:rgba(24,34,84,.34);color:#fff;border-radius:28px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:24px 22px 18px}
.card h1{font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.card .sub{text-transform:uppercase;letter-spacing:3px;opacity:.85;margin:2px 0 8px}
.logo{display:block;width:92px;margin:0 auto 12px;background:#fff;border-radius:22px;padding:6px}
button{border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.18);font-weight:900;text-transform:uppercase;letter-spacing:.6px}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.alt{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.edu{background:rgba(255,255,255,.16)}
.rec{background:#ffe45c;color:#3a2f00}
.it{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);text-transform:none;letter-spacing:0}
.it.sel{box-shadow:inset 0 0 0 3px #fff;background:rgba(255,255,255,.3)}
.lab{font-size:14px;letter-spacing:4px;text-transform:uppercase;opacity:.8}
.big{font-size:88px;font-weight:900;line-height:1;margin:2px 0}
.best{font-size:16px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#ffe45c;margin-bottom:10px}
.chips{display:flex;justify-content:center;gap:8px}
.chips span{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px}
.cd{width:12px;height:12px;border-radius:50%;background:#ffd93b;display:inline-block}
.play{width:92px;height:92px;border-radius:50%;padding:0;margin:16px auto 4px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.play svg{margin-left:4px}
.fact{font-size:12px;opacity:.85;margin:10px 0 0;line-height:1.4}
#bkx{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);right:60px;width:42px;height:42px;min-height:0;margin:0;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:rgba(8,28,36,.42);color:#fff;font:700 26px/1 "Trebuchet MS",sans-serif;letter-spacing:0;text-transform:none;box-shadow:none;cursor:pointer}
#bkx:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ov[style*="flex-end"]{z-index:30;align-items:flex-start!important;background:#ff6b57;padding:calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);overflow:auto;animation:pgin .3s ease-out}
#ov[style*="flex-end"] .card{--ink:#fff;--card:transparent;background:transparent;color:#fff;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-height:none;overflow:visible;width:min(100%,420px);margin:auto;padding:0;text-align:center}
#ov[style*="flex-end"] .card:has(.big)::before{content:"Hasil permainan";display:block;font-size:13px;letter-spacing:4px;text-transform:uppercase;opacity:.75;margin-bottom:14px}
#ov[style*="flex-end"] .big{font-size:96px;font-weight:900;line-height:1;margin:6px 0}
#ov[style*="flex-end"] .card h1{font-size:30px;font-weight:900}
@keyframes pgin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
</style>

function beep(f,d,type,v,f2){
  if(!SV.snd)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03);
  }catch(e){}
}

  if(inZone&&st==='play')T('Zona gelap! Baterai terkuras',W/2,by+bh+sm*3.4,sm,'center','#ffe45c');
  if(st==='dying')T('Baterai habis',W/2,H*.45,sm*2.6,'center','#fff');
  if(hintT>0&&st==='play'){const a=Math.min(1,hintT);T('Ketuk lompat, dua kali lompat ganda',W/2,H*.3,sm*1.1,'center','#fff',a);T('Tahan atau geser bawah untuk meluncur',W/2,H*.3+sm*1.7,sm*1.1,'center','#fff',a);T('Sambar blok panel surya',W/2,H*.3+sm*3.4,sm*1.1,'center','#ffe45c',a)}
}
function draw(){
  const k=DPR*SC;ctx.setTransform(k,0,0,k,0,0);
  const sx=(Math.random()-.5)*shake*8,sy=(Math.random()-.5)*shake*8;
  ctx.translate(sx,sy);
  drawSky();drawGround();
  poles.forEach(drawPole);
  ents.forEach(e=>{if(e.k==='snail')drawSnail(e);else if(e.k==='drone')drawDrone(e)});
  drawPlayer();
  glows();
  ents.forEach(e=>{if(e.k==='panel')drawPanelBlock(e);else if(e.k==='coin')drawCoin(e)});
  bolts.forEach(drawBolt);
  ctx.save();
  parts.forEach(p=>{const a=Math.max(0,p.life/p.max);ctx.fillStyle=`rgba(${p.c},${a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.4+.6*a),0,7);ctx.fill()});ctx.restore();
  fl.forEach(f=>{ctx.save();ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='800 22px "Trebuchet MS","Segoe UI",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(8,28,36,.55)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);ctx.restore()});
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(flashA>.01){ctx.fillStyle=`rgba(${flashC},${flashA})`;ctx.fillRect(0,0,W,H)}
  hud();
}
function update(dt){
  anim+=dt;
  shake=Math.max(0,shake-dt*3);flashA=Math.max(0,flashA-dt*1.8);
  bolts.forEach(b=>b.t-=dt);bolts=bolts.filter(b=>b.t>0);
  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt});parts=parts.filter(p=>p.life>0);
  fl.forEach(f=>{f.life-=dt;f.y-=40*dt});fl=fl.filter(f=>f.life>0);
  poles.forEach(p=>p.flash=Math.max(0,p.flash-dt*1.5));
  if(st==='menu'){dist+=140*dt;t+=dt*.8;spd=140;calcPal();poleEnsure();poles=poles.filter(p=>p.x>dist-400);return}
  if(st==='play'||st==='dying')updateGame(dt);
}
function frame(ts){
  const dt=Math.min((ts-last)/1000||0,.05);last=ts;
  update(dt);draw();requestAnimationFrame(frame);
}
menuCard();
requestAnimationFrame(frame);
</script>

<script>(function(){var b=document.getElementById("bkx");b.addEventListener("pointerdown",function(e){e.stopPropagation()});b.addEventListener("click",function(){parent.postMessage("sa-back","*")})})();</script>
