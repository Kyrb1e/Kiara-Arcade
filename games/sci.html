<!DOCTYPE html><html lang="id" data-game="sci"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiara Lab</title><style>
:root{--bg:#eef7f5;--card:#fff;--ink:#0e3b43;--mut:#4a6a70;--pri:#0f7a74;--pri2:#16a39a;--line:#d3e5e2;--soft:#e3f2ef;--warn:#fff4d1}

#bkx{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:rgba(8,28,36,.55);color:#fff;font:700 26px/1 "Trebuchet MS",sans-serif;cursor:pointer}

@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.bar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:8px 0;font-size:11px;font-weight:700;color:#fff}.bar i{display:flex;align-items:center;justify-content:center;font-style:normal;overflow:hidden;white-space:nowrap}.lg{font-size:12px;color:var(--mut)}li{margin:3px 0;font-size:13px}.root[hidden]{display:none}#sn{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);scrollbar-width:none}#sn button{flex:none;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;white-space:nowrap}#sn button.on{background:var(--pri);color:#fff;box-shadow:none}#sn button.ok::after{content:' \2713'}body.um .eq,body.um .note,body.um details{display:none}

.gb:hover,.gb:focus-visible{box-shadow:inset 0 0 0 3px var(--pri)}.gb .e{font-size:32px}.gb b{display:block;font-size:17px}.gb span span{display:block;font-size:13px;color:var(--mut);line-height:1.4}
#mchip{all:unset;cursor:pointer;display:inline-block;margin-top:6px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 12px;box-shadow:inset 0 0 0 2px var(--line)}
#mchip:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.inti{background:var(--warn)}.lvl{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--pri)}

</head><body>
<button id="bkx" aria-label="Kembali ke pilihan game">&#8249;</button>
<header><h1>Kiara Lab</h1><p id="hsub"></p><button id="mchip" type="button" aria-label="Ganti mode belajar"></button><div class="prog"><i id="spb"></i></div></header><div id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gt"><h2 id="gt">Pilih cara belajar</h2><p>Bisa diganti kapan saja.</p>
<button class="gb" data-m="civ"><span class="e">🎓</span><span><b>Ilmiah</b><span>14 bab lengkap dengan rumus dan simulasi</span></span></button>
<button class="gb" data-m="umum"><span class="e">🏘️</span><span><b>Simpel</b><span>9 bab ringkas tanpa rumus</span></span></button></div>
<nav id="sn" aria-label="Bab"></nav>
<section id="rL" class="root"><nav id="nav" style="display:none"></nav><main id="main"></main><i id="pb" style="display:none"></i></section>
<section id="rB" class="root" hidden><nav id="nav" style="display:none"></nav><main id="main"></main><i id="pb" style="display:none"></i></section>
<script>
const PMODE={v:'civ'};let Q=[];
const APIL=(()=>{const root=document.getElementById('rL');
const $=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];
const fx=(n,d=0)=>Number(n).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const V=id=>+root.querySelector('#'+id).value;
const T=(id,t)=>{const e=root.querySelector('#'+id);if(e)e.innerHTML=t};
const sl=(id,lab,min,max,st,v,u,d)=>`<label class="sl"><span>${lab}</span><output id="o_${id}">${fx(v,d||0)} ${u}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${st}" value="${v}" data-d="${d||0}" data-u="${u}"></label>`;
const sel=(id,lab,opts)=>`<label class="sl"><span>${lab}</span><select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>`;
function ctxOf(c,h){const d=devicePixelRatio||1,w=c.clientWidth||300;c.width=w*d;c.height=h*d;c.style.height=h+'px';const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]}
const MT='<svg width="36" height="42" viewBox="-26 -56 44 58" aria-hidden="true"><rect x="-10" y="-12" width="8" height="12" rx="4" fill="#2b4a8a"/><rect x="2" y="-12" width="8" height="12" rx="4" fill="#2b4a8a"/><rect x="-24" y="-30" width="10" height="16" rx="3" fill="#2f6bff"/><rect x="-12" y="-28" width="24" height="20" rx="9" fill="#ff8a3d"/><circle cx="2" cy="-38" r="13" fill="#e2a46d"/><path d="M-11 -40a13 13 0 0 1 26 0z" fill="#2b1b12"/><circle cx="6" cy="-36" r="2.3" fill="#1d1d2b"/><circle cx="12" cy="-36" r="2.3" fill="#1d1d2b"/></svg>';
const mt=t=>`<div class="mt">${MT}<div><b>Misi Mang Teten</b>${t}</div></div>`;
const note=t=>`<div class="note"><b>Catatan model:</b> ${t}</div>`;
let cur=-1,raf=0,seen=new Set();
try{JSON.parse(localStorage.getItem('pjuts_seen')||'[]').forEach(i=>seen.add(i))}catch(e){}
const C=[],S={pw:60,hr:12};
/* ===== BAB 1 ===== */
C.push({n:'1 Pendahuluan',h:()=>`<h2>1. Pendahuluan</h2>${mt('Lampu PJU di dusun sering padam dan tagihannya besar. Apa bedanya PJU biasa dengan PJU tenaga surya?')}
<div class="card"><p>Transisi menuju energi terbarukan menuntut sektor infrastruktur publik ikut berubah. Penerangan Jalan Umum atau PJU memegang porsi konsumsi listrik yang besar dari jaringan utilitas konvensional atau PLN. PJU Tenaga Surya atau PJUTS menjadi solusi strategis untuk menekan konsumsi energi fosil, mengurangi emisi karbon, dan meningkatkan kemandirian energi kawasan perkotaan maupun pedesaan.</p>
<p>Memahami fisika dasar, terutama dinamika elektron-hole pada sambungan semikonduktor panel surya, menjadi kunci untuk mengoptimalkan efisiensi konversi energi surya menjadi listrik.</p>
<div class="facts"><div><b>Menekan energi fosil</b>Pasokan berasal dari matahari, bukan jaringan.</div><div><b>Mengurangi emisi</b>Tidak ada pembakaran bahan bakar saat beroperasi.</div><div><b>Kemandirian energi</b>Cocok untuk dusun jauh dari jaringan.</div></div></div>
<div class="card"><h3>Bandingkan alur energinya</h3><div class="seg" id="sg"><button class="on" data-k="c">PJU konvensional</button><button data-k="s">PJUTS</button></div><div class="flow" id="fl"></div><p id="fn"></p></div>`,
i:()=>{const D={c:[['Pembangkit, dominan fosil','Transmisi dan distribusi PLN','Meteran dan tagihan','Lampu PJU'],'Bergantung pada jaringan listrik. Konsumsi PJU membebani utilitas dan menimbulkan emisi tidak langsung dari pembangkit.'],s:[['Matahari','Panel PV','Solar charge controller','Baterai','Lampu LED'],'Berdiri mandiri: energi siang disimpan di baterai dan dipakai malam hari. Tanpa kabel jaringan dan tanpa emisi operasional.']};
const r=k=>{$$('#sg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));T('fl',D[k][0].map(x=>`<span>${x}</span>`).join('<i>&rarr;</i>'));T('fn',D[k][1])};
$$('#sg button').forEach(b=>b.onclick=()=>r(b.dataset.k));r('c')}});
/* ===== BAB 2 ===== */
C.push({n:'2 Energi Surya',h:()=>`<h2>2. Dasar Energi Surya</h2>${mt('Kenapa panel di tiang kadang menghasilkan listrik banyak, kadang sedikit?')}
<div class="card"><p>Teknologi fotovoltaik atau PV mengubah energi radiasi matahari langsung menjadi listrik arus searah atau DC melalui efek fotovoltaik. Kinerja PJUTS dipengaruhi oleh komponen radiasi, tingkat <i>irradiance</i>, temperatur operasional modul, dan sudut kemiringan instalasi.</p>
<div class="eq">G<sub>total</sub> = G<sub>langsung</sub> + G<sub>difus</sub> + G<sub>pantulan</sub></div>
<table><tr><th>Komponen</th><th>Keterangan</th></tr><tr><td>Langsung</td><td>Sinar yang datang lurus dari matahari; dominan saat cerah.</td></tr><tr><td>Difus</td><td>Cahaya yang terhambur awan dan atmosfer; tetap ada saat mendung.</td></tr><tr><td>Pantulan</td><td>Cahaya yang dipantulkan tanah dan permukaan sekitar, disebut albedo.</td></tr></table></div>
<div class="card"><h3>Simulator keluaran panel 100 Wp</h3>
${sl('gp','Irradiance puncak langit cerah','200','1100','10',1000,'W/m&sup2;')}${sl('cl','Kecerahan hari','30','100','5',80,'%')}${sl('ta','Suhu udara','15','40','1',30,'&deg;C')}${sl('tl','Sudut kemiringan panel','0','60','1',10,'&deg;')}
<canvas id="cg" aria-label="Grafik irradiance harian"></canvas>
<div class="eq">P = P<sub>maks</sub> &times; (G/1000) &times; [1 + &gamma;(T<sub>sel</sub> &minus; 25)] &times; cos(&beta; &minus; &beta;<sub>opt</sub>)</div>
<div class="res"><div>Irradiance siang<b id="r1"></b></div><div>Suhu sel<b id="r2"></b></div><div>Daya siang<b id="r3"></b></div><div>Jam surya efektif<b id="r4"></b></div><div>Energi per hari<b id="r5"></b></div></div>
${note('model pendekatan untuk belajar, bukan data jurnal. Kondisi uji standar atau STC: 1000 W/m&sup2;, 25 &deg;C. Suhu sel = T<sub>udara</sub> + (NOCT&minus;20)/800 &times; G dengan NOCT 45 &deg;C. Koefisien daya &gamma; = &minus;0,4 %/&deg;C, nilai tipikal silikon. Sudut optimum diasumsikan 10&deg;, kira-kira lintang Indonesia dan cukup agar air hujan mengalir. Profil harian dimodelkan sinus pukul 06.00&ndash;18.00.')}</div>`,
i:()=>{C[1].u()},u:()=>{const G=V('gp')*V('cl')/100,Ta=V('ta'),b=V('tl'),Tc=Ta+(45-20)/800*G,cd=Math.max(0,Math.cos((b-10)*Math.PI/180)),k=1+(-.004)*(Tc-25),P=100*(G/1000)*k*cd,psh=G*24/Math.PI/1000*cd,E=100*psh*k;
T('r1',fx(G)+' W/m&sup2;');T('r2',fx(Tc,1)+' &deg;C');T('r3',fx(P,1)+' W');T('r4',fx(psh,1)+' jam');T('r5',fx(E)+' Wh');
const[x,w,h]=ctxOf($('#cg'),170),L=36,B=22,Tp=10,pw=w-L-8,ph=h-B-Tp,cs=getComputedStyle(document.body);x.clearRect(0,0,w,h);x.font='11px sans-serif';x.fillStyle=cs.color;x.strokeStyle='rgba(120,140,140,.35)';
for(let g=0;g<=1000;g+=500){const y=Tp+ph-ph*g/1100;x.beginPath();x.moveTo(L,y);x.lineTo(w-8,y);x.stroke();x.textAlign='right';x.fillText(g,L-4,y+4)}
x.textAlign='center';[6,9,12,15,18].forEach(t=>x.fillText(t+':00',L+pw*(t-6)/12,h-6));
x.beginPath();x.moveTo(L,Tp+ph);for(let t=0;t<=12;t+=.25){x.lineTo(L+pw*t/12,Tp+ph-ph*(G*Math.sin(Math.PI*t/12))/1100)}x.lineTo(L+pw,Tp+ph);x.closePath();x.fillStyle='rgba(242,183,5,.55)';x.fill();x.strokeStyle='#e0a100';x.lineWidth=2;x.stroke();x.lineWidth=1;
x.fillStyle=cs.color;x.textAlign='left';x.fillText('W/m\u00B2',4,12)}});
/* ===== BAB 3 ===== */
C.push({n:'3 Fisika PV',h:()=>`<h2>3. Efek Fotovoltaik dan Fisika Semikonduktor</h2>${mt('Bagaimana cahaya bisa berubah jadi arus listrik di dalam panel?')}
<div class="card"><p>Konversi fotovoltaik berakar dari interaksi cahaya dengan semikonduktor silikon. Foton yang energinya melebihi <i>bandgap</i> membangkitkan pasangan elektron-hole. Medan listrik internal di daerah deplesi sambungan p-n memisahkan kedua pembawa muatan itu sehingga mengalirkan arus.</p>
<div class="eq">E<sub>foton</sub> = hc/&lambda; &asymp; 1240/&lambda;(nm) eV &nbsp;&nbsp; syarat: E<sub>foton</sub> &ge; E<sub>g</sub></div>
<details><summary>Pita valensi dan konduksi</summary><p>Tingkat energi elektron terikat, yaitu pita valensi, dan elektron bebas penghantar arus, yaitu pita konduksi. Selisihnya adalah bandgap E<sub>g</sub> yang menentukan batas eksitasi foton minimum.</p></details>
<details><summary>Daerah deplesi pada sambungan p-n</summary><p>Medan listrik internal memisahkan elektron dan hole sehingga mencegah rekombinasi dini pembawa muatan.</p></details>
<details><summary>Sumur elektron</summary><p>Daerah berpotensial rendah yang menjebak dan mengarahkan elektron. Ini meningkatkan efisiensi serapan pada sel surya lanjut.</p></details></div>
<div class="card"><h3>Diagram pita energi sambungan p-n</h3>
<svg viewBox="0 0 320 190" width="100%" role="img" aria-label="Diagram pita energi" style="background:var(--soft);border-radius:12px"><g fill="none" stroke-width="3"><path d="M10 50H120C140 50 150 50 160 80S180 110 200 110H310" stroke="#2f6bff"/><path d="M10 120H120C140 120 150 120 160 150S180 180 200 180H310" stroke="#e0524a"/></g><g font-size="11" fill="currentColor"><text x="12" y="42">Pita konduksi Ec</text><text x="12" y="140">Pita valensi Ev</text><text x="14" y="86">p</text><text x="296" y="94">n</text><text x="196" y="132">Eg</text><text x="118" y="20">Daerah deplesi</text></g><rect x="120" y="26" width="80" height="154" fill="rgba(242,183,5,.18)"/><path d="M210 112V178" stroke="currentColor" stroke-width="1.5"/><path d="M60 50V120" stroke="currentColor" stroke-dasharray="3 3"/><circle cx="105" cy="50" r="6" fill="#2f6bff"/><path d="M112 56L190 104" stroke="#2f6bff" stroke-width="2"/><circle cx="195" cy="180" r="6" fill="none" stroke="#e0524a" stroke-width="2.5"/><path d="M190 176L130 124" stroke="#e0524a" stroke-width="2"/></svg>
<p style="font-size:13px;color:var(--mut)">Elektron biru &ldquo;menuruni bukit&rdquo; pita konduksi ke sisi n, sedangkan hole merah bergerak ke sisi p. Itulah pemisahan muatan oleh medan internal.</p></div>
<div class="card"><h3>Simulasi foton dan pasangan elektron-hole</h3>
${sel('mat','Material semikonduktor',[['1.12','Silikon, Eg 1,12 eV, basis PV pada jurnal'],['1.42','GaAs, Eg 1,42 eV, pembanding'],['0.67','Germanium, Eg 0,67 eV, pembanding']])}${sl('ev','Energi foton','0.5','3.2','0.05',2,'eV',2)}
<canvas id="pn" aria-label="Simulasi sambungan p-n"></canvas>
<div class="res"><div>Panjang gelombang<b id="p1"></b></div><div>Status foton<b id="p2" style="font-size:14px"></b></div><div>Energi terpakai<b id="p3"></b></div><div>Terpisah / dibangkitkan<b id="p4"></b></div></div>
${note('simulasi kualitatif. Pasangan yang dibangkitkan di luar daerah deplesi bisa berekombinasi sebelum terkumpul, makin jauh makin besar peluangnya. Kelebihan energi (E &minus; Eg) terbuang sebagai panas.')}</div>`,
i:()=>{const c=$('#pn');let W,H=250,ph=[],pr=[],gen=0,sep=0,last=performance.now(),acc=0,fl=[];
const sz=()=>{[,W]=ctxOf(c,H)};sz();
const st=[];for(let i=0;i<26;i++)st.push([Math.random(),Math.random()*.7+.2,i%2]);

{n:'Rugi dan degradasi',h:()=>`<h2>Rugi sistem, performance ratio, dan degradasi modul</h2><div class="card"><p>Energi nyata selalu di bawah energi ideal. Performance ratio atau PR adalah perkalian faktor-faktor yang tersisa setelah debu, suhu, kabel, ketidakcocokan (<i>mismatch</i>), dan elektronik. Di atas itu, modul kristalin kehilangan daya sedikit demi sedikit: penurunan awal akibat <i>light-induced degradation</i> atau LID di tahun pertama, lalu laju degradasi tahunan.</p><div class="eq">PR = (1&minus;L<sub>debu</sub>)(1&minus;L<sub>suhu</sub>)(1&minus;L<sub>lain</sub>) &nbsp;|&nbsp; P(y) = P<sub>0</sub>(1&minus;LID)(1&minus;r)<sup>y&minus;1</sup></div>
