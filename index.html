<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiarakoneng Solar Arcade</title>
<style>
:root{box-sizing:border-box;--bg:#1d2557}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;background:var(--bg);color:#fff;-webkit-tap-highlight-color:transparent}
#hub{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{text-align:center;margin-bottom:20px}
header h1{font-size:clamp(34px,10vw,48px);margin:0;font-weight:900;letter-spacing:-1px}
header p{margin:6px 0 0;font-size:14px;opacity:.8}
.logo{display:block;width:88px;margin:0 auto 12px;background:#fff;border-radius:24px;padding:7px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.list{width:min(100%,460px);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;background:var(--c);border-radius:24px;padding:16px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s}
.g:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.g:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ic{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center}
.tx b{display:block;font-size:20px;font-weight:900;letter-spacing:-.3px}
.tx span{display:block;font-size:12.5px;line-height:1.35;margin-top:3px;opacity:.92}
.tag{display:inline-block;margin-top:9px;font-size:11px;font-weight:900;font-style:normal;background:rgba(0,0,0,.22);border-radius:999px;padding:3px 10px}
footer{margin-top:22px;font-size:12px;opacity:.65;text-align:center}
#play{position:fixed;inset:0;background:#000;z-index:10}
#play iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#bk{position:absolute;left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:11;width:38px;height:38px;border:0;border-radius:12px;background:rgba(0,0,0,.28);color:#fff;font-size:22px;line-height:1;cursor:pointer;opacity:.7;font-family:inherit}
#bk:hover,#bk:focus-visible{opacity:1}
#bk:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hide{display:none!important}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--bg);text-align:center;color:#fff;overflow:auto}
#intro .av{display:flex;align-items:flex-end;gap:10px}
.bub{background:#fff;color:#1d2557;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:900;font-size:14px;margin-bottom:60px}
#intro h2{margin:4px 0 0;font-size:clamp(34px,10vw,46px);font-weight:900;letter-spacing:-1px}
#intro p{margin:0;max-width:380px;line-height:1.5;font-size:15px}
.mis{background:rgba(0,0,0,.2);border-radius:18px;padding:12px 16px;max-width:380px;font-size:14px;text-align:left;line-height:1.45}
.mis b{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.ib{width:min(100%,380px);padding:15px;border-radius:999px;border:0;font:900 17px "Arial Rounded MT Bold","Trebuchet MS",sans-serif;cursor:pointer;background:#fff;color:#1d2557;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ib:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ib.alt{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.ib:focus-visible{outline:3px solid #fff;outline-offset:3px}

@media (min-width:720px){#hub{justify-content:center}.list{width:min(100%,860px);grid-template-columns:repeat(3,1fr);gap:18px}.g{padding:20px}.tx b{font-size:22px}.tx span{font-size:14px}.ic{width:84px;height:84px}header h1{font-size:60px}header p{font-size:16px}#intro h2{font-size:56px}#intro p,.mis{max-width:460px;font-size:16px}.ib{width:min(100%,420px)}}
@media (max-height:520px){#hub{padding-top:12px}.logo{width:56px;margin-bottom:6px}header h1{font-size:28px}header{margin-bottom:10px}.list{grid-template-columns:repeat(3,1fr)}.ic{width:52px;height:52px}.ic svg{width:40px;height:40px}.g{padding:12px}#intro{justify-content:flex-start}}
#mus{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:11;width:38px;height:38px;border:0;border-radius:12px;background:rgba(0,0,0,.28);color:#fff;font:900 18px/1 inherit;cursor:pointer;opacity:.7}#mus:hover,#mus:focus-visible{opacity:1}#mus:focus-visible{outline:3px solid #fff;outline-offset:2px}

</style>
</head>

<script>
const GAMES={"stack":"\u003c!DOCTYPE html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003c!--\n MUSIK: \"Terang di Kiarakoneng\" (komposisi orisinal, dibuat prosedural dengan WebAudio)\n Kunci C mayor (pentatonik C-D-E-G-A), birama 4/4, 8 birama, diulang. Tempo: Siang 100 BPM, Malam 76 BPM, Hujan 88 BPM.\n Akord per birama: C | F | Am | G | C | F | G | C\n Melodi (nomor di kurung = jumlah ketukan, tanpa angka = 1 ketukan):\n | E5 G5 A5 G5 | E5 D5 C5(2) | D5 E5 G5 E5 | D5(2) C5 A4 | C5 E5 G5 A5 | C6(1.5) A5(.5) G5(2) | E5 G5 E5 D5 | C5(4) |\n Bass: akar akord di ketukan 1, kuint di ketukan 3. Data lengkap ada di konstanta SONG pada skrip.\n-->\n\u003ctitle>Kiara Stack\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#0e3b43;--card:#ffffffee;--btn:#f2b705;--btnt:#2b2200}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--ink:#e8fff6;--card:#10262cee;--btn:#f2b705;--btnt:#2b2200}}\n:root[data-theme=\"dark\"]{--ink:#e8fff6;--card:#10262cee}\nhtml,body{height:100%;margin:0;background:#2a9d9a;font-family:\"Trebuchet MS\",\"Segoe UI\",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}\ncanvas{display:block;width:100%;height:100%}\n#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px;color:#fff;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}\n#seg{font-size:clamp(40px,12vw,64px);font-weight:300;line-height:1}\n#seg small{font-size:.35em;opacity:.85}\n#info{text-align:right;font-size:14px;line-height:1.5}\n#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}\n.card{background:var(--card);color:var(--ink);border-radius:18px;padding:22px 20px 18px;width:min(100%,360px);text-align:center;box-shadow:0 12px 40px #0005;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.card h1{font-size:26px;margin:0 0 8px;font-weight:600}\n.card p{margin:6px 0;font-size:14px;line-height:1.5}\n.big{font-size:56px;font-weight:300;margin:4px 0}\nbutton{margin-top:14px;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n.hide{display:none!important}\n.card{max-height:100%;overflow:auto}\n#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);width:min(92vw,420px);background:rgba(8,28,36,.74);color:#fff;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.45;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:tin .35s ease-out}\n#toast b{display:block;color:#ffe27a;font-size:12px;margin-bottom:2px}\n@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}\n.edu{background:rgba(242,183,5,.18);border-radius:12px;padding:8px 12px;margin-top:8px;text-align:left;font-size:13px;line-height:1.45}\n.edu b{display:block;font-size:12px;margin-bottom:2px}\n.lp{text-align:left}.lp h2{font-size:18px;margin:0 0 8px}.lp p{font-size:14px;line-height:1.5;margin:8px 0}.lp ul{margin:8px 0;padding-left:18px;font-size:14px;line-height:1.5}.lp li{margin-bottom:4px}\n.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.25}.dots i.on{opacity:.9}\n@media (prefers-reduced-motion:reduce){#toast{animation:none}}\n.pnl{background:rgba(8,28,36,.34);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:8px 10px}\n#info{margin-left:auto;min-width:0;font-size:12.5px}#lvl{font-weight:700}\n#pz,#mu{pointer-events:auto;margin:0;width:40px;height:40px;padding:0;flex:none;border-radius:12px;background:rgba(8,28,36,.34);color:#fff;font-size:12px;letter-spacing:-2px}#mu{font-size:18px;letter-spacing:0}.btns{display:flex;flex-direction:column;gap:6px;flex:none}.mu2{margin:10px 0 0;padding:8px 14px;font-size:13px;width:100%}\n#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:rgba(8,28,36,.5);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;white-space:nowrap}\n.row{display:flex;gap:8px}.row button{flex:1;margin-top:14px;padding:12px 8px}.row .alt{margin-left:0}\n.stat{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:13px;opacity:.85;margin-top:6px}\n.rec{display:inline-block;background:var(--btn);color:var(--btnt);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:6px}\n.card .sub{font-weight:600;font-size:15px}.card .how{opacity:.8;font-size:13px}\n.lvls{display:flex;flex-direction:column;gap:8px;margin-top:10px}\n.lv{margin:0;width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 14px;border-radius:12px}\n.lv .ic{font-size:26px;line-height:1}.lv .tx{flex:1;display:flex;flex-direction:column;line-height:1.25}.lv .tx b{font-size:16px}.lv .tx small{font-size:12px;font-weight:500;opacity:.8}.lv .bs{font-size:12px;font-weight:600;opacity:.85;white-space:nowrap}\n.lv[data-m=malam]{background:#1b2a5c;color:#fff}\n.lv[data-m=hujan]{background:#5b7284;color:#fff}\n.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);margin-left:8px}\n.pips{display:flex;gap:2px;width:min(32vw,230px)}\n.pip{flex:1;min-width:0;height:10px;border-radius:3px;background:rgba(255,255,255,.28);box-shadow:0 1px 3px #0003}\n.pip.cur{background:#fff;animation:blink .7s ease-in-out infinite alternate}\n@keyframes blink{from{opacity:.4}to{opacity:1}}\n#cmb{display:inline-block;transform-origin:left center;margin-top:8px;font-size:clamp(18px,5vw,24px);font-weight:700;color:#ffe27a;min-height:1.3em}\n#cmb.bump{animation:bump .35s ease-out}\n@keyframes bump{0%{transform:scale(1.7)}100%{transform:scale(1)}}\n@media (prefers-reduced-motion:reduce){.pip.cur,#cmb.bump{animation:none}}\n.meter{height:8px;border-radius:4px;background:#0003;overflow:hidden;margin:6px 0 10px}\n.meter i{display:block;height:100%;background:linear-gradient(90deg,#ff8c32,#fff3c4)}\n#bkx{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 12px);right:108px;width:40px;height:40px;min-height:0;margin:0;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:rgba(8,28,36,.42);color:#fff;font:700 26px/1 \"Trebuchet MS\",sans-serif;letter-spacing:0;text-transform:none;box-shadow:none;cursor:pointer}\n#bkx:focus-visible{outline:3px solid #fff;outline-offset:2px}\n#info{margin-right:50px}\n#ov[style*=\"flex-end\"]{z-index:30;align-items:flex-start!important;background:#2f6bdf;padding:calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);overflow:auto;animation:pgin .3s ease-out}\n#ov[style*=\"flex-end\"] .card{--ink:#fff;--card:transparent;background:transparent;color:#fff;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-height:none;overflow:visible;width:min(100%,420px);margin:auto;padding:0;text-align:center}\n#ov[style*=\"flex-end\"] .card:has(.big)::before{content:\"Hasil permainan\";display:block;font-size:13px;letter-spacing:4px;text-transform:uppercase;opacity:.75;margin-bottom:14px}\n#ov[style*=\"flex-end\"] .big{font-size:96px;font-weight:900;line-height:1;margin:6px 0}\n#ov[style*=\"flex-end\"] .card h1{font-size:30px;font-weight:900}\n@keyframes pgin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}\n.an{margin-top:8px;text-align:left}.an b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.85}.bars{display:flex;align-items:flex-end;gap:3px;height:86px;padding-top:16px;margin:8px 0 0;border-bottom:2px solid rgba(255,255,255,.4)}.bars i{flex:1;position:relative;background:rgba(255,255,255,.55);border-radius:3px 3px 0 0}.bars i em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;font-style:normal;font-weight:900;line-height:1;white-space:nowrap}.bars i.pf{background:#ffe45c}.bars i.pw{background:#ff7a6b}.bx{display:flex;gap:3px;margin:2px 0 4px}.bx span{flex:1;text-align:center;opacity:.7;font-weight:700}.an .dl{opacity:.8;font-size:12px;word-break:break-word}.an .cap{opacity:.65;font-size:11px;line-height:1.4}.an p{margin:4px 0;font-size:13px}.an .seq{font-weight:900;word-break:break-word}\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cdiv id=\"hud\">\u003cdiv class=\"pnl\" id=\"left\">\u003cdiv id=\"seg\">\u003c/div>\u003cdiv id=\"cmb\">\u003c/div>\u003c/div>\u003cdiv id=\"info\" class=\"pnl\">\u003cdiv id=\"lvl\">Dusun Kiarakoneng 1\u003c/div>\u003cdiv id=\"lbl\">Segmen tiang\u003c/div>\u003c/div>\u003cdiv class=\"btns\">\u003cbutton id=\"mu\" aria-label=\"Musik\">🔊\u003c/button>\u003cbutton id=\"pz\" aria-label=\"Jeda\">❚❚\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv id=\"hint\" class=\"hide\">Ketuk layar untuk menaruh blok\u003c/div>\n\u003cdiv id=\"toast\" class=\"hide\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cdiv id=\"ov\">\u003cdiv class=\"card\" id=\"card\">\n\u003ch1>Kiara Stack\u003c/h1>\n\u003cp>Terangi Dusun Kiarakoneng 1: bangun tiang PJU tenaga surya dari 10 segmen tiang, lalu pasang 1 modul panel surya di puncak.\u003c/p>\n\u003cp>Ketuk layar (atau spasi) tepat saat blok sejajar. Bagian yang meleset terpotong.\u003c/p>\n\u003cp>\u003cb>Pilih level\u003c/b>\u003c/p>\u003cdiv class=\"lvls\">\u003cbutton class=\"lv\" data-m=\"siang\">\u003cb>Siang\u003c/b>\u003cspan>10 tiang + 1 panel\u003c/span>\u003c/button>\u003cbutton class=\"lv\" data-m=\"malam\">\u003cb>Malam\u003c/b>\u003cspan>15 tiang + 1 panel\u003c/span>\u003c/button>\u003cbutton class=\"lv\" data-m=\"hujan\">\u003cb>Hujan\u003c/b>\u003cspan>20 tiang + 1 panel\u003c/span>\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cscript>\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d');\nconst seg=document.getElementById('seg'),lvlEl=document.getElementById('lvl'),lbl=document.getElementById('lbl'),cmb=document.getElementById('cmb');\nconst ov=document.getElementById('ov'),card=document.getElementById('card');\nlet W,H,DPR,S=1;\nfunction rs(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(W/480,H*.58/430)}\naddEventListener('resize',rs);rs();\nconst BASE=200,LH=22;let TOTAL=11;\nlet hist=[],layers=[],cur=null,falls=[],state='menu',level=1,cam=0,night=0,pct=0,last=0,combo=0,flash=[];\nfunction reset(){hist=[];layers=[{x:0,z:0,w:BASE,d:BASE}];falls=[];flash=[];combo=0;perfN=0;maxCombo=0;night=0;cam=0;spawn();state='play';upd()}\nfunction spawn(){\n  const n=layers.length,t=layers[n-1],ax=n%2?'x':'z';\n  cur={ax,w:t.w,d:t.d,x:t.x,z:t.z,dir:1,y:n};\n  cur[ax]=t[ax]-185;\n}\nfunction upd(){\n  const n=layers.length-(state==='play'?0:1);\n  seg.innerHTML=Math.min(n,TOTAL)+'\u003csmall>/11\u003c/small>';\n  lvlEl.textContent='Kota '+level;\n  lbl.textContent=layers.length===TOTAL&&state==='play'?'Modul panel surya':'Segmen tiang';\n}\nfunction col(i,l,s){const t=Math.min(i/10,1);return `hsl(${205-t*155},${60+t*30}%,${(36+t*26)+l}%)`}\nfunction iso(X,Z,Y){return [(X-Z)*.866*S+W/2,(X+Z)*.5*S-Y*S+H*.62+cam*S]}\nfunction box(b,i,yo,panel){\n  const y0=i*LH+(yo||0),y1=y0+LH,hw=b.w/2,hd=b.d/2;\n  const p=(x,z,y)=>iso(b.x+x,b.z+z,y);\n  const poly=(pts,c)=>{ctx.beginPath();pts.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=c;ctx.fill()};\n  if(panel){panelBox(b,y0,y1,hw,hd,p,poly);return}\n  poly([p(-hw,hd,y0),p(hw,hd,y0),p(hw,hd,y1),p(-hw,hd,y1)],panel?'hsl(44,90%,50%)':col(i,-2));\n  poly([p(hw,hd,y0),p(hw,-hd,y0),p(hw,-hd,y1),p(hw,hd,y1)],panel?'hsl(40,85%,42%)':col(i,-9));\n  poly([p(-hw,-hd,y1),p(hw,-hd,y1),p(hw,hd,y1),p(-hw,hd,y1)],panel?'hsl(48,100%,66%)':col(i,7));\n  if(panel){ctx.strokeStyle='#7a5a00';ctx.lineWidth=1.2*S;\n    for(let k=1;k\u003c4;k++){const f=k/4;\n      ctx.beginPath();let a=p(-hw+f*b.w,-hd,y1),c=p(-hw+f*b.w,hd,y1);ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);\n      a=p(-hw,-hd+f*b.d,y1);c=p(hw,-hd+f*b.d,y1);ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke()}}\n}\nfunction panelBox(b,y0,y1,hw,hd,p,poly){\n  const ym=y0+(y1-y0)*.45,ih=hw*.55,id=hd*.55;\n  poly([p(-ih,id,y0),p(ih,id,y0),p(ih,id,ym),p(-ih,id,ym)],'#2b3138');\n  poly([p(ih,id,y0),p(ih,-id,y0),p(ih,-id,ym),p(ih,id,ym)],'#1b2025');\n  poly([p(-hw,hd,ym),p(hw,hd,ym),p(hw,hd,y1),p(-hw,hd,y1)],'hsl(210,10%,74%)');\n  poly([p(hw,hd,ym),p(hw,-hd,ym),p(hw,-hd,y1),p(hw,hd,y1)],'hsl(210,10%,50%)');\n  poly([p(-hw,-hd,y1),p(hw,-hd,y1),p(hw,hd,y1),p(-hw,hd,y1)],'hsl(210,12%,84%)');\n  const m=Math.max(1.5,Math.min(b.w,b.d)*.06),iw=b.w-2*m,idp=b.d-2*m;\n  if(iw\u003c=2||idp\u003c=2)return;\n  const Q=(u,v)=>p(-hw+m+u*iw,-hd+m+v*idp,y1);\n  const A=Q(0,0),B=Q(1,0),C=Q(1,1),D=Q(0,1);\n  const g=ctx.createLinearGradient(D[0],D[1],B[0],B[1]);\n  g.addColorStop(0,'#0c2257');g.addColorStop(.5,'#1d3f8c');g.addColorStop(1,'#0a1c48');\n  poly([A,B,C,D],g);\n  const cols=Math.max(2,Math.round(b.w/32)),rows=Math.max(2,Math.round(b.d/32));\n  const ln=(a,c)=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke()};\n  ctx.lineWidth=Math.max(.5,.5*S);ctx.strokeStyle='rgba(220,230,255,.18)';\n  for(let i=1;i\u003c=cols;i++){const u=(i-.5)/cols;ln(Q(u,0),Q(u,1))}\n  ctx.lineWidth=Math.max(.7,.9*S);ctx.strokeStyle='rgba(190,215,255,.45)';\n  for(let i=1;i\u003ccols;i++)ln(Q(i/cols,0),Q(i/cols,1));\n  for(let j=1;j\u003crows;j++)ln(Q(0,j/rows),Q(1,j/rows));\n  poly([Q(.3,0),Q(.46,0),Q(.16,1),Q(0,1)],'rgba(255,255,255,.12)');\n  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=Math.max(.7,S);\n  ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(C[0],C[1]);ctx.lineTo(D[0],D[1]);ctx.closePath();ctx.stroke();\n}\nfunction place(){\n  const t=layers[layers.length-1],a=cur.ax,sz=a==='x'?'w':'d';\n  const delta=cur[a]-t[a],size=t[sz],ov=size-Math.abs(delta);\n  if(ov\u003c=0){falls.push({...cur,i:layers.length,vy:0,yo:0});hist.push({p:0,m:1});fail();return}\n  const nb={x:cur.x,z:cur.z,w:cur.w,d:cur.d};\n  if(Math.abs(delta)\u003c5){nb[a]=t[a];combo++;if(combo>2)nb[sz]=Math.min(BASE,nb[sz]+10);flash.push({x:nb.x,z:nb.z,w:nb.w,d:nb.d,i:layers.length,t:0});onPerfect(nb)}\n  else{\n    combo=0;nb[sz]=ov;nb[a]=t[a]+delta/2;\n    const f={x:cur.x,z:cur.z,w:cur.w,d:cur.d,i:layers.length,vy:0,yo:0};\n    f[sz]=Math.abs(delta);f[a]=(t[a]+cur[a])/2+Math.sign(delta)*size/2;falls.push(f);\n  }\n  layers.push(nb);hist.push({p:Math.round(nb.w*nb.d/(BASE*BASE)*100),f:Math.abs(delta)\u003c5});\n  if(layers.length>TOTAL){finish()}else{spawn()}\n  upd();\n}\nfunction fail(){pct=0;state='result';upd();show()}\nfunction finish(){\n  const p=layers[TOTAL];pct=Math.round(p.w*p.d/(BASE*BASE)*100);state='result';upd();show();\n}\nfunction an(){\n  const H=hist,n=H.length;if(!n)return '';\n  const ps=H.map(h=>h.p),pf=H.filter(h=>h.f).length,miss=H.some(h=>h.m);\n  let run=0,mr=0;H.forEach(h=>{run=h.f?run+1:0;mr=Math.max(mr,run)});\n  const dr=ps.map((p,i)=>(i?ps[i-1]:100)-p);\n  let wd=0,wi=-1;dr.forEach((l,i)=>{if(l>wd){wd=l;wi=i}});\n  const sum=a=>a.reduce((x,y)=>x+y,0),avg=Math.round(sum(ps)/n),h2=n>>1,a1=sum(ps.slice(0,h2))/(h2||1),a2=sum(ps.slice(h2))/((n-h2)||1);\n  const nm=i=>i===TOTAL-1?'panel':'balok '+(i+1);\n  const sg=d=>d>0?'\\u2212'+d:d\u003c0?'+'+(-d):'0';\n  const last=ps[n-1],prevP=n>1?ps[n-2]:100;\n  let tip;\n  if(miss)tip='Meleset total di '+nm(n-1)+' (tumpukan sebelumnya '+prevP+'%). Ketuk saat blok persis sejajar dengan tumpukan.';\n  else if(pf===n)tip='Semua balok tepat sempurna. Presisi kamu luar biasa!';\n  else if(wd>=20)tip='Satu ketukan di '+nm(wi)+' menghabiskan '+wd+' poin ('+(wi?ps[wi-1]:100)+'% menjadi '+ps[wi]+'%). Setelah itu blok makin sempit dan sulit dikejar. Pelankan ritme tepat sebelum titik itu.';\n  else if(a1-a2>=10)tip='Presisi turun di paruh akhir (rata-rata '+Math.round(a1)+'% lalu '+Math.round(a2)+'%). Blok makin sempit, jadi tunggu sampai benar-benar sejajar.';\n  else if(sum(dr.slice(0,3))>=15)tip='Tiga balok pertama sudah kehilangan '+sum(dr.slice(0,3))+' poin. Ketukan awal menentukan lebar seluruh tiang, jadi mulai dengan tenang.';\n  else if(wd>=12)tip='Penurunan terbesar di '+nm(wi)+': '+(wi?ps[wi-1]:100)+'% menjadi '+ps[wi]+'% (turun '+wd+'). Ketukan terlalu cepat atau terlambat di titik itu.';\n  else tip='Ritme stabil: presisi hilang sedikit demi sedikit dan merata.';\n  const gap=pct\u003c80?' Kurang '+(80-pct)+' poin dari target 80%.':'';\n  const hint=(!miss&&pf\u003cn&&mr\u003c3)?' Tepat sempurna 3 kali berturut-turut akan melebarkan balok kembali.':'';\n  const lab=n\u003c=16,fs=n\u003c=11?11:9;\n  const bars=ps.map((p,i)=>'\u003ci class=\"'+(H[i].f?'pf':i===wi&&wd>=12?'pw':'')+'\" style=\"height:'+Math.max(4,Math.round(p*.62))+'px\"'+(lab?' title=\"'+nm(i)+': '+p+'%\"':'')+'>'+(lab?'\u003cem style=\"font-size:'+fs+'px\">'+(H[i].m?'\\u2715':p)+'\u003c/em>':'')+'\u003c/i>').join('');\n  const idx=lab?'\u003cdiv class=\"bx\">'+ps.map((p,i)=>'\u003cspan style=\"font-size:'+fs+'px\">'+(i===TOTAL-1?'P':i+1)+'\u003c/span>').join('')+'\u003c/div>':'';\n  return '\u003cdiv class=\"an\">\u003cb>Analisis presisi\u003c/b>\u003cdiv class=\"bars\">'+bars+'\u003c/div>'+idx+'\u003cp class=\"seq\">'+ps.join(' \\u00B7 ')+'\u003c/p>\u003cp class=\"dl\">Selisih: '+dr.map(sg).join(' \\u00B7 ')+'\u003c/p>\u003cp>Tepat sempurna '+pf+'/'+n+' \\u00B7 rangkaian terpanjang '+mr+' \\u00B7 rata-rata '+avg+'%\u003c/p>\u003cp>'+tip+gap+hint+'\u003c/p>\u003cp class=\"cap\">Persen = luas balok dibanding pondasi (100%). Kuning = tepat sempurna, merah = penurunan terbesar. P = panel surya.\u003c/p>\u003c/div>';\n}\nfunction show(){\n  let t,d,btn;\n  if(pct>=90){t='Solar Master';d='Panel terpasang nyaris sempurna. PJU menyala terang sepanjang malam.';btn='Kota berikutnya'}\n  else if(pct>=60){t='Standard Operation';d='Tiang sedikit miring dan panel mengecil. Lampu redup dan hanya bertahan setengah malam.';btn='Main lagi'}\n  else{t='Blackout';d='Panel terlalu kecil atau jatuh. PJU gagal beroperasi dan wilayah tetap gelap.';btn='Ulangi level'}\n  card.innerHTML=`\u003ch1>${t}\u003c/h1>\u003cdiv class=\"big\">${pct}%\u003c/div>\u003cp>${d}\u003c/p>\u003cp>Luas panel dibanding pondasi: ${pct}%\u003c/p>${an()}\u003cbutton id=\"go2\">${btn}\u003c/button>`;\n  ov.classList.remove('hide');\n  document.getElementById('go2').onclick=()=>{if(pct>=90)level++;ov.classList.add('hide');reset()};\n}\nconst TIERS=[\n [95,'Lampu jalan','Terang benderang seperti lampu jalan raya. Jalan terang sepanjang malam.','255,248,230'],\n [80,'Lampu taman','Terang nyaman seperti lampu taman kota.','255,236,190'],\n [60,'Lampu teras','Cukup untuk menerangi halaman, seperti bohlam teras rumah.','255,214,140'],\n [40,'Lampu tidur','Redup dan hangat, seperti lampu tidur.','255,190,105'],\n [25,'Lilin fine dining','Temaram romantis seperti lilin di meja makan.','255,165,70'],\n [10,'Nyala korek','Hanya cukup untuk melihat beberapa langkah.','255,140,50'],\n [0,'Blackout','Panel nyaris tidak menangkap cahaya. PJU padam, wilayah tetap gelap.','0,0,0']];\nconst TIERS2=[\n [95,'Lampu jalan','Terang benderang seperti lampu jalan raya. Jalan terang sepanjang malam.'],\n [90,'Lampu jalan kompleks','Terang merata, aman untuk jalan perumahan.'],\n [85,'Lampu parkiran','Terang lebar, seluruh area terlihat jelas.'],\n [80,'Lampu taman kota','Terang nyaman untuk berjalan malam.'],\n [75,'Lampu gerbang','Cukup terang untuk mengenali wajah dari jauh.'],\n [70,'Lampu teras terang','Halaman depan terlihat jelas.'],\n [65,'Lampu teras','Seperti bohlam teras rumah.'],\n [60,'Lampu ruang tamu','Hangat dan cukup untuk beraktivitas.'],\n [55,'Lampu koridor','Cukup untuk berjalan, tapi mulai redup.'],\n [50,'Lampu kamar','Setengah terang, suasana santai.'],\n [45,'Lampu baca','Fokus ke satu area, sekitarnya mulai gelap.'],\n [40,'Lampu tidur','Redup dan hangat, seperti lampu tidur.'],\n [35,'Lampu meja redup','Remang, hanya cukup untuk satu meja.'],\n [30,'Lentera','Cahaya kecil bergoyang seperti lentera.'],\n [25,'Lilin fine dining','Temaram romantis seperti lilin di meja makan.'],\n [10,'Nyala korek','Hanya cukup untuk melihat beberapa langkah.'],\n [0,'Blackout','Panel nyaris tidak menangkap cahaya. PJU padam, wilayah tetap gelap.']];\nfunction tier(p){\n  const t=TIERS2.find(x=>p>=x[0]);\n  const w=Math.max(0,Math.min(1,(p-25)/75));\n  const rgb=p\u003c10?'0,0,0':`255,${Math.round(165+83*w)},${Math.round(70+160*w)}`;\n  return [t[0],t[1],t[2],rgb];\n}\nfunction glow(){\n  if(state!=='result'||layers.length\u003c=TOTAL||pct\u003c10)return;\n  const T=tier(pct),I=pct/100,tm=performance.now()/1000;\n  let f=1;if(pct\u003c40)f=1+.09*Math.sin(tm*9)+.05*Math.sin(tm*23.7+1)+.03*Math.sin(tm*37);\n  const b=layers[TOTAL],c=iso(b.x,b.z,TOTAL*LH-4);\n  const R=(40+380*Math.pow(I,1.2))*S*night*f,a=(.12+.78*I)*Math.min(1,night);\n  ctx.save();ctx.globalCompositeOperation='lighter';\n  const g=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],R);\n  g.addColorStop(0,`rgba(${T[3]},${a})`);g.addColorStop(.25,`rgba(${T[3]},${a*.45})`);g.addColorStop(1,`rgba(${T[3]},0)`);\n  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n  ctx.beginPath();ctx.arc(c[0],c[1],(3+9*I)*S,0,7);ctx.fillStyle=`rgba(255,255,255,${Math.min(1,a+.2)})`;ctx.fill();\n  ctx.restore();\n}\nfunction show(){\n  const T=tier(pct),up=pct>=80;\n  card.innerHTML=`\u003ch1>${T[1]}\u003c/h1>\u003cdiv class=\"big\">${pct}%\u003c/div>\u003cdiv class=\"meter\">\u003ci style=\"width:${pct}%\">\u003c/i>\u003c/div>\u003cp>${T[2]}\u003c/p>\u003cp>${up?'Cukup terang, kota berikutnya terbuka.':'Butuh 80% atau lebih untuk lanjut ke kota berikutnya.'}\u003c/p>\u003cbutton id=\"go2\">${up?'Kota berikutnya':'Main lagi'}\u003c/button>`;\n  ov.style.alignItems='flex-end';ov.classList.remove('hide');\n  document.getElementById('go2').onclick=()=>{if(up)level++;ov.classList.add('hide');reset()};\n}\nconst RM=matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet parts=[],pops=[],shake=0,flashA=0,flashC='255,255,255',cg=0,lastCombo=0;\nfunction upd(){\n  const placed=Math.min(layers.length-1,TOTAL);\n  let h='\u003cdiv class=\"pips\">';\n  for(let i=0;i\u003cTOTAL;i++){\n    const on=i\u003cplaced,cu=state==='play'&&i===placed;\n    const bg=on?(i===TOTAL-1?'hsl(46,95%,56%)':col(i+1,0)):'';\n    h+=`\u003ci class=\"pip${cu?' cur':''}\"${bg?` style=\"background:${bg}\"`:''}>\u003c/i>`;\n  }\n  seg.innerHTML=h+'\u003c/div>';\n  lvlEl.textContent='Dusun Kiarakoneng 1 · '+MODE.name;\n  lbl.textContent=state==='play'?(layers.length>=TOTAL?'Pasang panel surya':'Segmen tiang '+layers.length+' dari '+(TOTAL-1)):'Selesai';\n  cmb.textContent=combo>=2?'Combo ×'+combo:(combo===1?'Perfect':'');\n  if(combo>lastCombo){cmb.classList.remove('bump');void cmb.offsetWidth;cmb.classList.add('bump')}\n  lastCombo=combo;lvlEl.textContent='Dusun Kiarakoneng 1';\n  lbl.textContent=state==='play'?MODE.name+' · '+(layers.length>=TOTAL?'Panel surya':'Tiang '+layers.length+'/'+(TOTAL-1)):'Selesai';\n  const hn=document.getElementById('hint'),pz=document.getElementById('pz'),hd=document.getElementById('hud');\n  hn.classList.toggle('hide',!(state==='play'&&layers.length===1));\n  pz.classList.toggle('hide',state!=='play'&&state!=='pause');\n  hd.classList.toggle('hide',state==='menu');eduTick();\n}\nfunction onPerfect(nb){perfN++;maxCombo=Math.max(maxCombo,combo);sfxPerfect(combo);\n  const big=combo>=3,y=layers.length*LH+LH,hw=nb.w/2,hd=nb.d/2,cc=iso(nb.x,nb.z,y);\n  shake=RM?0:Math.min(1,.25+.12*combo);\n  flashA=RM?.06:(big?.28:.14);flashC=big?'255,226,120':'255,255,255';\n  const N=RM?8:Math.min(60,14+combo*8);\n  for(let k=0;k\u003cN;k++){\n    const s=Math.rando 0:[58,74,90],c1:[112,130,140],stars:false,rain:true}};\nlet MODE=MODES.siang;\nconst MENU_HTML=card.innerHTML;\nlvlEl.textContent='';lbl.textContent='';\nfunction bindMenu(){document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMode(b.dataset.m))}\nfunction startMode(m){MODE=MODES[m];TOTAL=MODE.total;ov.classList.add('hide');ov.style.alignItems='center';reset()}\nfunction showMenu(){\n  state='menu';layers=[];falls=[];parts=[];pops=[];flash=[];combo=0;lastCombo=0;night=0;cam=0;cur=null;\n  seg.innerHTML='';cmb.textContent='';lbl.textContent='';lvlEl.textContent='';\n  card.innerHTML=MENU_HTML;bindMenu();ov.style.alignItems='center';ov.classList.remove('hide');\n}\nconst STARS=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.65,r:.6+Math.random()*1.4,p:Math.random()*6}));\nfunction drawSky(){\n  if(!MODE.stars)return;\n  const t=performance.now()/1000;\n  ctx.save();ctx.fillStyle='#fff';\n  STARS.forEach(s=>{ctx.globalAlpha=RM?.6:.35+.45*Math.abs(Math.sin(t*.8+s.p));ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*Math.max(1,S),0,7);ctx.fill()});\n  const mx=W*.17,my=H*.32,mr=Math.min(W,H)*.05;\n  const g=ctx.createRadialGradient(mx,my,mr*.8,mx,my,mr*3.2);\n  g.addColorStop(0,'rgba(240,238,210,.35)');g.addColorStop(1,'rgba(240,238,210,0)');\n  ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);\n  ctx.fillStyle='#f4f1da';ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();\n  ctx.restore();\n}\nconst DROPS=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),l:10+Math.random()*16,v:.9+Math.random()*.7}));\nfunction drawRain(){\n  if(!MODE.rain)return;\n  const t=performance.now()/1000,n=RM?30:DROPS.length;\n  ctx.save();ctx.strokeStyle='rgba(205,225,245,.4)';ctx.lineWidth=Math.max(1,1.2*S);ctx.beginPath();\n  for(let i=0;i\u003cn;i++){const d=DROPS[i],y=((d.y+t*d.v*(RM?0:1))%1)*H,x=(d.x*W+y*.15)%W,l=d.l*S;ctx.moveTo(x,y);ctx.lineTo(x-l*.15,y-l)}\n  ctx.stroke();ctx.restore();\n}\nlet VDK=0;\nfunction cbox(cx,cz,w,d,y0,h, n  VITEMS.forEach(o=>{\n    const x=o[1],z=o[2];\n    if(o[0]==='h'){const w=o[3],d=o[4];\n      cbox(x,z,w,d,0,30,C_CREAM);cbox(x,z+d/2+.5,14,2,10,12,C_WIN);\n      cbox(x,z,w+10,d+10,30,7,C_ROOF);cbox(x,z,w-8,d-8,37,9,C_ROOF2);\n    }else if(o[0]==='t'){\n      cbox(x,z,8,8,0,14,C_TRUNK);cbox(x,z,32,32,14,18,C_LEAF1);cbox(x,z,24,24,32,16,C_LEAF2);cbox(x,z,15,15,48,14,C_LEAF3);\n    }else{\n      cbox(x,z,o[3],o[4],0,5,C_FIELD,C_FIELDS);\n      for(let k=-1;k\u003c=1;k++)cbox(x,z+k*o[4]/3,o[3]-10,o[4]/7,5,1.5,C_ROW);\n    }\n  });\n}\nlet perfN=0,maxCombo=0,curKey='siang';\nfunction loadBest(){try{return JSON.parse(localStorage.getItem('sts_best')||'{}')}catch(e){return{}}}\nfunction saveBest(o){try{localStorage.setItem('sts_best',JSON.stringify(o))}catch(e){}}\nlet BEST=loadBest();\nfunction menuHTML(){\n  const b=k=>BEST[k]!=null?`Rekor ${BEST[k]}%`:'Belum dimainkan';\n  const L=(k,ic,n,s)=>`\u003cbutton class=\"lv\" data-m=\"${k}\">\u003cspan class=\"ic\" aria-hidden=\"true\">${ic}\u003c/span>\u003cspan class=\"tx\">\u003cb>${n}\u003c/b>\u003csmall>${s}\u003c/small>\u003c/span>\u003cspan class=\"bs\">${b(k)}\u003c/span>\u003c/button>`;\n  return `\u003ch1>Kiara Stack\u003c/h1>\u003cp class=\"sub\">Terangi Dusun Kiarakoneng 1 dengan PJU tenaga surya.\u003c/p>\u003cp class=\"how\">Ketuk layar tepat saat blok sejajar. Susun tiang, lalu pasang panel surya di puncak.\u003c/p>\u003cdiv class=\"lvls\">${L('siang','☀️','Siang','10 tiang + 1 panel')}${L('malam','🌙','Malam','15 tiang + 1 panel')}${L('hujan','🌧️','Hujan','20 tiang + 1 panel')}\u003c/div>\u003cbutton class=\"alt mu2\" id=\"mu2\" type=\"button\">\u003c/button>`;\n}\nfunction startMode(m){curKey=m;MODE=MODES[m];TOTAL=MODE.total;ov.classList.add('hide');ov.style.alignItems='center';reset()}\nfunction showMenu(){\n  state='menu';layers=[];falls=[];parts=[];pops=[];flash=[];combo=0;lastCombo=0;night=0;cam=0;cur=null;\n  seg.innerHTML='';cmb.textContent='';lbl.textContent='';lvlEl.textContent='';\n  ['hud','hint'].forEach(i=>document.getElementById(i).classList.add('hide'));\n  card.innerHTML=menuHTML();bindMenu();ov.style.alignItems='center';ov.classList.remove('hide');\n}\nfunction pauseGame(){\n  if(state!=='play')return;\n  state='pause';\n  card.innerHTML='\u003ch1>Dijeda\u003c/h1>\u003cp>Posisi blok tetap tersimpan.\u003c/p>\u003cdiv class=\"row\">\u003cbutton id=\"rs\">Lanjut\u003c/button>\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"rt\" class=\"alt\">Ulangi\u003c/button>\u003cbutton id=\"mn\" class=\"alt\">Pilih level\u003c/button>\u003c/div>';\n  ov.style.alignItems='center';ov.classList.remove('hide');\n  document.getElementById('rs').onclick=()=>{ov.classList.add('hide');state='play'};\n  document.getElementById('rt').onclick=()=>{ov.classList.add('hide');reset()};\n  document.getElementById('mn').onclick=showMenu;\n}\ndocument.getElementById('pz').onclick=pauseGame;\naddEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pauseGame();else if(state==='pause'){const r=document.getElementById('rs');if(r)r.click()}}});\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});\nfunction show(){\n  const T=tier(pct),up=pct>=80,prev=BEST[curKey]||0,rec=pct>prev&&pct>0;\n  if(rec){BEST[curKey]=pct;saveBest(BEST)}\n  const msg=pct>=95?'Dusun Kiarakoneng 1 terang benderang!':up?'Dusun Kiarakoneng 1 kini terang. Kejar 95% untuk lampu jalan penuh.':'Dusun Kiarakoneng 1 masih kurang terang. Targetnya 80% atau lebih.';\n  card.innerHTML=`${rec?'\u003cdiv class=\"rec\">Rekor baru\u003c/div>':''}\u003ch1>${T[1]}\u003c/h1>\u003cdiv class=\"big\">${pct}%\u003c/div>\u003cdiv class=\"meter\">\u003ci style=\"width:${pct}%\">\u003c/i>\u003c/div>\u003cp>${T[2]}\u003c/p>\u003cp>${msg}\u003c/p>\u003cdiv class=\"stat\">\u003cspan>Perfect ${perfN}\u003c/span>\u003cspan>Combo terbaik ×${maxCombo}\u003c/span>${prev?`\u003cspan>Rekor ${Math.max(prev,pct)}%\u003c/span>`:''}\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"go2\">${up?'Main lagi':'Main lagi'}\u003c/button>\u003cbutton id=\"go3\" class=\"alt\">Pilih level\u003c/button>\u003c/div>`;\n  ov.style.alignItems='flex-end';ov.classList.remove('hide');\n  document.getElementById('go2').onclick=()=>{ov.classList.add('hide');reset()};\n  document.getElementById('go3').onclick=showMenu;\n}\ncard.innerHTML=menuHTML();document.getElementById('hud').classList.add('hide');\n/* ===== MUSIK \"Terang di Kiarakoneng\" =====\n   Komposisi orisinal. C mayor pentatonik, 4/4, 8 birama, loop. Akord: C|F|Am|G|C|F|G|C\n   Melodi: | E5 G5 A5 G5 | E5 D5 C5(2) | D5 E5 G5 E5 | D5(2) C5 A4 | C5 E5 G5 A5 | C6(1.5) A5(.5) G5(2) | E5 G5 E5 D5 | C5(4) |\n   Format lead: [nomor MIDI, ketukan mulai, durasi ketukan]. Bass: akar di ketukan 1, kuint di ketukan 3. */\nconst SONG={title:'Terang di Kiarakoneng',beats:32,\n lead:[[76,0,1],[79,1,1],[81,2,1],[79,3,1],[76,4,1],[74,5,1],[72,6,2],[74,8,1],[76,9,1],[79,10,1],[76,11,1],[74,12,2],[72,14,1],[69,15,1],[72,16,1],[76,17,1],[79,18,1],[81,19,1],[84,20,1.5],[81,21.5,.5],[79,22,2],[76,24,1],[79,25,1],[76,26,1],[74,27,1],[72,28,4]],\n bassRoots:[48,41,45,43,48,41,43,48],bassFifth:[55,48,52,50,55,48,50,55]};\nconst MCFG={siang:{bpm:100,wave:'triangle',lp:4000,hat:true,rain:false,lv:.14},malam:{bpm:76,wave:'sine',lp:2200,hat:false,rain:false,lv:.18},hujan:{bpm:88,wave:'triangle',lp:1500,hat:false,rain:true,lv:.15}};\nlet AC=null,MUS=null,NB=null,musicOn=true,_ms='';\ntry{musicOn=localStorage.getItem('sts_music')!=='0'}catch(e){}\nconst mf=m=>440*Math.pow(2,(m-69)/12);\nfunction note(t,m,dur,type,vol,dest){\n  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mf(m);\n  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);\n  g.gain.exponentialRampToValueAtTime(vol*.35,t+dur*.8);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.12);\n  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.2);\n}\nfunction noiseBuf(sec){const b=AC.createBuffer(1,Math.floor(AC.sampleRate*sec),AC.sampleRate),d=b.getChannelData(0);for(let i=0;i\u003cd.length;i++)d[i]=Math.random()*2-1;return b}\nfunction hat(t,dest){\n  if(!NB)NB=noiseBuf(.06);\n  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();\n  s.buffer=NB;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);\n  s.connect(f);f.connect(g);g.connect(dest);s.start(t);\n}\nfunction playLoop(M,start){\n  const c=M.c,spb=M.spb;\n  SONG.lead.forEach(n=>note(start+n[1]*spb,n[0],n[2]*spb*.95,c.wave,c.lv,M.lpf));\n  for(let b=0;b\u003c8;b++){\n    note(start+b*4*spb,SONG.bassRoots[b],1.9*spb,'sine',.2,M.master);\n    note(start+(b*4+2)*spb,SONG.bassFifth[b],1.9*spb,'sine',.14,M.master);\n    if(c.hat)for(let k=1;k\u003c4;k+=2)hat(start+(b*4+k)*spb,M.master);\n  }\n}\nfunction _oldMStop(){\n  if(!MUS||!AC)return;\n  const M=MUS;MUS=null;clearInterval(M.timer);\n  M.master.gain.setTargetAtTime(0,AC.currentTime,.1);\n  setTimeout(()=>{try{M.master.disconnect();if(M.rain)M.rain.stop()}catch(e){}},700);\n}\nfunction _oldMS(key){\n  if(!musicOn)return;\n  try{\n    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();\n    if(AC.state==='suspended')AC.resume();\n    if(MUS&&MUS.key===key)return;\n    musicStop();\n    const c=MCFG[key],master=AC.createGain(),lpf=AC.createBiquadFilter();\n    master.gain.value=.0001;master.connect(AC.destination);\n    master.gain.setTargetAtTime(1,AC.currentTime,.4);\n    lpf.type='lowpass';lpf.frequency.value=c.lp;lpf.connect(master);\n    const M={key,c,master,lpf,spb:60/c.bpm,next:AC.currentTime+.1,rain:null,timer:0};\n    if(c.rain){\n      const r=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();\n      r.buffer=noiseBuf(2);r.loop=true;f.type='bandpass';f.frequency.value=1100;f.Q.value=.6;g.gain.value=.05;\n      r.connect(f);f.connect(g);g.connect(master);r.start();M.rain=r;\n    }\n    MUS=M;_ms='';\n    const tick=()=>{if(AC.currentTime+3>M.next){playLoop(M,M.next);M.next+=SONG.beats*M.spb}};\n    tick();M.timer=setInterval(tick,500);\n  }catch(e){}\n}\nfunction musicStart(key){try{parent.postMessage({sa:'music',key:key},'*');if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}\nfunction musicStop(){}\nfunction musicTick(){\n  if(!MUS||_ms===state)return;_ms=state;\n  const v=state==='play'?1:state==='pause'?.3:state==='result'?.55:.7;\n  MUS.master.gain.setTargetAtTime(v,AC.currentTime,.25);\n}\nfunction sfxPerfect(n){\n  if(!musicOn||!AC||AC.state!=='running')return;\n  const sc=[72,74,76,79,81,84,86,88],i=Math.min(Math.max(n,1)-1,6),t=AC.currentTime;\n  note(t,sc[i]+12,.3,'sine',.12,AC.destination);note(t+.07,sc[i+1]+12,.35,'sine',.1,AC.destination);\n}\nfunction syncMu(){\n  const a=document.getElementById('mu'),b=document.getElementById('mu2');\n  if(a){a.textContent=musicOn?'🔊':'🔇';a.setAttribute('aria-pressed',String(musicOn))}\n  if(b)b.textContent=musicOn?'🔊 Musik: '+SONG.title:'🔇 Musik mati';\n}\nfunction setMusic(on){\n  musicOn=on;try{localStorage.setItem('sts_music',on?'1':'0')}catch(e){}\n  if(on)musicStart(curKey);else musicStop();\n  syncMu();\n}\nfunction bindMenu(){\n  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMode(b.dataset.m));\n  const b=document.getElementById('mu2');if(b)b.onclick=()=>setMusic(!musicOn);\n  const l=document.getElementById('lrn');if(l)l.onclick=()=>showLearn(0);\n  syncMu();\n}\nfunction startMode(m){curKey=m;MODE=MODES[m];TOTAL=MODE.total;ov.classList.add('hide');ov.style.alignItems='center';musicStart(m);reset()}\ndocument.getElementById('mu').onclick=()=>setMusic(!musicOn);\ndocument.addEventListener('visibilitychange',()=>{if(AC){if(document.hidden)AC.suspend();else if(musicOn)AC.resume()}});\nconst FACTS=[\n 'PJU tenaga surya menyalakan lampu dari listrik yang dibuat sendiri oleh panel surya, tanpa kabel dari jaringan PLN.',\n 'Panel surya mengubah cahaya matahari menjadi listrik arus searah (DC). Listriknya disimpan di baterai untuk dipakai malam hari.',\n 'Solar charge controller mengatur pengisian dan pemakaian baterai agar tidak terisi berlebihan atau terkuras habis, sehingga baterai lebih awet.',\n 'Sensor cahaya membuat lampu menyala otomatis saat gelap dan padam saat pagi, tanpa saklar.',\n 'Lampu LED jauh lebih hemat energi daripada lampu pijar, jadi cocok untuk sistem berdaya terbatas seperti PJU surya.',\n 'Di wilayah selatan khatulistiwa seperti Pulau Jawa, panel surya biasanya menghadap utara dengan kemiringan kecil.',\n 'Debu, kotoran burung, dan bayangan pohon mengurangi listrik yang dihasilkan panel. Membersihkannya berkala menjaga lampu tetap terang.',\n 'Tiang PJU umumnya dilapisi galvanis supaya tahan karat menghadapi hujan dan panas bertahun-tahun.',\n 'Indonesia berada di wilayah tropis dengan sinar matahari melimpah sepanjang tahun, sangat cocok untuk tenaga surya.',\n 'Panel yang terlalu panas justru sedikit menurun efisiensinya, jadi cahaya terik tidak selalu berarti listrik maksimal.',\n 'Dusun yang jauh dari jaringan listrik sangat terbantu PJU surya karena tidak perlu menarik kabel panjang.',\n 'Sebagian PJU surya bisa meredupkan lampu di tengah malam untuk menghemat energi baterai.'];\nconst MFACTS={\n siang:['Siang hari adalah waktu panel bekerja: setiap jam cahaya matahari yang diterima menjadi energi cadangan untuk malam nanti.'],\n malam:['Saat malam, lampu hanya memakai listrik yang disimpan baterai sejak siang.','Kapasitas baterai menentukan berapa lama lampu bisa menyala setelah gelap.'],\n hujan:['Saat mendung atau hujan, panel tetap menghasilkan listrik tetapi jauh lebih sedikit. Karena itu baterai dirancang menyimpan cadangan untuk beberapa hari.','Hujan ikut membersihkan debu dari permukaan panel, tetapi cahaya yang berkurang tetap membuat listrik yang dihasilkan turun.']};\nconst LEARN=[\n {t:'Apa itu PJU tenaga surya?',h:'\u003cp>PJU adalah Penerangan Jalan Umum. Pada PJU tenaga surya, lampu jalan menyala dari listrik yang dihasilkan sendiri oleh panel surya, tanpa kabel dari jaringan PLN.\u003c/p>\u003cp>Karena itu cocok untuk dusun atau jalan yang jauh dari jaringan listrik, seperti Dusun Kiarakoneng 1 di game ini.\u003c/p>'},\n {t:'Komponen utama',h:'\u003cul>\u003cli>\u003cb>Panel surya\u003c/b>: mengubah cahaya matahari menjadi listrik.\u003c/li>\u003cli>\u003cb>Baterai\u003c/b>: menyimpan listrik untuk malam hari.\u003c/li>\u003cli>\u003cb>Solar charge controller\u003c/b>: mengatur pengisian dan pemakaian baterai.\u003c/li>\u003cli>\u003cb>Lampu LED\u003c/b>: terang dan hemat energi.\u003c/li>\u003cli>\u003cb>Tiang\u003c/b>: menopang semuanya, biasanya galvanis tahan karat.\u003c/li>\u003c/ul>\u003cp>Di game: segmen tiang disusun dulu, lalu panel surya dipasang di puncak.\u003c/p>'},\n {t:'Cara kerja siang dan malam',h:'\u003cul>\u003cli>\u003cb>Siang\u003c/b>: panel menghasilkan listrik, controller mengisi baterai.\u003c/li>\u003cli>\u003cb>Malam\u003c/b>: sensor cahaya mendeteksi gelap, lampu LED menyala dari listrik baterai.\u003c/li>\u003cli>\u003cb>Pagi\u003c/b>: sensor mematikan lampu dan siklus dimulai lagi.\u003c/li>\u003c/ul>\u003cp>Saat mendung atau hujan panel tetap bekerja, tetapi hasilnya jauh lebih kecil, jadi baterai dirancang menyimpan cadangan beberapa hari.\u003c/p>'},\n {t:'Kenapa presisi penting?',h:'\u003cp>Energi yang dihasilkan bergantung pada luas panel yang menangkap cahaya dan arah hadapnya. Di wilayah selatan khatulistiwa seperti Pulau Jawa, panel umumnya menghadap utara dengan kemiringan kecil.\u003c/p>\u003cp>Bayangan, debu, dan kotoran mengurangi hasilnya. Di game, persentase luas panel terhadap pondasi menentukan kecerahan lampu, dari lampu jalan sampai lilin.\u003c/p>'},\n {t:'Perawatan dan manfaat',h:'\u003cul>\u003cli>Bersihkan permukaan panel dari debu dan kotoran secara berkala.\u003c/li>\u003cli>Pangkas ranting yang menimbulkan bayangan.\u003c/li>\u003cli>Periksa baterai dan sambungan kabel.\u003c/li>\u003c/ul>\u003cp>Manfaatnya: tanpa tagihan listrik, ramah lingkungan, dan jalan lebih aman di malam hari.\u003c/p>'}];\nfunction showLearn(i){\n  const p=LEARN[i],last=i>=LEARN.length-1;\n  card.innerHTML=`\u003cdiv class=\"lp\">\u003ch2>${p.t}\u003c/h2>${p.h}\u003c/div>\u003cdiv class=\"dots\">${LEARN.map((_,k)=>`\u003ci class=\"${k===i?'on':''}\">\u003c/i>`).join('')}\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"lb\" class=\"alt\">${i?'Sebelumnya':'Kembali'}\u003c/button>\u003cbutton id=\"ln\">${last?'Selesai':'Berikutnya'}\u003c/button>\u003c/div>`;\n  ov.style.alignItems='center';ov.classList.remove('hide');\n  document.getElementById('lb').onclick=()=>i?showLearn(i-1):showMenu();\n  document.getElementById('ln').onclick=()=>last?showMenu():showLearn(i+1);\n}\nlet eduPool=[],eduKey='',_edu=-1,toastT=0;\nfunction pickFact(){const p=FACTS.concat(MFACTS[curKey]||[]);return p[Math.random()*p.length|0]}\nfunction nextFact(){\n  if(eduKey!==curKey||!eduPool.length){eduKey=curKey;eduPool=FACTS.concat(MFACTS[curKey]||[]).sort(()=>Math.random()-.5)}\n  return eduPool.pop();\n}\nfunction eduTick(){\n  const t=document.getElementById('toast');if(!t)return;\n  if(state!=='play'){t.classList.add('hide');return}\n  const p=layers.length-1;if(p===_edu)return;_edu=p;\n  if(p>0&&p%3===0&&p\u003cTOTAL-1){\n    t.innerHTML='\u003cb>💡 Tahukah kamu?\u003c/b>'+nextFact();t.classList.remove('hide');\n    clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hide'),5500);\n  }\n}\nfunction eduResult(p){\n  if(p>=95)return 'Panel terpasang presisi, jadi seluruh sel surya menangkap cahaya. Baterai terisi penuh dan lampu menyala terang sepanjang malam.';\n  if(p>=80)return 'Sebagian kecil permukaan panel hilang. Daya turun sedikit, tetapi baterai masih cukup untuk menyalakan lampu hingga pagi.';\n  if(p>=60)return 'Luas panel berkurang cukup banyak, jadi baterai terisi lebih lambat. Controller bisa meredupkan lampu agar tetap menyala sampai pagi.';\n  if(p>=25)return 'Energi yang terkumpul sangat terbatas, sehingga lampu redup atau cepat padam. Panel yang kotor atau terhalang bayangan punya efek serupa.';\n  return 'Hampir tidak ada energi yang tersimpan, jadi lampu tidak bisa menyala. Itu sebabnya PJU surya dirancang dengan panel dan baterai yang cukup besar.';\n}\nfunction show(){\n  const T=tier(pct),up=pct>=80,prev=BEST[curKey]||0,rec=pct>prev&&pct>0;\n  if(rec){BEST[curKey]=pct;saveBest(BEST)}\n  card.innerHTML=`${rec?'\u003cdiv class=\"rec\">Rekor baru\u003c/div>':''}\u003ch1>${T[1]}\u003c/h1>\u003cdiv class=\"big\">${pct}%\u003c/div>\u003cdiv class=\"meter\">\u003ci style=\"width:${pct}%\">\u003c/i>\u003c/div>\u003cp>${T[2]}\u003c/p>${an()}\u003cdiv class=\"edu\">\u003cb>Kenapa begitu?\u003c/b>${eduResult(pct)}\u003c/div>\u003cdiv class=\"edu\">\u003cb>💡 Tahukah kamu?\u003c/b>${pickFact()}\u003c/div>\u003cdiv class=\"stat\">\u003cspan>Perfect ${perfN}\u003c/span>\u003cspan>Combo terbaik ×${maxCombo}\u003c/span>${prev?`\u003cspan>Rekor ${Math.max(prev,pct)}%\u003c/span>`:''}\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"go2\">${up?'Main lagi':'Main lagi'}\u003c/button>\u003cbutton id=\"go3\" class=\"alt\">Pilih level\u003c/button>\u003c/div>`;\n  ov.style.alignItems='flex-end';ov.classList.remove('hide');\n  document.getElementById('go2').onclick=()=>{ov.classList.add('hide');reset()};\n  document.getElementById('go3').onclick=showMenu;\n}\nfunction tap(){if(state==='play')place()}\ncv.addEventListener('pointerdown',tap);\naddEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap()}});\nbindMenu();\nfunction frame(ts){\n  const dt=Math.min((ts-last)/1000||0,.05);last=ts;\n  if(state==='play'){\n    const t=layers[layers.length-1],a=cur.ax,sp=Math.min(330,(130+level*22+layers.length*3)*MODE.sp);\n    cur[a]+=cur.dir*sp*dt;\n    if(cur[a]>t[a]+185){cur[a]=t[a]+185;cur.dir=-1}\n    if(cur[a]\u003ct[a]-185){cur[a]=t[a]-185;cur.dir=1}\n  }\n  const n=layers.length;\n  const pc=cam;cam+=(Math.max(0,(n-4)*LH)-cam)*Math.min(1,dt*4);parts.forEach(p=>p.y+=(cam-pc)*S);updFx(dt);\n  night+=((state==='result'?1:0)-night)*Math.min(1,dt*1.5);\n  falls.forEach(f=>{f.vy+=900*dt;f.yo-=f.vy*dt});\n  falls=falls.filter(f=>f.yo>-1500);flash.forEach(f=>f.t+=dt*2.2);flash=flash.filter(f=>f.t\u003c1);\n  requestAnimationFrame(frame);draw();\n}\nfunction draw(){\n  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.translate((Math.random()-.5)*shake*6,(Math.random()-.5)*shake*6);\n  const g=ctx.createLinearGradient(0,0,0,H);\n  const m=(a,b)=>Math.round(a+(b-a)*night);\n  g.addColorStop(0,`rgb(${m(MODE.c0[0],10)},${m(MODE.c0[1],20)},${m(MODE.c0[2],40)})`);\n  g.addColorStop(1,`rgb(${m(MODE.c1[0],22)},${m(MODE.c1[1],40)},${m(MODE.c1[2],50)})`);\n  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n  // camera offset: draw with world shifted by cam (screen px via iso)\n  drawSky();drawVillage();\n  layers.forEach((b,i)=>box(b,i,0,i===TOTAL));\n  if((state==='play'||state==='pause')&&cur){box(cur,layers.length,0,layers.length===TOTAL)}\n  falls.forEach(f=>box(f,f.i,f.yo,f.i===TOTAL));\n  flash.forEach(f=>{const e=f.t*45,hw=f.w/2+e,hd=f.d/2+e,y=f.i*LH+LH;ctx.strokeStyle=`rgba(255,255,255,${1-f.t})`;ctx.lineWidth=3*S;ctx.beginPath();[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].forEach((q,k)=>{const p=iso(f.x+q[0],f.z+q[1],y);k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.closePath();ctx.stroke()});\n  glow();drawFx();drawRain();\n  if(false){\n    const b=layers[TOTAL],c=iso(b.x,b.z,TOTAL*LH+LH+4);\n    const r=(pct>=90?260:130)*S*night;\n    const rg=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],r);\n    rg.addColorStop(0,'rgba(255,236,150,.95)');rg.addColorStop(1,'rgba(255,220,100,0)');\n    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);\n  }\n}\nrequestAnimationFrame(frame);\n\u003c/script>\n\u003cbutton id=\"bkx\" aria-label=\"Kembali ke pilihan game\">‹\u003c/button>\n\u003cscript>(function(){var b=document.getElementById(\"bkx\");b.addEventListener(\"pointerdown\",function(e){e.stopPropagation()});b.addEventListener(\"click\",function(){parent.postMessage(\"sa-back\",\"*\")})})();\u003c/script>\n\u003c/body>\n\u003c/html>\n","grid":"\u003c!DOCTYPE html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n\u003ctitle>Kiara Beam\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;--ink:#0e3b43;--card:#ffffffee;--btn:#f2b705;--btnt:#2b2200}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--ink:#e8fff6;--card:#10262cee}}\n:root[data-theme=\"dark\"]{--ink:#e8fff6;--card:#10262cee}\nhtml,body{height:100%;margin:0;background:#2a9d9a;font-family:\"Trebuchet MS\",\"Segoe UI\",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}\ncanvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}\n.pnl{background:rgba(8,28,36,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:8px 12px;line-height:1.45;color:#fff}\n#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}\n#ttl{font-weight:700;font-size:14px}#mv{font-size:13px;letter-spacing:.5px}\n.btns{display:flex;gap:6px}\n.btns button{pointer-events:auto;margin:0;width:42px;height:42px;padding:0;border-radius:12px;background:rgba(8,28,36,.42);color:#fff;font-size:19px}\n#leg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:max-content;max-width:94vw;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:12px;pointer-events:none}\n.sw{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:5px;vertical-align:-2px}\n.s1{background:linear-gradient(135deg,#1c3a8a,#3b64c8)}.s2{background:linear-gradient(135deg,#dbe9ff,#7aaee6)}.s3{background:linear-gradient(135deg,#ffd98a,#f0a64c)}.s4{background:#ffd84a;border-radius:50%}.s0{background:#ffb81c;border-radius:50%;box-shadow:0 0 0 2px #ffe27a}.s5{background:#c9573a}\n#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);width:min(92vw,420px);background:rgba(8,28,36,.78);color:#fff;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.45;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n#toast b{display:block;color:#ffe27a;font-size:12px;margin-bottom:2px}\n#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}\n.card{background:var(--card);color:var(--ink);border-radius:18px;padding:22px 20px 18px;width:min(100%,380px);max-height:100%;overflow:auto;text-align:center;box-shadow:0 12px 40px #0005;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.card h1{font-size:25px;margin:0 0 8px;font-weight:600}\n.card p{margin:6px 0;font-size:14px;line-height:1.5}\n.big{font-size:44px;margin:4px 0;color:#e0a800;letter-spacing:4px}\nbutton{margin-top:14px;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}\nbutton:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\nbutton:disabled{opacity:.35;cursor:default}\n.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}\n.row{display:flex;gap:8px}.row button{flex:1;margin-top:10px;padding:12px 8px}\n.lvg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}\n.lvg button{margin:0;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:12px}\n.lvg b{font-size:20px}.lvg small{font-size:10px;letter-spacing:0}\n.how{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:13px;margin:8px 0 0;line-height:1.4}\n.edu{background:rgba(242,183,5,.18);border-radius:12px;padding:8px 12px;margin-top:8px;text-align:left;font-size:13px;line-height:1.45}\n.edu b{display:block;font-size:12px;margin-bottom:2px}\n.rec{display:inline-block;background:var(--btn);color:var(--btnt);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:6px}\n.hide{display:none!important}\n#toast{bottom:calc(env(safe-area-inset-bottom,0px) + var(--lh,40px) + 18px);pointer-events:auto}\n@media (max-width:520px),(max-height:520px){\n #hud{padding:8px}\n .pnl{padding:6px 10px;border-radius:10px}\n #hud>.pnl:first-child{flex:1;min-width:0}\n #ttl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n #mv{font-size:12px;letter-spacing:0}\n .btns button{width:44px;height:44px}\n #leg{font-size:11px;gap:2px 10px;padding:5px 8px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}\n #toast{font-size:12px;padding:8px 12px}\n .card{padding:18px 16px 14px;border-radius:16px}\n .card h1{font-size:22px}\n .how{font-size:12.5px}\n .lvg{gap:6px}.lvg button{min-height:54px}\n button{min-height:44px}\n}\n#bkx{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 12px);right:110px;width:42px;height:42px;min-height:0;margin:0;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:rgba(8,28,36,.42);color:#fff;font:700 26px/1 \"Trebuchet MS\",sans-serif;letter-spacing:0;text-transform:none;box-shadow:none;cursor:pointer}\n#bkx:focus-visible{outline:3px solid #fff;outline-offset:2px}\n#ov[style*=\"flex-end\"]{z-index:30;align-items:flex-start!important;background:#0f7a74;padding:calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);overflow:auto;animation:pgin .3s ease-out}\n#ov[style*=\"flex-end\"] .card{--ink:#fff;--card:transparent;background:transparent;color:#fff;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-height:none;overflow:visible;width:min(100%,420px);margin:auto;padding:0;text-align:center}\n#ov[style*=\"flex-end\"] .card:has(.big)::before{content:\"Hasil permainan\";display:block;font-size:13px;letter-spacing:4px;text-transform:uppercase;opacity:.75;margin-bottom:14px}\n#ov[style*=\"flex-end\"] .big{font-size:96px;font-weight:900;line-height:1;margin:6px 0}\n#ov[style*=\"flex-end\"] .card h1{font-size:30px;font-weight:900}\n@keyframes pgin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cdiv id=\"hud\" class=\"hide\">\u003cdiv class=\"pnl\">\u003cdiv id=\"ttl\">\u003c/div>\u003cdiv id=\"mv\">\u003c/div>\u003c/div>\u003cdiv class=\"btns\">\u003cbutton id=\"rst\" aria-label=\"Ulangi level\">&#8635;\u003c/button>\u003cbutton id=\"mnb\" aria-label=\"Menu\">&#9776;\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv id=\"toast\" class=\"hide\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cdiv id=\"leg\" class=\"pnl hide\">\u003cspan>\u003ci class=\"sw s0\">\u003c/i>Matahari\u003c/span>\u003cspan>\u003ci class=\"sw s2\">\u003c/i>Cermin\u003c/span>\u003cspan>\u003ci class=\"sw s3\">\u003c/i>Prisma\u003c/span>\u003cspan>\u003ci class=\"sw s1\">\u003c/i>Panel\u003c/span>\u003cspan>\u003ci class=\"sw s4\">\u003c/i>Lampu\u003c/span>\u003cspan>\u003ci class=\"sw s5\">\u003c/i>Halangan\u003c/span>\u003c/div>\n\u003cdiv id=\"ov\">\u003cdiv class=\"card\" id=\"card\">\u003c/div>\u003c/div>\n\u003cscript>\n/* Kiara Beam. Teman dari \"Kiara Stack\".\n   Kode sel: . kosong | # bangunan | T pohon | S semak | C awan mendung | P panel surya (target sinar) | L lampu PJU (menyala jika panel di sebelahnya kena sinar) | a cermin \"/\" | b cermin \"\\\" (bisa diputar) | A,B cermin terkunci | p,q prisma pembagi \"/\" \"\\\"\n   Level: s=[x,y,arah] arah 0 kanan,1 bawah,2 kiri,3 atas | mv batas langkah | o langkah terbaik (diverifikasi solver, solusi optimal unik). */\nconst $=id=>document.getElementById(id);\nconst cv=$('c'),ctx=cv.getContext('2d'),card=$('card'),ov=$('ov'),toast=$('toast'),hud=$('hud'),leg=$('leg');\nconst DX=[1,0,-1,0],DY=[0,1,0,-1 2px}\n#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}\n.card{background:var(--card);color:var(--ink);border-radius:18px;padding:22px 20px 18px;width:min(100%,380px);max-height:100%;overflow:auto;text-align:center;box-shadow:0 12px 40px #0005;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.card h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.5px}\n.card p{margin:6px 0;font-size:14px;line-height:1.5}\n.card .sub{font-weight:700;font-size:15px;margin:10px 0 2px}\n.big{font-size:56px;font-weight:300;margin:4px 0}\n.how{font-size:13px;opacity:.85}\n.how2{display:flex;flex-direction:column;gap:3px;text-align:left;font-size:13px;line-height:1.4;margin:8px 0}\nbutton{margin-top:12px;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}\nbutton:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}\n.row{display:flex;gap:8px}.row button{flex:1;padding:12px 8px}\n.stat{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:13px;opacity:.9;margin-top:6px}\n.edu{background:rgba(242,183,5,.18);border-radius:12px;padding:8px 12px;margin-top:8px;text-align:left;font-size:13px;line-height:1.45}\n.edu b{display:block;font-size:12px;margin-bottom:2px}\n.rec{display:inline-block;background:var(--btn);color:var(--btnt);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:6px}\n.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}.g3{grid-template-columns:repeat(3,1fr)}\n.it{margin:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(127,127,127,.45);font-size:13px}\n.it small{font-size:11px;font-weight:600;opacity:.85}\n. a.map((v,i)=>v+(b[i]-v)*k);\nconst rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;\nfunction mixPal(A,B,k){return{sky:[lr(A.sky[0],B.sky[0],k),lr(A.sky[1],B.sky[1],k)],gr:lr(A.gr,B.gr,k),rd:lr(A.rd,B.rd,k),hl1:lr(A.hl1,B.hl1,k),hl2:lr(A.hl2,B.hl2,k),hs:lr(A.hs,B.hs,k),dk:A.dk+(B.dk-A.dk)*k}}\nlet PALC=PAL[0],dark=0,phName='Siang';\nfunction calcPal(){\n  const ph=Math.floor(t/30)%3,f=t%30,x=Math.max(0,Math.min(1,(f-25)/5)),k=x*x*(3-2*x);\n  PALC=mixPal(PAL[ph],PAL[(ph+1)%3],k);dark=PALC.dk;phName=PNAME[(ph+(k>.5?1:0))%3];\n}\nconst hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};\n/* ---------- state ---------- */\nlet st='menu',t=0,dist=0,spd=0,bat=100,run=0,poleLit=0,poleMiss=0,spawnX=0,poleX=0,dyingT=0,guard=0,hintT=0,shake=0,flashA=0,flashC='255,255,255',anim=0,inZone=false,last=0;\nlet P={y:0,vy:0,jumps:0,sl:false,slT:0,hold:false,inv:0,slow:0};\nlet ents=[],poles=[],parts=[],fl=[],bolts=[],pd=null;\nconst eff=()=>poleLit+poleMiss?Math.round(100*poleLit/(poleLit+poleMiss)):100;\nconst sxOf=x=>PXs+(x-dist);\nfunction poleEnsure(){while(poleX\u003cdist+VW+300){poles.push({x:poleX,lit:st==='menu',flash:0,counted:st==='menu'});poleX+=320}}\nfunction startRun(){\n  st='play';t=0;dist=0;bat=100;run=0;poleLit=0;poleMiss=0;ents=[];poles=[];parts=[];fl=[];bolts=[];\n  P={y:0,vy:0,jumps:0,sl:false,slT:0,hold:false,inv:0,slow:0};\n  spawnX=480;poleX=420;dyingT=0;guard=.25;hintT=5;shake=0;flashA=0;pd=null;\n  ov.classList.add('hide');pz.classList.remove('hide');calcPal();poleEnsure();\n}\n/* ---------- pola rintangan ---------- */\nconst coin=(x,h)=>ents.push({k:'coin',x,h});\nfunction spawnPattern(x){\n  const r=Math.random();\n  if(r\u003c.28){\n    ents.push({k:'panel',x:x+120,lo:160,hi:190});\n    for(let i=0;i\u003c5;i++)coin(x+i*34,60+Math.sin(i/4*Math.PI)*60);\n    return 360;\n  }\n  if(r\u003c.42){\n    ents.push({k:'panel',x:x+120,lo:270,hi:300});\n    for(let i=0;i\u003c4;i++)coin(x+i*36,130+i*28);\n    return 380;\n  }\n  if(r\u003c.62){\n    ents.push({k:'snail',x:x+90});\n    for(let i=0;i\u003c5;i++)coin(x+i*36+10,70+Math.sin(i/4*Math.PI)*70);\n    return 380;\n  }\n  if(r\u003c.8){\n    ents.push({k:'drone',x:x+90});\n    for(let i=0;i\u003c4;i++)coin(x+i*38+10,14);\n    return 360;\n  }\n  ents.push({k:'snail',x:x+40});\n  ents.push({k:'panel',x:x+330,lo:160,hi:190});\n  coin(x+300,60);coin(x+340,90);coin(x+380,60);\n  return 520;\n}\n/* ---------- aksi ---------- */\nfunction burst(x,y,n,c,sp){\n  if(RM)n=Math.min(n,6);\n  for(let i=0;i\u003cn;i++){const a=Math.random()*6.28,v=(sp||160)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:500,life:.5+Math.random()*.4,max:.9,s:2+Math.random()*3,c})}\n}\nfunction floater(x,y,txt,c){fl.push({x,y,txt,c,life:.9})}\nfunction jump(){\n  if(st!=='play'||guard>0)return;\n  P.slT=0;\n  if(P.y\u003c=1){P.vy=JV;P.jumps=1;P.y=.5;beep(320,.12,'square',.04,640)}\n  else if(P.jumps\u003c2){P.vy=JV2;P.jumps=2;burst(PXs,GY-P.y,8,'255,240,170',120);beep(480,.12,'square',.04,900)}\n}\nfunction slideSwipe(){if(st!=='play')return;P.slT=.6;if(P.y>0)P.vy=Math.min(P.vy,-900)}\nfunction hitPanel(e){\n  bat=Math.min(100,bat+12);flashA=RM?.08:.35;flashC='255,255,255';shake=RM?0:.5;\n  beep(220,.3,'sawtooth',.06,1400);\n  const sx=sxOf(e.x),sy=GY-(e.lo+e.hi)/2;\n  burst(sx,sy,18,'255,226,110',220);floater(sx,sy-20,'+12','#ffe27a');\n  const un=poles.filter(p=>!p.lit&&p.x>dist+30).sort((a,b)=>a.x-b.x).slice(0,2);\n  un.forEach(p=>{p.lit=true;p.flash=1;bat=Math.min(100,bat+3);bolts.push({x1:e.x,y1:GY-e.hi,x2:p.x+16,y2:GY-160,t:.45})});\n  if(un.length)floater(sx,sy-48,'PJU menyala','#fff');\n}\nfunction hurt(e,dmg,slow){\n  bat-=dmg;P.inv=1.1;if(slow)P.slow=1.6;shake=RM?0:1;flashA=RM?.06:.22;flashC='255,70,70';\n  burst(PXs,GY-P.y-24,14,slow?'120,84,50':'170,180,190',200);floater(PXs,GY-P.y-70,'-'+dmg,'#ff8a7a');beep(180,.25,'sawtooth',.07,50);\n}\nfunction updateGame(dt){\n  t+=dt;guard-=dt;hintT-=dt;calcPal();\n  if(pd&&!pd.slid&&st==='play'&&performance.now()-pd.t>180){pd.slid=true;pd.hold=true;P.hold=true;if(P.y>0)P.vy=Math.min(P.vy,-900)}\n  let mult=1;\n  if(P.slow>0){mult*=.45;P.slow-=dt}\n  if(P.inv>0)P.inv-=dt;\n  if(bat\u003c18)mult*=.55+bat/40;\n  if(st==='dying'){dyingT+=dt;mult*=Math.max(0,1-dyingT/1.3);if(dyingT>1.5){gameOver();return}}\n  spd=Math.min(560,300+t*5)*mult;dist+=spd*dt;\n  if(P.slT>0)P.slT-=dt;\n  P.vy-=G*dt;P.y+=P.vy*dt;\n  if(P.y\u003c=0){P.y=0;if(P.vy\u003c0)P.vy=0;P.jumps=0}\n  P.sl=P.y===0&&(P.hold||P.slT>0);\n  while(spawnX\u003cdist+VW+300)spawnX+=spawnPattern(spawnX)+60+Math.random()*120;\n  poleEnsure();\n  poles.forEach(p=>{if(!p.counted&&p.x\u003cdist-70){p.counted=true;p.lit?poleLit++:poleMiss++}});\n  poles=poles.filter(p=>p.x>dist-400);\n  if(st==='play'){\n    const hg=P.sl?24:48,y0=P.y,y1=P.y+hg;\n    for(const e of ents){\n      const dx=e.x-dist;if(e.done||Math.abs(dx)>70)continue;\n      if(e.k==='coin'){if(Math.abs(dx)\u003c24&&e.h+12>y0&&e.h-12\u003cy1){e.done=true;e.fade=1;run++;bat=Math.min(100,bat+1.5);beep(900,.08,'square',.03,1400);burst(sxOf(e.x),GY-e.h,5,'255,215,80',90)}}\n      else if(e.k==='panel'){if(Math.abs(dx)\u003c40&&y1>e.lo&&y0\u003ce.hi){e.done=true;e.fade=1;hitPanel(e)}}\n      else if(P.inv\u003c=0){\n        if(e.k==='snail'&&Math.abs(dx)\u003c30&&y0\u003c26)hurt(e,12,true);\n        else if(e.k==='drone'&&Math.abs(dx)\u003c38&&y1>34&&y0\u003c78)hurt(e,16,false);\n      }\n    }\n    inZone=dark>.5&&poles.some(p=>!p.lit&&Math.abs(p.x-dist)\u003c150);\n    bat-=(3.2+Math.min(5,t*.04))*(inZone?2.4:1)*dt;\n    if(bat\u003c=0){bat=0;st='dying';dyingT=0;P.hold=false;pd=null;beep(300,.5,'sawtooth',.06,60)}\n  }\n  ents.forEach(e=>{if(e.k==='snail')e.x-=40*dt;else if(e.k==='drone')e.x-=20*dt;if(e.done)e.fade-=dt*3});\n  ents=ents.filter(e=>e.x>dist-250&&!(e.done&&e.fade\u003c=0));\n}\nfunction gameOver(){\n  st='over';pz.classList.add('hide');pd=null;P.hold=false;\n  const m=Math.floor(dist/10),ef=eff(),sc=Math.round(m*(1+ef/100)),rec=sc>SV.best;\n  if(rec)SV.best=sc;SV.coins+=run;save();beep(400,.7,'triangle',.06,70);\n  overCard(sc,m,ef,rec,true);\n}\n/* ---------- kartu menu ---------- */\nfunction menuCard(){\n  st='menu';t=0;dist=0;poles=[];ents=[];parts=[];fl=[];bolts=[];poleX=300;P={y:0,vy:0,jumps:0,sl:false,slT:0,hold:false,inv:0,slow:0};bat=100;pz.classList.add('hide');\n  card.innerHTML=`\u003cimg class=\"logo\" alt=\"pi7arcahaya\" src=\"${LOGO}\">\u003ch1>Kiara Dash\u003c/h1>\u003cp class=\"sub\">Nyalakan PJU, jangan berhenti\u003c/p>\u003cp class=\"how\">Mang Teten berlari otomatis. Sambar blok panel surya untuk menyalakan PJU dan mengisi baterai.\u003c/p>\u003cdiv class=\"how2\">\u003cspan>👆 Ketuk: lompat. Ketuk lagi di udara: lompat ganda.\u003c/span>\u003cspan>👇 Tahan atau geser ke bawah: meluncur.\u003c/span>\u003cspan>☁️ Meluncur di bawah awan mendung, melompati siput lumpur.\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>Rekor ${SV.best}\u003c/span>\u003cspan>🪙 ${SV.coins}\u003c/span>\u003c/div>\u003cbutton id=\"pl\" class=\"play\" aria-label=\"Main\">\u003csvg viewBox=\"0 0 24 24\" width=\"38\" height=\"38\">\u003cpath d=\"M8 5v14l11-7z\" fill=\"currentColor\"/>\u003c/svg>\u003c/button>\u003cdiv class=\"row\">\u003cbutton id=\"sh\" class=\"alt\">Toko\u003c/button>\u003cbutton id=\"sn\" class=\"alt\">${SV.snd?'🔊 Suara':'🔇 Senyap'}\u003c/button>\u003c/div>`;\n  ov.style.alignItems='center';ov.classList.remove('hide');\n  $('pl').onclick=startRun;$('sh').onclick=()=>shopCard('menu');\n  $('sn').onclick=()=>{SV.snd=SV.snd?0:1;save();menuCard()};\n}\nfunction shopCard(from){\n  const row=(arr,own,cur,kind,sw)=>arr.map((o,i)=>{const has=own.includes(i),sel=cur===i;return `\u003cbutton class=\"it ${sel?'sel':''}\" data-k=\"${kind}\" data-i=\"${i}\">\u003ci class=\"sw\" style=\"background:${sw(o)}\">\u003c/i>\u003cb>${o.n}\u003c/b>\u003csmall>${sel?'Dipakai':has?'Pakai':'🪙 '+o.p}\u003c/small>\u003c/button>`}).join('');\n  card.innerHTML=`\u003ch1>Toko\u003c/h1>\u003cp>🪙 ${SV.coins} koin matahari\u003c/p>\u003cp class=\"sub\">Karakter\u003c/p>\u003cdiv class=\"grid2\">${row(SK,SV.skins,SV.skin,'s',o=>o.shirt)}\u003c/div>\u003cp class=\"sub\">Tiang PJU\u003c/p>\u003cdiv class=\"grid2 g3\">${row(PL,SV.poles,SV.pole,'p',o=>o.c)}\u003c/div>\u003cp class=\"how\" id=\"msg\">&nbsp;\u003c/p>\u003cbutton id=\"bk\">Kembali\u003c/button>`;\n  ov.style.alignItems='flex-end';ov.classList.remove('hide');\n  card.querySelectorAll('.it').forEach(b=>b.onclick=()=>{\n    const s=b.dataset.k==='s',i=+b.dataset.i,arr=s?SK:PL,own=s?SV.skins:SV.poles;\n    if(!own.includes(i)){\n      if(SV.coins\u003carr[i].p){$('msg').textContent='Koin belum cukup. Kumpulkan lebih banyak koin matahari.';return}\n      SV.coins-=arr[i].p;own.push(i);\n    }\n    if(s)SV.skin=i;else SV.pole=i;\n    save();shopCard(from);\n  });\n  $('bk').onclick=from==='over'?gameOver_back:menuCard;\n}\nfunction overCard(sc,m,ef,rec,fact){\n  card.innerHTML=`${rec?'\u003cdiv class=\"rec\">Rekor baru!\u003c/div>':''}\u003cdiv class=\"lab\">Skor\u003c/div>\u003cdiv class=\"big\">${sc}\u003c/div>\u003cdiv class=\"best\">Rekor ${SV.best}\u003c/div>\u003cdiv class=\"chips\">\u003cspan>${m} m\u003c/span>\u003cspan>PJU ${ef}%\u003c/span>\u003cspan>\u003ci class=\"cd\">\u003c/i>+${run}\u003c/span>\u003c/div>\u003cbutton id=\"again\" class=\"play\" aria-label=\"Main lagi\">\u003csvg viewBox=\"0 0 24 24\" width=\"38\" height=\"38\">\u003cpath d=\"M8 5v14l11-7z\" fill=\"currentColor\"/>\u003c/svg>\u003c/button>\u003cdiv class=\"row\">\u003cbutton id=\"shp\" class=\"alt\">Toko\u003c/button>\u003cbutton id=\"mn\" class=\"alt\">Menu\u003c/button>\u003c/div>${fact?`\u003cp class=\"fact\">💡 ${FACTS[Math.random()*FACTS.length|0]}\u003c/p>`:''}`;\n  ov.style.alignItems='flex-end';ov.classList.remove('hide');\n  $('again').onclick=startRun;$('shp').onclick=()=>shopCard('over');$('mn').onclick=menuCard;\n}\nfunction gameOver_back(){gameOver_replay()}\nfunction gameOver_replay(){\n  /* kembali ke kartu hasil tanpa menghitung ,y,r,0,7);ctx.fillStyle=c;ctx.fill()}\nfunction hills(par,hgt,amp,fq,col){\n  ctx.beginPath();ctx.moveTo(-10,GY);\n  for(let x=-10;x\u003c=VW+14;x+=12){const u=(x+dist*par)*fq;ctx.lineTo(x,GY-hgt-amp*(Math.sin(u)+.5*Math.sin(u*2.3)))}\n  ctx.lineTo(VW+14,GY);ctx.closePath();ctx.fillStyle=rgb(col);ctx.fill();\n}\nfunction village(){\n  const sp=160,par=.5,base=Math.floor(dist*par/sp);\n  for(let k=-1;k\u003cVW/sp+2;k++){\n    const i=base+k,h=hash(i);if(h\u003c.25)continue;\n    const w=50+hash(i+7)*26,hh=34+hash(i+13)*26,x=i*sp-dist*par+20,y=GY-hh;\n    ctx.fillStyle=rgb(PALC.hs);ctx.fillRect(x,y,w,hh);\n    ctx.fillStyle=rgb(lr(PALC.hs,[0,0,0],.28));ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+w/2,y-20);ctx.lineTo(x+w+6,y);ctx.closePath();ctx.fill();\n    if(dark>.4){ctx.fillStyle=`rgba(255,214,120,${Math.min(.9,(dark-.3)*1.6)})`;ctx.fillRect(x+w*.3,y+hh*.35,9,10)}\n  }\n}\nfunction drawSky(){\n  ctx.fillStyle=rgb(PALC.sky[0]);ctx.fillRect(-20,-20,VW+40,VH+40);\n  const sa=Math.max(0,1-dark*1.5),ma=Math.max(0,Math.min(1,(dark-.3)*2.5));\n  if(sa>.02){ctx.globalAlpha=sa;circ(VW*.72,GY*.26+dark*GY*.45,36,'#ffe45c');ctx.globalAlpha=1}\n  if(ma>.02){ctx.save();ctx.fillStyle='#fff';for(let i=0;i\u003c30;i++){ctx.globalAlpha=ma*(.3+.5*Math.abs(Math.sin(anim*.8+i)));rr(hash(i)*VW,hash(i+50)*GY*.7,3,3,1.5);ctx.fill()}ctx.globalAlpha=ma;circ(VW*.8,GY*.22,26,'#fff7d6');circ(VW*.8+10,GY*.22-6,22,rgb(PALC.sky[0]));ctx.restore()}\n  hills(.12,60,22,.006,PALC.hl1);hills(.25,28,16,.009,PALC.hl2);village();\n}\nfunction drawGround(){\n  ctx.fillStyle=rgb(PALC.gr);ctx.fillRect(-20,GY-2,VW+40,VH-GY+30);\n  ctx.fillStyle=rgb(PALC.rd);ctx.fillRect(-20,GY+14,VW+40,VH-GY+30);\n  ctx.fillStyle='rgba(255,255,255,.16)';const o=-(dist%80);for(let x=o-80;x\u003cVW+80;x+=80)ctx.fillRect(x,GY+(VH-GY)*.55,36,6);\n}\nfunction arm(){return SV.pole===1?34:26}\nfunction drawPole(p){\n  const sx=sxOf(p.x);if(sx\u003c-80||sx>VW+80)return;\n  const s=SV.pole,h=170,by=GY-2,pc=PL[s].c==='#3fe6ff'?'#e8
