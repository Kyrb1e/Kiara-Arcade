<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1c5c">
<title>Kiara Arcade | Kelompok 7 KKN ITB 2026</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/fonts.css?v=202611261444">
<link rel="stylesheet" href="css/hub.css?v=202611261444">
</head>
<body>

<div id="hub">
  <!-- lapisan latar -->
  <div class="bg-rays" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <i class="shoot" aria-hidden="true"></i>
  <i class="shoot s2" aria-hidden="true"></i>
  <i class="bokeh b1" aria-hidden="true"></i>
  <i class="bokeh b2" aria-hidden="true"></i>
  <i class="bokeh b3" aria-hidden="true"></i>
  <div class="twinkles" aria-hidden="true">
    <i style="--x:8%;--y:14%;--s:22px;--d:0s"></i>
    <i style="--x:88%;--y:10%;--s:30px;--d:.8s"></i>
    <i style="--x:93%;--y:42%;--s:16px;--d:1.6s"></i>
    <i style="--x:4%;--y:46%;--s:18px;--d:2.2s"></i>
    <i style="--x:70%;--y:30%;--s:12px;--d:1.1s"></i>
    <i style="--x:24%;--y:32%;--s:12px;--d:2.8s"></i>
  </div>

  <header class="topbar">
    <div class="chip">
      <img src="assets/logo.png" alt="">
      <span>Pi7ar Cahaya</span>
    </div>
    <div class="chip">
      <b class="hex">7</b>
      <span>KKN ITB 2026</span>
    </div>
  </header>

  <section class="hero">
    <h1 class="title" aria-label="Kiara Arcade">
      <span class="t1" data-t="KIARA"><span class="fill">KIARA</span></span>
      <span class="t2" data-t="ARCADE"><span class="fill">ARCADE</span></span>
    </h1>

    <div class="stage">
      <p class="bubble">Halo, aku Pijar! Yuk, pilih game!</p>
      <div class="island-wrap">
        <img class="pijar" src="assets/pijar.svg" alt="Pijar, maskot Kiara Arcade">
        <svg class="island" viewBox="0 0 220 96" aria-hidden="true">
          <defs>
            <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0925c"/><stop offset=".5" stop-color="#9a5f34"/><stop offset="1" stop-color="#5e361b"/></linearGradient>
            <linearGradient id="rockL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
            <radialGradient id="grass" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#d4ffb0"/><stop offset=".45" stop-color="#7fe050"/><stop offset="1" stop-color="#3ea826"/></radialGradient>
            <radialGradient id="icoin" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffcf3d"/><stop offset="1" stop-color="#f59a0c"/></radialGradient>
          </defs>
          <path d="M16 32c10 30 42 58 94 62c52-4 84-32 94-62z" fill="url(#rock)"/>
          <path d="M16 32c10 30 42 58 94 62c52-4 84-32 94-62z" fill="url(#rockL)"/>
          <path d="M20 40c20 8 40 12 60 12" stroke="#e8b083" stroke-width="3" stroke-linecap="round" opacity=".5" fill="none"/>
          <ellipse cx="110" cy="34" rx="95" ry="8" fill="#2e8a1c"/>
          <ellipse cx="110" cy="28" rx="96" ry="22" fill="url(#grass)"/>
          <ellipse cx="80" cy="20" rx="40" ry="7" fill="#fff" opacity=".25"/>
          <ellipse cx="172" cy="31" rx="8" ry="8" fill="#d9780a"/><circle cx="172" cy="29" r="8" fill="url(#icoin)"/>
          <ellipse cx="186" cy="37" rx="6" ry="6" fill="#d9780a"/><circle cx="186" cy="35" r="6" fill="url(#icoin)"/>
          <ellipse cx="42" cy="35" rx="6" ry="6" fill="#d9780a"/><circle cx="42" cy="33" r="6" fill="url(#icoin)"/>
        </svg>
      </div>
    </div>
  </section>

  <main class="tiles" id="tiles" aria-label="Daftar permainan"></main>

  <footer class="foot">Kelompok 7 KKN-D ITB 2026</footer>
</div>

<div id="intro" class="hide" role="dialog" aria-modal="true" aria-labelledby="in-t">
  <div class="panel" id="panel">
    <div class="ribbon"><h2 id="in-t"></h2></div>
    <button class="close" id="in-x" type="button" aria-label="Tutup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="showcase">
      <div class="burst" aria-hidden="true"></div>
      <div class="art" id="in-i" aria-hidden="true"></div>
    </div>
    <div class="talk">
      <img class="pijar" src="assets/pijar.svg" alt="">
      <p class="say" id="in-s"></p>
    </div>
    <div class="pills">
      <span class="pill"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4.6 15a1.5 1.5 0 0 1 2.3-1.9L9 15"/></svg></b><span id="in-k"></span></span>
      <span class="pill"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></b><span id="in-g"></span></span>
    </div>
    <button class="btn-go" id="in-go" type="button">Main!</button>
  </div>
</div>

<div id="play" class="hide">
</div>

<script src="js/music.js?v=202611261444"></script>
<script src="js/art.js?v=202611261444"></script>
<script src="js/hub.js?v=202611261444"></script>
</body>
</html>
