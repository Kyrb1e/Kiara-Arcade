px;font-weight:900;line-height:1;margin:6px 0}\n#ov[style*=\"flex-end\"] .card h1{font-size:30px;font-weight:900}\n@keyframes pgin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}\n</style>\n</head>\n<body>\n<canvas id=\"c\"></canvas>\n<button id=\"pz\" class=\"hide\" aria-label=\"Jeda\">❚❚</button>\n<button id=\"bl\" class=\"ctl hide\" aria-label=\"Belok kiri\">◀</button>\n<button id=\"br\" class=\"ctl hide\" aria-label=\"Belok kanan\">▶</button>\n<div id=\"ov\"><div class=\"card\" id=\"card\"></div></div>\n<script>\n/* Kiara Drive. Mobil patroli listrik, tampak atas, di jalan desa tanpa listrik konvensional.\n   Kontrol: tombol kiri/kanan (atau separuh layar, atau panah/A-D). Lepas jalur atau menabrak batu = tamat.\n   Lampu utama mengecil seiring baterai turun. Solar Orb mengisi baterai. Koridor PJU surya menerangi jalan, mengisi baterai, dan melipatgandakan skor.\n   Lalu lintas dua lajur: kendaraan searah yang lebih lambat di lajur kiri dan kendaraan berlawanan arah di lajur kanan (lampu depan menyilaukan); sebagian tanpa lampu.\n   Koridor bisa lit (terang), dirty (panel kotor, redup), atau dead (padam). Peluang padam naik bila kondisi jaringan buruk (efisiensi run sebelumnya). */\nconst $=id=>document.getElementById(id);\nconst cv=$('c'),ctx=cv.getContext('2d'),ov=$('ov'),card=$('card'),pz=$('pz'),bl=$('bl'),br=$('br');\nconst dc=document.createElement('canvas'),dx=dc.getContext('2d');\nconst RM=matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet W=0,H=0,DPR=1,SC=1,VW=400,VH=700,CY=500;\nfunction rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;SC=Math.min(H/720,W/380)*(W>H*1.1?1.7:1.4);VW=W/SC;VH=H/SC;CY=VH*.72;dc.width=Math.max(2,Math.ceil(W/2));dc.height=Math.max(2,Math.ceil(H/2))}\naddEventListener('resize',rs);rs();\nlet SV={best:0,health:.5,snd:1};\ntry{Object.assign(SV,JSON.parse(localStorage.getItem('sdn_v1')||'{}'))}catch(e){}\nconst save=()=>{try{localStorage.setItem('sdn_v1',JSON.stringify(SV))}catch(e){}};\nconst FACTS=['Pengemudi butuh jarak pandang yang cukup untuk bereaksi. Tanpa lampu jalan, jarak pandang malam hari bergantung penuh pada lampu kendaraan.','PJU tenaga surya menyimpan energi siang hari di baterai, lalu menyalakan lampu LED otomatis saat gelap lewat sensor cahaya.','Debu dan kotoran di permukaan panel mengurangi listrik yang dihasilkan, sehingga lampu lebih redup. Panel perlu dibersihkan berkala.','Solar charge controller mencegah baterai terisi berlebihan atau terkuras habis, sehingga PJU tetap menyala sepanjang malam.','Jalan desa yang jauh dari jaringan PLN sangat terbantu PJU surya karena tanpa kabel panjang dan tanpa tagihan listrik.','Tikungan, lubang, dan genangan air sulit terlihat di jalan gelap. Penerangan yang merata membantu mencegah kecelakaan.'];\nlet AC=null;\nfunction beep(f,d,type,v,f2){\n  if(!SV.snd)return;\n  try{\n    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();\n    if(AC.state==='suspended')AC.resume();\n    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;\n    o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);\n    g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);\n    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03);\n  }catch(e){}\n}\n/* ---------- jalan ---------- */\nconst RAW=d=>{const a=Math.min(1,.5+d/9000);return .4*a*(60*Math.sin(d/420)+30*Math.sin(d/210+1.7)+14*Math.sin(d/120+.4))};\nconst R0=RAW(0);\nconst rcAt=d=>VW/2+RAW(d)-R0;\nconst hwAt=d=>96-Math.min(20,Math.max(0,d)/700);\nconst lerp=(a,b,k)=>a+(b-a)*k;\nconst mix=(a,b,k)=>`rgb(${lerp(a[0],b[0],k)|0},${lerp(a[1],b[1],k)|0},${lerp(a[2],b[2],k)|0})`;\nconst hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\n/* ---------- state ---------- */\nlet st='menu',t=0,dist=0,spd=0,bat=100,score=0,orbN=0,zoneT=0,gain=0,gainMax=0,amb=.5,anim=0,last=0,shake=0,flashA=0,flashC='255,255,255',guard=0,hintT=0,dyingT=0,why='',carX=200,vx=0,slip=0,jolt=0,spin=0,nextSp=420,nextCor=3600,curCor=null,note='',noteT=0,mult=1;\nlet orbs=[],obs=[],cors=[],parts=[],fl=[],traffic=[],spT=3,glare=0,warned=false;\nconst VCOL=['#e8505b','#4aa3df','#f4c542','#8e6bd8','#3fbf8f','#e6e9ee','#ff8a3d'];\nconst inp={l:new Set(),r:new Set()};\nconst corAt=d=>cors.find(c=>d>=c.d0-60&&d<=c.d1+60);\nfunction genCor(lim,first){\n  while(nextCor<lim){\n    const pD=Math.max(.08,.36-.3*SV.health);let s='lit';\n    if(!first&&cors.length){const r=Math.random();s=r<pD?'dead':r<pD+.3?'dirty':'lit'}\n    const c={d0:nextCor,d1:nextCor+840,state:s,poles:[]};\n    for(let i=0;i<6;i++)c.poles.push({d:c.d0+70+i*140,side:i%2?1:-1});\n    cors.push(c);nextCor+=840+(first?500:1500+Math.random()*1200);\n  }\n}\nfunction genTo(lim){\n  while(nextSp<lim){\n    const d=nextSp,c=corAt(d),dead=c&&c.state==='dead',hw=hwAt(d);\n    if(Math.random()<.55)orbs.push({d,off:rnd(-1,1)*(hw-26),done:false,fade:1});\n    if(st!=='menu'&&t>5&&Math.random()<.34+(dead?.3:0)){\n      const r=Math.random(),k=r<.09?'rock':r<.9?'puddle':'pit';\n      obs.push({k,d:d+rnd(60,120),off:rnd(-1,1)*(hw-22),r:k==='rock'?14:k==='puddle'?20:16,sd:Math.random()});\n    }\n    nextSp+=150+Math.random()*110;\n  }\n}\nfunction resetWorld(menu){\n  dist=menu?0:0;orbs=[];obs=[];cors=[];parts=[];fl=[];traffic=[];spT=3;glare=0;warned=false;nextSp=420;nextCor=menu?500:3600;curCor=null;\n  carX=rcAt(0);vx=0;slip=0;jolt=0;spin=0;\n  genCor(dist+CY+1400,true);genTo(dist+CY+500);\n}\nfunction startRun(){\n  st='play';t=0;bat=100;score=0;orbN=0;zoneT=0;gain=0;gainMax=0;mult=1;guard=.4;hintT=6;dyingT=0;shake=0;flashA=0;note='';noteT=0;\n  resetWorld(false);amb=0;\n  ov.classList.add('hide');pz.classList.remove('hide');bl.classList.remove('hide');br.classList.remove('hide');\n}\nconst eff=()=>gainMax>0?Math.round(100*gain/gainMax):0;\nconst phase=()=>t<12?'Sore':t<32?'Senja':'Malam';\nconst hlf=()=>.14+.86*clamp(bat,0,100)/100;\nfunction burst(x,y,n,c,sp){if(RM)n=Math.min(n,5);for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||120)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.4,max:.9,s:2+Math.random()*3,c})}}\nfunction floater(x,y,txt,c){fl.push({x,y,txt,c,life:.9})}\nfunction toast(s){note=s;noteT=2.2}\nfunction die(r){\n  if(st!=='play')return;\n  st='dying';dyingT=0;why=r;glare=0;shake=RM?0:1;flashA=.3;flashC='255,70,70';beep(200,.5,'sawtooth',.07,40);\n  burst(carX,CY,22,'255,150,80',220);\n  inp.l.clear();inp.r.clear();bl.classList.remove('on');br.classList.remove('on');\n}\n/* ---------- update ---------- */\nfunction upd(dt){\n  anim+=dt;shake=Math.max(0,shake-dt*3);flashA=Math.max(0,flashA-dt*1.8);noteT-=dt;\n  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt});parts=parts.filter(p=>p.life>0);\n  fl.forEach(f=>{f.life-=dt;f.y-=36*dt});fl=fl.filter(f=>f.life>0);\n  if(st==='menu'){dist+=170*dt;amb=.55;carX=rcAt(dist+10);spd=170;genCor(dist+CY+1400,true);genTo(dist+CY+500);cleanup();return}\n  if(st==='pause'||st==='over')return;\n  if(st==='dying'){\n    glare=0;dyingT+=dt;spin+=dt*10;spd*=Math.max(0,1-dt*3);dist+=spd*dt;carX+=vx*dt;vx*=.96;\n    if(dyingT>1.05)gameOver();return;\n  }\n  t+=dt;guard-=dt;hintT-=dt;jolt-=dt;slip-=dt;\n  amb=clamp((t-6)/36,0,1)*.94;\n  spd=(240+Math.min(170,t*3.4))*(jolt>0?.65:1);\n  const cor=corAt(dist);\n  mult=cor?(cor.state==='lit'?2:cor.state==='dirty'?1.5:1):1;\n  dist+=spd*dt;score+=spd*dt/10*mult;\n  if(cor!==curCor){curCor=cor;if(cor)toast(cor.state==='lit'?'Zona PJU aktif · skor ×2':cor.state==='dirty'?'Panel PJU kotor · cahaya redup':'PJU padam! Zona gelap berbahaya')}\n  const dir=(inp.r.size?1:0)-(inp.l.size?1:0);\n  const maxV=170+spd*.35;\n  vx+=(dir*maxV-vx)*Math.min(1,dt*(slip>0?2.2:11));carX+=vx*dt;\n  const rc=rcAt(dist),hw=hwAt(dist),off=carX-rc;\n  let drain=Math.min(4.5,2.2+t*.02)*(cor&&cor.state==='dead'?1.6:1),chg=0;\n  if(cor&&cor.state!=='dead'){\n    const prox=clamp(Math.abs(off)/hw,0,1),lit=cor.state==='lit';\n    chg=lit?5+9*prox:2.5+4*prox;zoneT+=dt;gain+=chg*dt;gainMax+=(lit?14:6.5)*dt;\n  }\n  bat=clamp(bat+(chg-drain)*dt,0,100);\n  if(bat<=0&&guard<=0){bat=0;die('bat');return}\n  if(Math.abs(off)>hw-2&&guard<=0){die('road');return}\n  for(const o of orbs){\n    if(o.done){o.fade-=dt*3;continue}\n    const ox=rcAt(o.d)+o.off,dd=o.d-dist;\n    if(Math.abs(carX-ox)<22&&Math.abs(dd)<26){\n      o.done=true;orbN++;bat=Math.min(100,bat+14);score+=25*mult;\n      beep(700,.14,'square',.04,1500);burst(ox,CY-dd,10,'255,230,120',130);floater(ox,CY-dd-14,'+14','#ffe27a');\n    }\n  }\n  for(const o of obs){\n    if(o.hit)continue;\n    const ox=rcAt(o.d)+o.off,dd=o.d-dist,ex=(carX-ox)/(o.r+11),ey=dd/(o.r+18);\n    if(ex*ex+ey*ey<1){\n      o.hit=true;\n      if(o.k==='rock'){die('rock');return}\n      if(o.k==='puddle'){slip=1.3;bat=Math.max(1,bat-3);beep(250,.2,'triangle',.05,120);burst(ox,CY-dd,10,'140,200,255',110);floater(ox,CY-dd-16,'Licin!','#bfe3ff')}\n      else{jolt=.7;bat=Math.max(1,bat-12);shake=RM?0:.7;beep(150,.25,'sawtooth',.06,60);floater(ox,CY-dd-16,'-12','#ff8a7a')}\n    }\n  }\n  spT-=dt;\n  if(t>8&&spT<=0){\n    spT=Math.max(1.1,rnd(1.8,3.4)-t*.02);\n    const lane=Math.random()<.55?1:-1,sd=dist+CY+90;\n    if(!traffic.some(o=>o.lane===lane&&Math.abs(o.d-sd)<260)){\n      const truck=Math.random()<.2,unlit=t>18&&Math.random()<.2;\n      traffic.push({d:sd,lane,onc:lane>0,v:lane>0?-rnd(130,190):rnd(110,160),truck,len:truck?32:22,col:VCOL[Math.random()*VCOL.length|0],lit:!unlit,passed:false});\n      if(unlit&&!warned){warned=true;toast('Awas kendaraan tanpa lampu!')}\n    }\n  }\n  let gT=0;\n  for(const o of traffic){\n    o.d+=o.v*dt;\n    const x=rcAt(o.d)+o.lane*hwAt(o.d)*.5,dd=o.d-dist,hx=o.truck?14:11;\n    if(guard<=0&&Math.abs(carX-x)<hx+11&&Math.abs(dd)<o.len+20){die('vehicle');return}\n    if(!o.passed&&dd<-o.len-20){o.passed=true;if(Math.abs(carX-x)<hx+11+28){score+=10*mult;floater(x,CY-dd-10,'Nyaris! +10','#ffe27a')}}\n    if(o.onc&&o.lit&&dd>0&&dd<220&&Math.abs(carX-x)<90)gT=Math.max(gT,(1-dd/220)*.38);\n  }\n  glare+=(gT*(amb/.94)-glare)*Math.min(1,dt*8);\n  genCor(dist+CY+1400,false);genTo(dist+CY+500);cleanup();\n}\nfunction cleanup(){\n  orbs=orbs.filter(o=>o.d>dist-140&&!(o.done&&o.fade<=0));obs=obs.filter(o=>o.d>dist-140);traffic=traffic.filter(o=>o.d>dist-200&&o.d<dist+CY+900);cors=cors.filter(c=>c.d1>dist-300);\n}\nfunction gameOver(){\n  st='over';pz.classList.add('hide');bl.classList.add('hide');br.classList.add('hide');\n  const m=Math.floor(dist/10),ef=eff(),sc=Math.round(score*(1+ef/200)),rec=sc>SV.best;\n  if(rec)SV.best=sc;\n  if(zoneT>3)SV.health=clamp(SV.health+(ef-55)/250,0,1);\n  save();\n  const T={bat:['Baterai habis','Baterai kosong membuat lampu utama padam total. Tanpa cahaya, pengemudi tidak bisa melihat jalan sama sekali.'],road:['Keluar jalur','Tikungan tidak terlihat tepat waktu. Itulah bahaya jalan gelap: jarak pandang pendek membuat pengemudi telat menyadari belokan.'],rock:['Menabrak batu','Batu di jalan baru terlihat saat sudah dekat. Penerangan jalan yang merata memberi waktu bereaksi.'],vehicle:['Tabrakan kendaraan','Kendaraan tanpa lampu atau berlampu redup sulit terlihat di malam hari. Jalan yang terang membuat kendaraan lain terlihat lebih awal.']}[why]||['Tamat',''];\n  card.innerHTML=`${rec?'<div class=\"rec\">Rekor baru</div>':''}<h1>${T[0]}</h1><div class=\"big\">${sc}</div><p class=\"how\">Skor = (jarak + orb) × zona PJU, lalu bonus efisiensi</p><div class=\"stat\"><span>${m} m</span><span>Orb ${orbN}</span><span>Efisiensi PJU ${ef}%</span><span>Rekor ${SV.best}</span></div><div class=\"edu\"><b>Kenapa begitu?</b>${T[1]} Efisiensi PJU ${ef}% berarti kamu mengambil ${ef}% dari energi maksimal koridor terang. Merapat ke tiang PJU mengisi baterai lebih cepat, tetapi tepi jalan lebih berisiko.</div><div class=\"edu\"><b>💡 Tahukah kamu?</b>${FACTS[Math.random()*FACTS.length|0]}</div><div class=\"row\"><button id=\"again\">Main lagi</button><button id=\"mn\" class=\"alt\">Menu</button></div>`;\n  ov.style.alignItems='flex-end';ov.classList.remove('hide');\n  $('again').onclick=startRun;$('mn').onclick=menuCard;\n}\nfunction netInfo(){const h=SV.health;return h>.66?['Baik','#2e8b57']:h>.33?['Sedang','#c98a00']:['Buruk','#c0392b']}\nfunction menuCard(){\n  st='menu';t=0;pz.classList.add('hide');bl.classList.add('hide');br.classList.add('hide');resetWorld(true);\n  const n=netInfo();\n  card.innerHTML=`<h1>Kiara Drive</h1><p class=\"sub\">Patroli malam, kejar terang</p><p class=\"how\">Patroli malam di jalan desa tanpa listrik konvensional. Jaga lampu tetap terang sampai tiang PJU surya berikutnya.</p><div class=\"how2\"><span>◀ ▶ Tahan tombol kiri atau kanan untuk membelok.</span><span>🔵 Lindas Solar Orb untuk mengisi baterai dan memperlebar cahaya.</span><span>💡 Koridor PJU terang: baterai terisi dan skor ×2.</span><span>🪨 Hindari batu, genangan, dan lubang. Jangan keluar jalur.</span><span>🚙 Lajur kiri: kendaraan searah yang lebih lambat. Lajur kanan: kendaraan dari arah berlawanan. Waspada yang tanpa lampu!</span></div><div class=\"stat\"><span>Rekor ${SV.best}</span><span>Jaringan PJU: <b class=\"net\" style=\"background:${n[1]}\">${n[0]}</b></span></div><p class=\"how\">Jaringan buruk membuat PJU lebih sering kotor atau padam. Efisiensi tinggi di run sebelumnya memperbaikinya.</p><button id=\"pl\">Main</button><button id=\"sn\" class=\"alt\">${SV.snd?'🔊 Suara':'🔇 Senyap'}</button>`;\n  ov.style.alignItems='center';ov.classList.remove('hide');\n  $('pl').onclick=startRun;$('sn').onclick=()=>{SV.snd=SV.snd?0:1;save();menuCard()};\n}\nfunction pauseGame(){\n  if(st!=='play')return;\n  st='pause';inp.l.clear();inp.r.clear();bl.classList.remove('on');br.classList.remove('on');\n  card.innerHTML='<h1>Dijeda</h1><p>Posisi mobil tetap tersimpan.</p><button id=\"rs\">Lanjut</button><div cla (PJU) memegang porsi konsumsi listrik yang besar dari jaringan utilitas konvensional (PLN). PJU Tenaga Surya (PJUTS) menjadi solusi strategis untuk menekan konsumsi energi fosil, mengurangi emisi karbon, dan meningkatkan kemandirian energi kawasan perkotaan maupun pedesaan.</p>\n<p>Memahami fisika dasar, terutama dinamika elektron-hole pada sambungan semikonduktor panel surya, menjadi kunci untuk mengoptimalkan efisiensi konversi energi surya menjadi listrik.</p>\n<div class=\"facts\"><div><b>Menekan energi fosil</b>Pasokan berasal dari matahari, bukan jaringan.</div><div><b>Mengurangi emisi</b>Tidak ada pembakaran bahan bakar saat beroperasi.</div><div><b>Kemandirian energi</b>Cocok untuk dusun jauh dari jaringan.</div></div></div>\n<div class=\"card\"><h3>Bandingkan alur energinya</h3><div class=\"seg\" id=\"sg\"><button class=\"on\" data-k=\"c\">PJU konvensional</button><button data-k=\"s\">PJUTS</button></div><div class=\"flow\" id=\"fl\"></div><p id=\"fn\"></p></div>`,\ni:()=>{const D={c:[['Pembangkit (dominan fosil)','Transmisi dan distribusi PLN','Meteran dan tagihan','Lampu PJU'],'Bergantung pada jaringan listrik. Konsumsi PJU membebani utilitas dan menimbulkan emisi tidak langsung dari pembangkit.'],s:[['Matahari','Panel PV','Solar charge controller','Baterai','Lampu LED'],'Berdiri mandiri: energi siang disimpan di baterai dan dipakai malam hari. Tanpa kabel jaringan dan tanpa emisi operasional.']};\nconst r=k=>{$$('#sg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));T('fl',D[k][0].map(x=>`<span>${x}</span>`).join('<i>&rarr;</i>'));T('fn',D[k][1])};\n$$('#sg button').forEach(b=>b.onclick=()=>r(b.dataset.k));r('c')}});\n/* ===== BAB 2 ===== */\nC.push({n:'2 Energi Surya',h:()=>`<h2>2. Dasar Energi Surya</h2>${mt('Kenapa panel di tiang kadang menghasilkan listrik banyak, kadang sedikit?')}\n<div class=\"card\"><p>Teknologi fotovoltaik (PV) mengubah energi radiasi matahari langsung menjadi listrik arus searah (DC) melalui efek fotovoltaik. Kinerja PJUTS dipengaruhi oleh komponen radiasi, tingkat <i>irradiance</i>, temperatur operasional modul, dan sudut kemiringan instalasi.</p>\n<div class=\"eq\">G<sub>total</sub> = G<sub>langsung</sub> + G<sub>difus</sub> + G<sub>pantulan</sub></div>\n<table><tr><th>Komponen</th><th>Keterangan</th></tr><tr><td>Langsung</td><td>Sinar yang datang lurus dari matahari; dominan saat cerah.</td></tr><tr><td>Difus</td><td>Cahaya yang terhambur awan dan atmosfer; tetap ada saat mendung.</td></tr><tr><td>Pantulan</td><td>Cahaya yang dipantulkan tanah dan permukaan sekitar (albedo).</td></tr></table></div>\n<div class=\"card\"><h3>Simulator keluaran panel 100 Wp</h3>\n${sl('gp','Irradiance puncak langit cerah','200','1100','10',1000,'W/m&sup2;')}${sl('cl','Kecerahan hari (tutupan awan)','30','100','5',80,'%')}${sl('ta','Suhu udara','15','40','1',30,'&deg;C')}${sl('tl','Sudut kemiringan panel','0','60','1',10,'&deg;')}\n<canvas id=\"cg\" aria-label=\"Grafik irradiance harian\"></canvas>\n<div class=\"eq\">P = P<sub>maks</sub> &middot; (G/1000) &middot; [1 + &gamma;(T<sub>sel</sub> &minus; 25)] &middot; cos(&beta; &minus; &beta;<sub>opt</sub>)</div>\n<div class=\"res\"><div>Irradiance siang<b id=\"r1\"></b></div><div>Suhu sel<b id=\"r2\"></b></div><div>Daya siang<b id=\"r3\"></b></div><div>Jam surya efektif<b id=\"r4\"></b></div><div>Energi per hari<b id=\"r5\"></b></div></div>\n${note('model pendekatan untuk belajar, bukan data jurnal. Kondisi uji standar (STC): 1000 W/m&sup2;, 25 &deg;C. Suhu sel = T<sub>udara</sub> + (NOCT&minus;20)/800 &middot; G dengan NOCT 45 &deg;C. Koefisien daya &gamma; = &minus;0,4 %/&deg;C (nilai tipikal silikon). Sudut optimum diasumsikan 10&deg; (kira-kira lintang Indonesia, cukup agar air hujan mengalir). Profil harian dimodelkan sinus pukul 06.00&ndash;18.00.')}</div>`,\ni:()=>{C[1].u()},u:()=>{const G=V('gp')*V('cl')/100,Ta=V('ta'),b=V('tl'),Tc=Ta+(45-20)/800*G,cd=Math.max(0,Math.cos((b-10)*Math.PI/180)),k=1+(-.004)*(Tc-25),P=100*(G/1000)*k*cd,psh=G*24/Math.PI/1000*cd,E=100*psh*k;\nT('r1',fx(G)+' W/m&sup2;');T('r2',fx(Tc,1)+' &deg;C');T('r3',fx(P,1)+' W');T('r4',fx(psh,1)+' jam');T('r5',fx(E)+' Wh');\nconst[x,w,h]=ctxOf($('#cg'),170),L=36,B=22,Tp=10,pw=w-L-8,ph=h-B-Tp,cs=getComputedStyle(document.body);x.clearRect(0,0,w,h);x.font='11px sans-serif';x.fillStyle=cs.color;x.strokeStyle='rgba(120,140,140,.35)';\nfor(let g=0;g<=1000;g+=500){const y=Tp+ph-ph*g/1100;x.beginPath();x.moveTo(L,y);x.lineTo(w-8,y);x.stroke();x.textAlign='right';x.fillText(g,L-4,y+4)}\nx.textAlign='center';[6,9,12,15,18].forEach(t=>x.fillText(t+':00',L+pw*(t-6)/12,h-6));\nx.beginPath();x.moveTo(L,Tp+ph);for(let t=0;t<=12;t+=.25){x.lineTo(L+pw*t/12,Tp+ph-ph*(G*Math.sin(Math.PI*t/12))/1100)}x.lineTo(L+pw,Tp+ph);x.closePath();x.fillStyle='rgba(242,183,5,.55)';x.fill();x.strokeStyle='#e0a100';x.lineWidth=2;x.stroke();x.lineWidth=1;\nx.fillStyle=cs.color;x.textAlign='left';x.fillText('W/m\\u00B2',4,12)}});\n/* ===== BAB 3 ===== */\nC.push({n:'3 Fisika PV',h:()=>`<h2>3. Efek Fotovoltaik dan Fisika Semikonduktor</h2>${mt('Bagaimana cahaya bisa berubah jadi arus listrik di dalam panel?')}\n<div class=\"card\"><p>Konversi fotovoltaik berakar dari interaksi cahaya dengan semikonduktor silikon. Foton yang energinya melebihi <i>bandgap</i> membangkitkan pasangan elektron-hole. Medan listrik internal di daerah deplesi sambungan p-n memisahkan kedua pembawa muatan itu sehingga mengalirkan arus.</p>\n<div class=\"eq\">E<sub>foton</sub> = hc/&lambda; &asymp; 1240/&lambda;(nm) eV &nbsp;&nbsp; syarat: E<sub>foton</sub> &ge; E<sub>g</sub></div>\n<details><summary>Pita valensi dan konduksi</summary><p>Tingkat energi elektron terikat (pita valensi) dan elektron bebas penghantar arus (pita konduksi). Selisihnya adalah bandgap E<sub>g</sub> yang menentukan batas eksitasi foton minimum.</p></details>\n<details><summary>Daerah deplesi (sambungan p-n)</summary><p>Medan listrik internal memisahkan elektron dan hole sehingga mencegah rekombinasi dini pembawa muatan.</p></details>\n<details><summary>Sumur elektron (electron well)</summary><p>Daerah berpotensial rendah yang menjebak dan mengarahkan elektron. Ini meningkatkan efisiensi serapan pada sel surya lanjut.</p></details></div>\n<div class=\"card\"><h3>Diagram pita energi sambungan p-n</h3>\n<svg viewBox=\"0 0 320 190\" width=\"100%\" role=\"img\" aria-label=\"Diagram pita energi\" style=\"background:var(--soft);border-radius:12px\"><g fill=\"none\" stroke-width=\"3\"><path d=\"M10 50H120C140 50 150 50 160 80S180 110 200 110H310\" stroke=\"#2f6bff\"/><path d=\"M10 120H120C140 120 150 120 160 150S180 180 200 180H310\" stroke=\"#e0524a\"/></g><g font-size=\"11\" fill=\"currentColor\"><text x=\"12\" y=\"42\">Pita konduksi (Ec)</text><text x=\"12\" y=\"140\">Pita valensi (Ev)</text><text x=\"14\" y=\"86\">p</text><text x=\"296\" y=\"94\">n</text><text x=\"196\" y=\"132\">Eg</text><text x=\"118\" y=\"20\">Daerah deplesi</text></g><rect x=\"120\" y=\"26\" width=\"80\" height=\"154\" fill=\"rgba(242,183,5,.18)\"/><path d=\"M210 112V178\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path d=\"M60 50V120\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"/><circle cx=\"105\" cy=\"50\" r=\"6\" fill=\"#2f6bff\"/><path d=\"M112 56L190 104\" stroke=\"#2f6bff\" stroke-width=\"2\"/><circle cx=\"195\" cy=\"180\" r=\"6\" fill=\"none\" stroke=\"#e0524a\" stroke-width=\"2.5\"/><path d=\"M190 176L130 124\" stroke=\"#e0524a\" stroke-width=\"2\"/></svg>\n<p style=\"font-size:13px;color:var(--mut)\">Elektron (biru) &ldquo;menuruni bukit&rdquo; pita konduksi ke sisi n, sedangkan hole (merah) bergerak ke sisi p. Itulah pemisahan muatan oleh medan internal.</p></div>\n<div class=\"card\"><h3>Simulasi foton dan pasangan elektron-hole</h3>\n${sel('mat','Material semikonduktor',[['1.12','Silikon (Eg 1,12 eV), basis PV pada jurnal'],['1.42','GaAs (Eg 1,42 eV), pembanding'],['0.67','Germanium (Eg 0,67 eV), pembanding']])}${sl('ev','Energi foton','0.5','3.2','0.05',2,'eV',2)}\n<canvas id=\"pn\" aria-label=\"Simulasi sambungan p-n\"></canvas>\n<div class=\"res\"><div>Panjang gelombang<b id=\"p1\"></b></div><div>Status foton<b id=\"p2\" style=\"font-size:14px\"></b></div><div>Energi terpakai<b id=\"p3\"></b></div><div>Terpisah / dibangkitkan<b id=\"p4\"></b></div></div>\n${note('simulasi kualitatif. Pasangan yang dibangkitkan di luar daerah deplesi bisa berekombinasi sebelum terkumpul, makin jauh makin besar peluangnya. Kelebihan energi (E &minus; Eg) terbuang sebagai panas.')}</div>`,\ni:()=>{const c=$('#pn');let W,H=250,ph=[],pr=[],gen=0,sep=0,last=performance.now(),acc=0,fl=[];\nconst sz=()=>{[,W]=ctxOf(c,H)};sz();\nconst st=[];for(let i=0;i<26;i++)st.push([Math.random(),Math.random()*.7+.2,i%2]);\nconst mk=()=>{const Eg=+$('#mat').value,E=V('ev'),x=24+Math.random()*(W-48);ph.push({x,y:0,ya:E>=Eg?50+Math.random()*130:9999,E,Eg,v:150})};\nconst hue=E=>{const l=1240/E;return l<380?'#8e44ad':l>740?'#b03a2e':`hsl(${Math.max(0,Math.min(270,(700-l)/320*270))},90%,50%)`};\nconst upd=()=>{const Eg=+$('#mat').value,E=V('ev');T('p1',fx(1240/E)+' nm');T('p2',E<Eg?'E &lt; Eg: tidak diserap':E==Eg?'E = Eg: pas':'E &gt; Eg: diserap');T('p3',E>=Eg?fx(Eg/E*100)+' %':'0 %');T('p4',gen?sep+' / '+gen:'0 / 0')};\nC[2].u=()=>{ph=[];pr=[];gen=0;sep=0;upd()};\nfunction loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;\nif(acc>.28){acc=0;mk()}\nconst[x,w,h]=ctxOf(c,H),d0=w*.4,d1=w*.6,cs=getComputedStyle(document.body);x.clearRect(0,0,w,h);\nx.fillStyle='rgba(224,82,74,.13)';x.fillRect(0,0,d0,h);x.fillStyle='rgba(47,107,255,.13)';x.fillRect(d1,0,w-d1,h);x.fillStyle='rgba(242,183,5,.2)';x.fillRect(d0,0,d1-d0,h);\nx.font='bold 12px sans-serif';x.fillStyle=cs.color;x.textAlign='center';x.fillText('p',w*.2,h-8);x.fillText('n',w*.8,h-8);x.fillText('deplesi',w*.5,h-8);\nx.globalAlpha=.55;st.forEach(s=>{const X=s[0]*w;if(X<d0){x.strokeStyle='#e0524a';x.beginPath();x.arc(X,s[1]*h,4,0,7);x.stroke()}else if(X>d1){x.fillStyle='#2f6bff';x.beginPath();x.arc(X,s[1]*h,4,0,7);x.fill()}});x.globalAlpha=1;\nx.fillStyle='#c0392b';x.fillText('\\u2212 \\u2212 \\u2212',d0+(d1-d0)*.25,28);x.fillStyle='#1f4fd6';x.fillText('+ + +',d0+(d1-d0)*.75,28);\nx.strokeStyle=cs.color;x.fillStyle=cs.color;x.lineWidth=2;x.beginPath();x.moveTo(d1-8,h*.5);x.lineTo(d0+8,h*.5);x.stroke();x.beginPath();x.moveTo(d0+8,h*.5);x.lineTo(d0+16,h*.5-5);x.lineTo(d0+16,h*.5+5);x.fill();x.lineWidth=1;x.fillText('E internal',w*.5,h*.5-10);\nph.forEach(p=>{p.y+=p.v*dt;if(!p.gone&&p.y>=p.ya){p.gone=1;gen++;const inD=p.x>d0&&p.x<d1,dist=p.x<=d0?d0-p.x:p.x>=d1?p.x-d1:0,ok=inD||Math.random()<Math.exp(-dist/(w*.12));pr.push({x:p.x,y:p.y,ex:p.x,hx:p.x,ok,t:0})}});\nph=ph.filter(p=>!p.gone&&p.y<h+10);ph.forEach(p=>{x.strokeStyle=hue(p.E);x.lineWidth=2.5;x.beginPath();for(let k=0;k<22;k+=2){x.lineTo(p.x+Math.sin(k)*3,p.y-k*1.4)}x.stroke()});x.lineWidth=1;\npr.forEach(q=>{q.t+=dt;if(q.ok){q.ex=Math.min(w-8,q.ex+130*dt);q.hx=Math.max(8,q.hx-130*dt);if(!q.d&&q.ex>=w-8){q.d=1;sep++}}else if(q.t>.7){q.dead=1;x.fillStyle='rgba(255,200,0,.9)';x.beginPath();x.arc(q.x,q.y,10,0,7);x.fill()}\nif(!q.dead){x.fillStyle='#2f6bff';x.beginPath();x.arc(q.ex,q.y,5,0,7);x.fill();x.strokeStyle='#e0524a';x.lineWidth=2;x.beginPath();x.arc(q.hx,q.y,5,0,7);x.stroke();x.lineWidth=1}});\npr=pr.filter(q=>!q.dead&&!(q.ok&&q.ex>=w-8&&q.hx<=8));upd();\nraf=requestAnimationFrame(loop)}\n$('#mat').oninput=$('#ev').oninput=null;C[2].u();raf=requestAnimationFrame(loop)},u:()=>{}});\n/* ===== BAB 4 ===== */\nconst COMP={\npv:['Modul surya fotovoltaik','Mengubah radiasi matahari menjadi listrik DC lewat efek fotovoltaik. Dinilai dalam Wp pada kondisi STC. Pasang miring sekitar 10&deg;, hadap sesuai lokasi, dan hindari bayangan karena satu sel yang tertutup menurunkan keluaran seluruh string.'],\nscc:['Solar charge controller (PWM atau MPPT)','Mengatur pengisian baterai, mencegah pengisian berlebih dan pengosongan berlebih, serta mengatur nyala lampu (sensor senja-fajar, timer, dimming).<table><tr><th></th><th>PWM</th><th>MPPT</th></tr><tr><td>Prinsip</td><td>Menghubungkan panel langsung ke baterai dengan pulsa</td><td>Melacak titik daya maksimum, konversi DC-DC</td></tr><tr><td>Panen energi</td><td>Lebih rendah</td><td>Umumnya lebih tinggi 10&ndash;30%</td></tr><tr><td>Biaya</td><td>Murah</td><td>Lebih mahal</td></tr></table>'],\nbat:['Baterai penyimpanan (Li-ion atau VRLA)','Menyimpan energi siang untuk dipakai malam dan hari mendung. Nilai berikut tipikal, cek lembar data produk.<table><tr><th></th><th>VRLA</th><th>Li-ion</th></tr><tr><td>DoD dianjurkan</td><td>~50%</td><td>~80%</td></tr><tr><td>Umur siklus</td><td>ratusan&ndash;sekitar seribu</td><td>ribuan</td></tr><tr><td>Biaya awal</td><td>Rendah</td><td>Lebih tinggi</td></tr></table>'],\nled:['Lampu LED efisiensi tinggi','Beban utama sistem. Efikasi tinggi (lumen per watt) berarti terang yang sama dengan daya lebih kecil, sehingga panel dan baterai bisa lebih kecil. Pada studi kasus jurnal: LED 60 W bekerja 12 jam per hari.'],\nsen:['Sensor cahaya (LDR atau photocell)','Mendeteksi gelap-terang. Lampu menyala saat cahaya turun di bawah ambang dan padam saat pagi. Histeresis diperlukan agar lampu tidak berkedip karena awan atau sorot kendaraan.'],\npole:['Struktur tiang penyangga mekanik','Menahan beban panel, lampu, dan baterai terhadap angin. Tinggi, jarak antartiang, dan pondasi harus sesuai standar pencahayaan jalan dan kondisi lokasi.']};\nC.push({n:'4 Perancangan',h:()=>`<h2>4. Komponen dan Perancangan Sistem</h2>${mt('Kalau mau pasang PJUTS baru di dusun, panel dan baterainya harus sebesar apa?')}\n<div class=\"card\"><p>Komponen utama PJUTS: modul surya fotovoltaik, solar charge controller (PWM atau MPPT), baterai penyimpanan (Li-ion atau VRLA), lampu LED efisiensi tinggi, sensor cahaya (LDR/photocell), dan tiang penyangga. Ketuk komponen untuk melihat perannya.</p>\n<div class=\"seg\" id=\"cp\">${Object.keys(COMP).map(k=>`<button data-k=\"${k}\">${COMP[k][0].split(' (')[0].replace('Modul surya fotovoltaik','Panel PV').replace('Solar charge controller','Controller').replace('Baterai penyimpanan','Baterai').replace('Lampu LED efisiensi tinggi','Lampu LED').replace('Sensor cahaya','Sensor').replace('Struktur tiang penyangga mekanik','Tiang')}</button>`).join('')}</div>\n<div class=\"flow\"><span>Panel PV</span><i>&rarr;</i><span>Controller</span><i>&harr;</i><span>Baterai</span><i>&rarr;</i><span>LED</span><i>&larr;</i><span>Sensor</span></div>\n<div id=\"cd\" class=\"card\" style=\"background:var(--soft);box-shadow:none\"></div></div>\n<div class=\"card\"><h3>Kalkulator perancangan (studi kasus jurnal)</h3><p style=\"font-size:13px;color:var(--mut)\">Jurnal: LED 60 W selama 12 jam per hari membutuhkan 720 Wh/hari, dengan efisiensi sistem sekitar 85&ndash;90%.</p>\n<button class=\"btn\" id=\"pr\">Pakai kasus jurnal</button>\n${sl('pw','Daya lampu LED','10','150','5',60,'W')}${sl('hr','Lama menyala per hari','4','14','1',12,'jam')}${sl('ef','Efisiensi sistem','70','95','0.5',87.5,'%',1)}${sl('ps','Jam surya efektif lokasi (PSH)','3','6.5','0.1',4,'jam',1)}${sl('au','Hari otonomi (cuaca mendung)','1','5','1',3,'hari')}\n${sel('ch','Jenis baterai',[['0.5','VRLA (DoD 50%)'],['0.8','Li-ion (DoD 80%)']])}${sel('vs','Tegangan sistem',[['12','12 V'],['24','24 V']])}\n<div class=\"eq\">E<sub>beban</sub> = P &times; t &nbsp;|&nbsp; P<sub>PV</sub> = E<sub>beban</sub>/(&eta; &middot; PSH) &nbsp;|&nbsp; E<sub>bat</sub> = E<sub>beban</sub> &middot; N/(DoD &middot; &eta;)</div>\n<div class=\"res\"><div>Energi beban<b id=\"k1\"></b></div><div>Panel minimum<b id=\"k2\"></b></div><div>Baterai (energi)<b id=\"k3\"></b></div><div>Baterai (Ah)<b id=\"k4\"></b></div><div>Arus controller min.<b id=\"k5\"></b></div></div>\n${note('energi beban, efisiensi, dan hari otonomi sesuai konsep jurnal. PSH, DoD, margin controller 25% adalah asumsi perancangan umum. PSH bergantung lokasi dan musim, jadi ukur atau ambil dari data setempat.')}</div>`,\ni:()=>{const s=k=>{$$('#cp button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));T('cd','<b>'+COMP[k][0]+'</b><p>'+COMP[k][1]+'</p>')};$$('#cp button').forEach(b=>b.onclick=()=>s(b.dataset.k));s('pv');\n$('#pr').onclick=()=>{[['pw',60],['hr',12],['ef',87.5],['au',3]].forEach(a=>{$('#'+a[0]).value=a[1];$('#'+a[0]).dispatchEvent(new Event('input',{bubbles:1}))})};C[3].u()},\nu:()=>{if(!$('#pw'))return;S.pw=V('pw');S.hr=V('hr');const P=V('pw'),t=V('hr'),e=V('ef')/100,ps=V('ps'),N=V('au'),D=V('ch'),Vs=V('vs'),E=P*t,Pp=E/(e*ps),Eb=E*N/(D*e),Ab=Eb/Vs,Ic=Pp/Vs*1.25;\nT('k1',fx(E)+' Wh/hari');T('k2',fx(Pp)+' Wp');T('k3',fx(Eb)+' Wh');T('k4',fx(Ab)+' Ah');T('k5',fx(Ic,1)+' A')}});\n/* ===== BAB 5 ===== */\nC.push({n:'5 Smart dan Ekonomi',h:()=>`<h2>5. Smart Street Lighting dan Analisis Ekonomi</h2>${mt('Apakah PJUTS benar-benar hemat? Dan bagaimana mengetahui lampu atau baterai mulai bermasalah?')}\n<div class=\"card\"><p>Integrasi IoT pada PJUTS memungkinkan pemantauan parameter sistem dari jarak jauh, pengaturan intensitas cahaya adaptif berdasarkan kehadiran objek, dan <i>predictive maintenance</i> (memperkirakan kerusakan sebelum terjadi).</p>\n<h3>A. Pencahayaan adaptif</h3><button class=\"btn\" id=\"ob\">Ada pejalan lewat: OFF</button>\n<svg viewBox=\"0 0 300 110\" width=\"100%\" role=\"img\" aria-label=\"Lampu adaptif\" style=\"background:#1b2250;border-radius:12px;margin-top:8px\"><rect y=\"92\" width=\"300\" height=\"18\" fill=\"#2f3550\"/><rect x=\"70\" y=\"30\" width=\"5\" height=\"62\" fill=\"#aab\"/><rect x=\"70\" y=\"30\" width=\"30\" height=\"5\" fill=\"#aab\"/><path id=\"cone\" d=\"M98 36L55 92H140Z\" fill=\"#ffe27a\" opacity=\".3\"/><circle id=\"lm\" cx=\"98\" cy=\"36\" r=\"7\" fill=\"#ffe27a\" opacity=\".4\"/><g id=\"pj\" opacity=\"0\"><circle cx=\"200\" cy=\"70\" r=\"7\" fill=\"#ff8a3d\"/><rect x=\"194\" y=\"77\" width=\"12\" height=\"15\" rx=\"5\" fill=\"#ff8a3d\"/></g></svg>\n${sl('dc','Waktu ada objek terdeteksi','5','60','5',20,'%')}${sl('dm','Tingkat redup saat sepi','10','60','5',30,'%')}\n<div class=\"res\"><div>Daya rata-rata<b id=\"a1\"></b></div><div>Penghematan energi<b id=\"a2\"></b></div><div>Energi per tahun<b id=\"a3\"></b></div></div>\n<div class=\"eq\">P<sub>rata</sub> = P &middot; [d + (1 &minus; d) &middot; k<sub>redup</sub>] (daya lampu dan jam nyala dari bab 8)</div>\n<h3>B. Dasbor pemantauan dan perawatan prediktif</h3>\n${sl('dt','Debu pada permukaan panel','0','30','1',5,'%')}${sl('ag','Usia baterai','0','10','0.5',2,'tahun',1)}${sel('bt','Jenis baterai',[['4','VRLA (umur ~4 th)'],['8','Li-ion (umur ~8 th)']])}\n<div class=\"tiles\"><div id=\"t1\"></div><div id=\"t2\"></div><div id=\"t3\"></div></div>\n${note('umur baterai tipikal sampai kapasitas 80% (end-of-life); pemudaran diasumsikan linier. Nilai nyata bergantung suhu, kedalaman pengosongan, dan produk.')}</div>\n<div class=\"card\"><h3>C. Analisis ekonomi: biaya siklus hidup (LCC)</h3><p style=\"font-size:13px;color:var(--mut)\">Parameter jurnal: Payback Period, NPV, dan IRR. Bandingkan PJUTS dengan PJU jaringan PLN, nilai dalam jutaan rupiah.</p>\n<div class=\"seg\"><button class=\"btn\" id=\"pa\">Dekat jaringan PLN</button><button class=\"btn\" id=\"pb2\">Dusun terpencil</button></div>\n${sl('ip','Investasi awal PJUTS','10','50','1',25,'jt')}${sl('ic','Investasi awal PJU jaringan (tiang, kabel, instalasi)','5','60','1',15,'jt')}${sl('tf','Tarif listrik','1000','2500','50',1500,'Rp/kWh')}${sl('tg','Kenaikan tarif per tahun','0','8','0.5',3,'%',1)}${sl('op','O&amp;M PJUTS per tahun','0','1','0.05',0.3,'jt',2)}${sl('oc','O&amp;M PJU jaringan per tahun','0','1','0.05',0.2,'jt',2)}${sl('bc','Ganti baterai (biaya)','0','8','0.5',3.5,'jt',1)}${sl('bn','Interval ganti baterai','3','10','1',5,'tahun')}${sl('ny','Umur analisis','5','25','1',15,'tahun')}${sl('dr','Tingkat diskonto','3','15','0.5',8,'%',1)}\n<canvas id=\"ce\" aria-label=\"Grafik biaya kumulatif\"></canvas>\n<div class=\"res\"><div>LCC PJUTS<b id=\"e1\"></b></div><div>LCC PJU jaringan<b id=\"e2\"></b></div><div>NPV penghematan<b id=\"e3\"></b></div><div>IRR<b id=\"e4\"></b></div><div>Payback<b id=\"e5\"></b></div><div>CO&#8322; dihindari<b id=\"e6\"></b></div></div>\n<p id=\"ev2\" style=\"font-weight:700\"></p>\n${note('seluruh angka default adalah asumsi ilustrasi, bukan data jurnal. Energi tahunan memakai daya dan jam nyala dari bab 8. Faktor emisi jaringan 0,85 kg CO&#8322;/kWh adalah asumsi. Jurnal menyimpulkan PJUTS layak jangka panjang; tool ini menunjukkan bahwa kelayakan sangat dipengaruhi lokasi, tarif, dan umur baterai.')}</div>`,\ni:()=>{let on=0;$('#ob').onclick=()=>{on=!on;$('#ob').textContent='Ada pejalan lewat: '+(on?'ON':'OFF');C[4].lamp(on)};\nC[4].lamp=on=>{const k=V('dm')/100;$('#lm').setAttribute('opacity',on?1:.15+k*.5);$('#cone').setAttribute('opacity',on?.55:.08+k*.3);$('#pj').setAttribute('opacity',on?1:0)};\nconst pre=(a,b)=>()=>{$('#ic').value=a;$('#ip').value=b;$$('#ic,#ip').forEach(e=>e.dispatchEvent(new Event('input',{bubbles:1})))};$('#pa').onclick=pre(15,25);$('#pb2').onclick=pre(38,25);C[4].u()},\nu:()=>{if(!$('#dc'))return;const P=S.pw,H=S.hr,d=V('dc')/100,k=V('dm')/100,pa=P*(d+(1-d)*k),sv=100*(1-pa/P);T('a1',fx(pa,1)+' W');T('a2',fx(sv)+' %');T('a3',fx(pa*H*365/1000)+' kWh');\nif(C[4].lamp)C[4].lamp($('#ob').textContent.endsWith('ON'));\nconst life=+V('bt'),age=V('ag'),soh=Math.max(0,100-20*age/life),dust=V('dt'),tl=(a,b,c)=>`<b>${a}</b>${b}`;\n$('#t1').className=dust>10?'warn':'good';T('t1',tl(fx(100-dust)+' %','Output panel relatif. '+(dust>10?'Jadwalkan pembersihan.':'Normal.')));\n$('#t2').className=soh<=80?'bad':soh<85?'warn':'good';T('t2',tl(fx(soh)+' %','Kesehatan baterai (SOH). '+(soh<=80?'Ganti baterai.':soh<85?'Mendekati batas.':'Normal.')));\nconst sisa=Math.max(0,life-age);$('#t3').className=sisa<1?'warn':'good';T('t3',tl(fx(sisa,1)+' th','Perkiraan sisa umur baterai sebelum SOH 80%.'));\nconst Pw=S.pw,Hh=S.hr,kwh=Pw*Hh*365/1000,n=V('ny'),r=V('dr')/100,g=V('tg')/100,Ip=V('ip'),Ic=V('ic'),op=V('op'),oc=V('oc'),bc=V('bc'),bn=V('bn'),tar=V('tf');\nlet cc=[Ic],cp=[Ip],pvC=Ic,pvP=Ip,cf=[Ic-Ip],co2=kwh*.85*n/1000;\nfor(let t=1;t<=n;t++){const en=kwh*tar*Math.pow(1+g,t-1)/1e6,ccst=oc+en,pcst=op+((t%bn===0&&t<n)?bc:0);cc.push(cc[t-1]+ccst);cp.push(cp[t-1]+pcst);pvC+=ccst/Math.pow(1+r,t);pvP+=pcst/Math.pow(1+r,t);cf.push(ccst-pcst)}\nconst npv=pvC-pvP;T('e1',fx(pvP,1)+' jt');T('e2',fx(pvC,1)+' jt');T('e3',(npv>=0?'+':'')+fx(npv,1)+' jt');T('e6',fx(co2,1)+' ton');\nlet pay=null;for(let t=1;t<=n;t++){const d0=cc[t-1]-cp[t-1],d1=cc[t]-cp[t];if(d0<0&&d1>=0){pay=t-1+(-d0)/(d1-d0);break}}\nT('e5',Ic>=Ip?'Segera':pay==null?'> '+n+' th':fx(pay,1)+' th');\nlet irr='n/a';if(Ip>Ic){const f=q=>{let s=-(Ip-Ic);for(let t=1;t<=n;t++)s+=cf[t]/Math.pow(1+q,t);return s};if(f(-.5)*f(1)<0){let lo=-.5,hi=1;for(let i=0;i<60;i++){const m=(lo+hi)/2;f(lo)*f(m)<=0?hi=m:lo=m}irr=fx((lo+hi)/2*100,1)+' %'}else irr='tidak ada'}T('e4',irr);\nT('ev2',npv>0?'PJUTS lebih murah sepanjang siklus hidup pada asumsi ini.':'PJU jaringan lebih murah pada asumsi ini. Coba skenario dusun terpencil atau umur analisis lebih panjang.');\nconst[x,w,h]=ctxOf($('#ce'),190),L=38,B=22,Tp=12,pw=w-L-10,ph=h-B-Tp,mx=Math.max(...cc,...cp)*1.05,cs=getComputedStyle(document.body);x.clearRect(0,0,w,h);x.font='11px sans-serif';x.fillStyle=cs.color;x.textAlign='right';\nfor(let q=0;q<=2;q++){const v=mx*q/2,y=Tp+ph-ph*q/2;x.strokeStyle='rgba(120,140,140,.35)';x.beginPath();x.moveTo(L,y);x.lineTo(w-10,y);x.stroke();x.fillText(fx(v),L-4,y+4)}\nx.textAlign='center';[0,Math.round(n/2),n].forEach(t=>x.fillText(t+' th',L+pw*t/n,h-6));\nconst ln=(a,c)=>{x.strokeStyle=c;x.lineWidth=3;x.beginPath();a.forEach((v,t)=>{const X=L+pw*t/n,Y=Tp+ph-ph*v/mx;t?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();x.lineWidth=1};ln(cc,'#e0524a');ln(cp,'#16a39a');\nx.textAlign='left';x.fillStyle='#e0524a';x.fillText('PJU jaringan',L+6,Tp+10);x.fillStyle='#16a39a';x.fillText('PJUTS',L+100,Tp+10)}});\n/* ===== BAB 6 ===== */\nconst QS={civ:[\n['Foton 500 nm (E ≈ 2,48 eV) diserap silikon (Eg 1,12 eV). Berapa bagian energinya yang terbuang sebagai panas termalisasi?',['≈ 55%','≈ 45%','≈ 100%','≈ 0%'],0,'Kelebihan energi = (2,48 − 1,12)/2,48 ≈ 0,55. Hanya sebesar Eg yang berguna, sisanya menjadi panas.'],\n['Mengapa efisiensi maksimum sel p-n tunggal punya puncak di Eg sekitar 1,1–1,4 eV, bukan terus naik bersama Eg?',['Eg kecil membuang banyak energi sebagai panas, Eg besar membuat banyak foton tidak terserap','Eg besar membuat medan internal hilang','Eg kecil membuat suhu sel turun','Foton hanya terserap di bawah Eg'],0,'Ada trade-off antara rugi termalisasi (Eg kecil) dan rugi transmisi (Eg besar).'],\n['Doping N_A = 10¹⁶ cm⁻³, N_D = 10¹⁹ cm⁻³, n_i = 10¹⁰ cm⁻³ pada 300 K (kT ≈ 0,0259 eV). V_bi mendekati...',['≈ 0,89 V','≈ 0,45 V','≈ 1,12 V','≈ 0,05 V'],0,'V_bi = (kT/q)·ln(N_A·N_D/n_i²) = 0,0259 × ln(10¹⁵) ≈ 0,89 V.'],\n['Suhu sel naik dari 25 °C ke 65 °C pada modul silikon dengan γ = −0,4 %/°C. Daya turun sekitar...',['16%','4%','0,4%','40%'],0,'ΔT = 40 °C, jadi 40 × 0,4% = 16%.'],\n['Beban 60 W × 12 jam, η sistem 87,5%, PSH 4 jam. Panel minimum yang dibutuhkan ≈',['≈ 206 Wp','≈ 180 Wp','≈ 720 Wp','≈ 60 Wp'],0,'P_PV = 720 / (0,875 × 4) ≈ 206 Wp. Menghitung 720/4 = 180 Wp melupakan efisiensi sistem.'],\n['Beban 720 Wh/hari, otonomi 3 hari, Li-ion DoD 80%, η 87,5%. Energi nominal baterai ≈',['≈ 3.086 Wh','≈ 2.160 Wh','≈ 2.700 Wh','≈ 4.937 Wh'],0,'E_bat = 720 × 3 / (0,8 × 0,875) ≈ 3.086 Wh. Jika memakai VRLA (DoD 50%) hasilnya ≈ 4.937 Wh.'],\n['Controller PWM memaksa panel bekerja di tegangan baterai (≈ 12,8 V), padahal V_mp panel 36 sel ≈ 17–18 V. Akibatnya...',['Daya yang diambil di bawah P_maks karena titik kerja menjauh dari lutut kurva I-V','Daya lebih tinggi dari P_maks','Arus hubung singkat naik','Fill factor panel berubah'],0,'MPPT menggeser titik kerja ke daya maksimum, sedangkan PWM tidak.'],\n['Tinggi lampu dinaikkan dari 6 m ke 8 m, jarak tiang dan sebaran sama. Dampak yang paling mungkin:',['Iluminansi tepat di bawah lampu turun dan keseragaman U₀ membaik','Iluminansi di bawah lampu naik :0),L+pw*i/4,h-8)}\nx.textAlign='left';x.fillText(yl,4,9);x.textAlign='right';x.fillText(xl,w-R,Tp+12);\nlines.forEach(l=>{x.strokeStyle=l.c;x.lineWidth=2.5;x.beginPath();l.p.forEach((q,i)=>i?x.lineTo(X(q[0]),Y(q[1])):x.moveTo(X(q[0]),Y(q[1])));x.stroke();x.lineWidth=1});return{x,X,Y}}\nconst dot=(m,a,b,c)=>{m.x.fillStyle=c;m.x.beginPath();m.x.arc(m.X(a),m.Y(b),5,0,7);m.x.fill()};\nconst K=8.617e-5;\n/* 1. Spektrum */\nconst pl=(x0,p)=>{let s=0;for(let x=Math.max(x0,.01);x<45;x+=.02)s+=Math.pow(x,p)/(Math.exp(x)-1)*.02;return s},xk=5778*K,TOT=Math.pow(Math.PI,4)/15;\nconst uEff=E=>{const g=E/xk;return g*pl(g,2)/TOT};\nlet CURVE=null;\n/* 2. I-V */\nfunction pv(G,Tc,Rs,n){const T=Tc+273.15,Tr=298.15,a=n*36*K*T,ar=n*36*K*Tr,Isc0=6.1,Voc0=22,Rsh=300,I0=Isc0/(Math.exp(Voc0/ar)-1)*Math.pow(T/Tr,3)*Math.exp(1.12/(n*K)*(1/Tr-1/T)),Ph=Isc0*G/1000*(1+.0005*(Tc-25)),Voc=a*Math.log(Ph/I0+1);\nconst I=v=>{let i=Ph;for(let k=0;k<25;k++){const e=Math.exp((v+i*Rs)/a),f=Ph-I0*(e-1)-(v+i*Rs)/Rsh-i,df=-I0*e*Rs/a-Rs/Rsh-1;i-=f/df}return Math.max(0,i)};\nconst p=[];let m=[0,0,0];for(let k=0;k<=140;k++){const v=Voc*1.03*k/140,i=I(v),w=v*i;p.push([v,i,w]);if(w>m[2])m=[v,i,w]}return{p,Voc,Isc:I(0),m,I}}\n/* 3. Simulasi tahunan */\nconst rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};\nlet SEED=7;\nfunction sim(){const Wp=V('wp'),cap=V('cb'),dod=+$('#dd').value,PS=V('ps'),Pl=V('pl'),H=V('hh'),E=Pl*H,res=cap*(1-dod),r=rng(SEED),F=[1.2,.75,.3];let w=1,soc=cap,lit=0,dark=0,pts=[],bad=[];\nfor(let d=0;d<365;d++){if(r()>.55)w=(w+1+(r()<.5?0:1))%3;soc=Math.min(cap,soc+Wp*PS*F[w]/.75*.875);const av=soc-res;if(av>=E){soc-=E;lit+=H}else{lit+=Math.max(0,av)/Pl;soc=Math.min(soc,res);dark++;bad.push(d)}pts.push([d,(soc-res)/(cap-res)*100])}return{pts,bad,lit:lit/(H*365)*100,dark,aut:(cap*dod)/E}}\n/* 4. Fotometri */\nfunction lux(){const P=V('lp'),ef=V('le'),m=V('bm'),Hh=V('ht'),S=V('sp'),y=V('ly'),I0=P*ef*.85*(m+1)/(2*Math.PI),pts=[];let mn=1e9,sm=0,mx=0;for(let k=0;k<=80;k++){const x=S*k/80;let t=0;for(let j=-4;j<=4;j++)t+=I0*Math.pow(Hh,m+1)/Math.pow((x-j*S)**2+y*y+Hh*Hh,(m+3)/2);pts.push([x,t]);mn=Math.min(mn,t);mx=Math.max(mx,t);sm+=t}return{pts,mn,mx,av:sm/81,I0}}\nconst M=[\n{n:'1 Foton dan bandgap',h:()=>`<h2>Foton, bandgap, dan batas efisiensi</h2><div class=\"card\"><p>Foton hanya diserap jika energinya ≥ bandgap E<sub>g</sub>. Energi di bawah E<sub>g</sub> menembus material, sedangkan kelebihan di atas E<sub>g</sub> terbuang sebagai panas (termalisasi). Dua kerugian ini sudah membatasi efisiensi sel surya sebelum rugi lain dihitung.</p><div class=\"eq\">u(E<sub>g</sub>) = E<sub>g</sub>&middot;&int;<sub>Eg</sub><sup>&infin;</sup>n(E)dE / &int;<sub>0</sub><sup>&infin;</sup>E&middot;n(E)dE &nbsp; dengan n(E) = spektrum benda hitam 5778 K</div>\n<label class=\"sl\"><span>Material</span><select id=\"mt\"><option value=\"1.12\">Silikon (1,12 eV)</option><option value=\"1.42\">GaAs (1,42 eV)</option><option value=\"1.5\">CdTe (1,5 eV)</option><option value=\"0.67\">Germanium (0,67 eV)</option><option value=\"1.7\">a-Si (1,7 eV)</option></select></label>${sl('eg','Bandgap E<sub>g</sub>',.4,3,.01,1.12,'eV',2)}<canvas id=\"c1\"></canvas>\n<div class=\"bar\" id=\"b1\"></div><p class=\"lg\">Abu-abu: foton tak terserap. Merah: panas termalisasi. Hijau: energi yang bisa menjadi listrik.</p>${res([['a1','Panjang gelombang tepi'],['a2','Efisiensi maksimum u'],['a3','Hilang (transmisi)'],['a4','Hilang (termalisasi)']])}\n${note('benda hitam 5778 K sebagai pendekatan matahari, tanpa atmosfer dan tanpa rekombinasi. Batas Shockley&ndash;Queisser yang lebih ketat untuk sel p-n tunggal sekitar 33%, dan modul silikon komersial jauh di bawah itu.')}</div>`,\n i:()=>{if(!CURVE){CURVE=[];for(let e=.4;e<=3.01;e+=.05)CURVE.push([e,uEff(e)*100])}$('#mt').onchange=e=>{$('#eg').value=e.target.value;M[0].u()};M[0].u()},\n u:()=>{const E=V('eg'),g=E/xk,u=uEff(E),tr=1-pl(g,3)/TOT,th=1-u-tr;const m=plot('c1',190,3,50,[{p:CURVE,c:'#16a39a'}],'E<sub>g</sub> (eV)'.replace(/<\\/?sub>/g,''),'u (%)');dot(m,E,u*100,'#f2b705');\nT('b1',`<i style=\"width:${tr*100}%;background:#8a98a0\">${tr>.12?fx(tr*100)+'%':''}</i><i style=\"width:${th*100}%;background:#d9534f\">${th>.12?fx(th*100)+'%':''}</i><i style=\"width:${u*100}%;background:#2e8b57\">${fx(u*100)}%</i>`);T('a1',fx(1240/E)+' nm');T('a2',fx(u*100,1)+' %');T('a3',fx(tr*100,1)+' %');T('a4',fx(th*100,1)+' %')}},\n{n:'2 Kurva I-V',h:()=>`<h2>Kurva I-V modul 100 Wp dan titik daya maksimum</h2><div class=\"card\"><p>Sel surya dimodelkan sebagai sumber arus foto paralel dengan dioda (model satu-dioda). Titik kerja ditentukan beban. Controller <i>PWM</i> memaksa panel bekerja di tegangan baterai, sedangkan <i>MPPT</i> menggeser titik kerja ke daya maksimum.</p><div class=\"eq\">I = I<sub>ph</sub> &minus; I<sub>0</sub>[e<sup>(V+IR<sub>s</sub>)/(nN<sub>s</sub>V<sub>t</sub>)</sup> &minus; 1] &minus; (V+IR<sub>s</sub>)/R<sub>sh</sub></div>\n${sl('G','Irradiance',100,1100,10,1000,'W/m²')}${sl('tc','Suhu sel',10,80,1,25,'°C')}${sl('rs','Resistansi seri R<sub>s</sub>',0,1.2,.05,.3,'Ω',2)}${sl('nn','Faktor idealitas n',1,2,.05,1.3,'',2)}${sl('vb','Tegangan baterai (titik kerja PWM)',11,15,.1,12.8,'V',1)}<canvas id=\"c2\"></canvas><p class=\"lg\">Biru: arus I (A). Kuning: daya P, skala 0&ndash;130 W. Titik kuning: daya maksimum. Titik merah: titik kerja PWM.</p>\n${res([['v1','V<sub>oc</sub>'],['v2','I<sub>sc</sub>'],['v3','P<sub>maks</sub>'],['v4','V<sub>mp</sub>'],['v5','Fill factor'],['v6','Efisiensi modul'],['v7','Panen PWM'],['v8','Panen MPPT (97%)']])}\n${note('modul 36 sel, STC: V<sub>oc</sub> 22 V, I<sub>sc</sub> 6,1 A, luas 0,6 m&sup2;, R<sub>sh</sub> 300 &Omega;, &alpha;<sub>Isc</sub> +0,05 %/&deg;C. I<sub>0</sub> mengikuti T<sup>3</sup>&middot;exp(E<sub>g</sub>/nk&middot;&Delta;(1/T)) dengan E<sub>g</sub> 1,12 eV (De Soto dkk., 2006). Parameter ilustratif, bukan data produk tertentu. Naikkan suhu sel: V<sub>oc</sub> turun dan daya ikut turun.')}</div>`,\n u:()=>{const o=pv(V('G'),V('tc'),V('rs'),V('nn')),ym=7.2,m=plot('c2',230,24,ym,[{p:o.p.map(q=>[q[0],q[1]]),c:'#2f6bff'},{p:o.p.map(q=>[q[0],q[2]/130*ym]),c:'#e0a100'}],'V (volt)','I (A)');dot(m,o.m[0],o.m[2]/130*ym,'#f2b705');const vb=V('vb'),pp=vb*o.I(vb),G=V('G');dot(m,vb,pp/130*ym,'#d9534f');\nT('v1',fx(o.Voc,1)+' V');T('v2',fx(o.Isc,2)+' A');T('v3',fx(o.m[2],1)+' W');T('v4',fx(o.m[0],1)+' V');T('v5',fx(o.m[2]/(o.Voc*o.Isc),2));T('v6',fx(o.m[2]/(G*.6)*100,1)+' %');T('v7',fx(pp,1)+' W');T('v8',fx(o.m[2]*.97,1)+' W ('+(pp>0?'+'+fx((o.m[2]*.97/pp-1)*100):'n/a')+' %)')}},\n{n:'3 Dimensi dan keandalan',h:()=>`<h2>Dimensi sistem dan simulasi satu tahun</h2><div class=\"card\"><p>Studi kasus jurnal: LED 60 W &times; 12 jam = 720 Wh/hari. Rumus dimensi hanya memberi ukuran minimum. Cuaca sebenarnya berubah dari hari ke hari, jadi di sini panel dan baterai diuji pada 365 hari cuaca acak (cerah, berawan, mendung dengan persistensi antarhari).</p><div class=\"eq\">E<sub>in</sub> = P<sub>PV</sub>&middot;PSH&middot;&eta; &nbsp;|&nbsp; E<sub>guna</sub> = E<sub>bat</sub>&middot;DoD &nbsp;|&nbsp; otonomi = E<sub>guna</sub>/E<sub>beban</sub></div>\n${sl('pl','Daya LED',20,120,5,60,'W')}${sl('hh','Lama menyala',6,14,1,12,'jam')}${sl('wp','Panel surya',60,400,10,200,'Wp')}${sl('cb','Baterai (energi nominal)',500,6000,100,3000,'Wh')}${sl('ps','Jam surya efektif rata-rata',3,5.5,.1,4.2,'jam',1)}<label class=\"sl\"><span>Kedalaman pengosongan (DoD)</span><select id=\"dd\"><option value=\"0.5\">VRLA 50%</option><option value=\"0.8\" selected>Li-ion 80%</option></select></label><button class=\"btn\" id=\"rn\">Acak cuaca baru</button><canvas id=\"c3\" style=\"margin-top:10px\"></canvas><p class=\"lg\">Hijau: sisa energi baterai yang dapat dipakai (%). Garis merah di dasar: malam lampu tidak menyala penuh.</p>\n${res([['s1','Energi beban'],['s2','Panel minimum (rumus)'],['s3','Otonomi baterai'],['s4','Jam nyala terpenuhi'],['s5','Malam kurang terang']])}${note('&eta; sistem 87,5% (tengah rentang 85&ndash;90% pada jurnal), faktor cuaca 1,2 / 0,75 / 0,3 terhadap rata-rata, probabilitas cuaca bertahan 55%, pengisian siang lalu pengosongan malam. Nilai ini model belajar. Gunakan data PSH lokasi dan produk nyata untuk perancangan sebenarnya.')}</div>`,\n i:()=>{$('#rn').onclick=()=>{SEED=Math.random()*1e9|0;M[2].u()};M[2].u()},\n u:()=>{const r=sim(),E=V('pl')*V('hh');const m=plot('c3',200,365,100,[{p:r.pts,c:'#16a39a'}],'hari ke-','sisa (%)');m.x.fillStyle='#d9534f';r.bad.forEach(d=>m.x.fillRect(m.X(d)-1,m.Y(0)-5,2,5));\nT('s1',fx(E)+' Wh/hari');T('s2',fx(E/(.875*V('ps')))+' Wp');T('s3',fx(r.aut,1)+' hari');T('s4',fx(r.lit,1)+' %');T('s5',r.dark+' dari 365')}},\n{n:'4 Fotometri jalan',h:()=>`<h2>Fotometri: seberapa terang jalannya?</h2><div class=\"card\"><p>Lampu menghasilkan fluks cahaya (lumen). Yang dirasakan jalan adalah iluminansi (lux), yang turun dengan kuadrat jarak dan sudut datang. Penerangan yang merata (U<sub>0</sub> = E<sub>min</sub>/E<sub>rata</sub> tinggi) lebih aman daripada satu titik terang di antara gelap.</p><div class=\"eq\">E = I(&theta;)&middot;cos&theta; / d&sup2; &nbsp; dengan I(&theta;) = I<sub>0</sub>cos<sup>m</sup>&theta; dan &Phi; = 2&pi;I<sub>0</sub>/(m+1)</div>\n${sl('lp','Daya LED',20,120,5,60,'W')}${sl('le','Efikasi LED',90,180,5,130,'lm/W')}${sl('bm','Eksponen sebaran m (besar = sempit)',.5,5,.1,2,'',1)}${sl('ht','Tinggi lampu',4,10,.5,6,'m',1)}${sl('sp','Jarak antartiang',10,50,1,25,'m')}${sl('ly','Jarak lateral titik ukur dari tiang',0,8,.5,3,'m',1)}<canvas id=\"c4\"></canvas><p class=\"lg\">Grafik: iluminansi di sepanjang jalan, dari satu tiang (kiri) ke tiang berikutnya (kanan).</p>\n${res([['l1','Fluks efektif'],['l2','E rata-rata'],['l3','E minimum'],['l4','Keseragaman U<sub>0</sub>']])}${note('sumber titik, distribusi cos<sup>m</sup>, efisiensi optik 85%, tanpa pantulan jalan, tiang segaris dengan 9 tiang tetangga. Target lux dan keseragaman bergantung kelas jalan; rujuk SNI 7391:2008 untuk nilai yang berlaku.')}</div>`,\n u:()=>{const o=lux(),m=plot('c4',210,V('sp'),o.mx*1.1,[{p:o.pts,c:'#e0a100'}],'posisi (m)','lux');T('l1',fx(V('lp')*V('le')*.85)+' lm');T('l2',fx(o.av,1)+' lx');T('l3',fx(o.mn,1)+' lx');T('l4',fx(o.mn/o.av,2))}},\n{n:'5 Rujukan',h:()=>`<h2>Rujukan dan peta konsep</h2><div class=\"card\"><h3>Dari jurnal ke simulasi</h3><ul><li>Bandgap, pasangan elektron-hole, daerah deplesi: bab 3, 4, 5, dan 6.</li><li>Irradiance, suhu modul, PWM atau MPPT: bab 2 dan 6.</li><li>LED 60 W &times; 12 jam = 720 Wh/hari, hari otonomi, efisiensi sistem 85&ndash;90%: bab 8 dan 9.</li><li>Pencahayaan jalan dan keandalan layanan (bagian dari kualitas smart lighting): bab 11.</li><li>Degradasi modul dan rugi sistem: bab 7. Umur baterai: bab 10.</li><li>Payback, NPV, IRR dan IoT: bab 12 (Smart dan ekonomi).</li></ul><h3>Pustaka</h3><ul><li>Supriyanto, M. Z. D. Analisis PJUTS Berbasis Fotovoltaik, Dinamika Elektron-Hole, dan Pengembangan Smart Street Lighting. Jurnal Ilmiah PJUTS, S2 Teknik Elektro.</li><li>Shockley, W., Queisser, H. J. (1961). Detailed balance limit of efficiency of p-n junction solar cells. J. Appl. Phys. 32(3), 510&ndash;519.</li><li>De Soto, W., Klein, S. A., Beckman, W. A. (2006). Improvement and validation of a model for photovoltaic array performance. Solar Energy 80(1), 78&ndash;88.</li><li>Sze, S. M., Ng, K. K. (2007). Physics of Semiconductor Devices, 3rd ed. Wiley.</li><li>Green, M. A. (1982). Solar Cells: Operating Principles, Technology and System Applications. Prentice-Hall.</li><li>Jordan, D. C., Kurtz, S. R. (2013). Photovoltaic degradation rates: an analytical review. Prog. Photovolt. 21(1), 12&ndash;29.</li><li>Linden, D., Reddy, T. B. (eds.) Handbook of Batteries. McGraw-Hill.</li><li>SNI 7391:2008, Spesifikasi penerangan jalan di kawasan perkotaan.</li></ul>${note('semua simulasi adalah model pembelajaran. Angka bawaan adalah ilustrasi, bukan hasil pengukuran atau spesifikasi produk.')}</div>`}];\nM.push(\n{n:'Semikonduktor lanjut',h:()=>`<h2>Doping, potensial built-in, dan lebar deplesi</h2><div class=\"card\"><p>Silikon murni punya sedikit pembawa bebas, n<sub>i</sub> &asymp; 10<sup>10</sup> cm<sup>&minus;3</sup> pada 300 K. Doping menambah elektron (tipe n) atau hole (tipe p). Saat sisi p dan n bertemu, pembawa berdifusi sampai terbentuk medan internal. Beda potensial yang menahan difusi disebut V<sub>bi</sub>, dan daerah yang terkuras pembawa adalah daerah deplesi selebar W. Panjang difusi L menentukan seberapa jauh pembawa hasil foton bisa menempuh jarak sebelum berekombinasi.</p><div class=\"eq\">V<sub>bi</sub> = (kT/q)&middot;ln(N<sub>A</sub>N<sub>D</sub>/n<sub>i</sub>&sup2;) &nbsp;|&nbsp; W = &radic;[2&epsilon;V<sub>bi</sub>/q&middot;(1/N<sub>A</sub>+1/N<sub>D</sub>)] &nbsp;|&nbsp; E<sub>maks</sub> = 2V<sub>bi</sub>/W</div><div class=\"eq\">L<sub>n</sub> = &radic;(D<sub>n</sub>&tau;<sub>n</sub>) &nbsp;|&nbsp; D<sub>n</sub> = &mu;<sub>n</sub>kT/q &nbsp;|&nbsp; n<sub>i</sub> &prop; T<sup>3/2</sup>e<sup>&minus;E<sub>g</sub>/2kT</sup></div>\n${sl('na','log10 N<sub>A</sub> (basis p)',14,18,.1,16,'cm⁻³',1)}${sl('nd','log10 N<sub>D</sub> (emitter n)',17,20.5,.1,19,'cm⁻³',1)}${sl('tk','Suhu',250,400,5,300,'K')}${sl('tau','log10 &tau; umur pembawa minoritas',-7,-3,.1,-5,'s',1)}<canvas id=\"c5\"></canvas><p class=\"lg\">Kurva: V<sub>bi</sub> terhadap doping emitter. Titik kuning: pengaturan sekarang.</p>\n${res([['d1','n<sub>i</sub>'],['d2','V<sub>bi</sub>'],['d3','Lebar deplesi W'],['d4','Medan maks'],['d5','Panjang difusi L<sub>n</sub>'],['d6','L<sub>n</sub> / tebal wafer']])}${note('&epsilon;<sub>Si</sub> = 11,7&epsilon;<sub>0</sub>, n<sub>i</sub>(300 K) = 1,0&times;10<sup>10</sup> cm<sup>&minus;3</sup> (nilai literatur bervariasi), &mu;<sub>n</sub> = 1400 cm&sup2;/Vs &times; (300/T)<sup>2,4</sup> tanpa koreksi doping, tebal wafer 180 &micro;m, deplesi abrupt, tanpa bias. Jika L<sub>n</sub> jauh lebih besar dari tebal wafer, hampir semua pembawa sempat terkumpul.')}</div>`,\n u:()=>{const k=8.617e-5,Tk=V('tk'),kT=k*Tk,ni=1e10*Math.pow(Tk/300,1.5)*Math.exp(-1.12/(2*k)*(1/Tk-1/300)),NA=Math.pow(10,V('na')),ND=Math.pow(10,V('nd')),vb=q=>Math.max(.01,kT*Math.log(NA*Math.pow(10,q)/ni/ni)),Vb=vb(V('nd')),W=Math.sqrt(2*1.0359e-12*Vb/1.602e-19*(1/NA+1/ND)),mu=1400*Math.pow(300/Tk,2.4),L=Math.sqrt(mu*kT*Math.pow(10,V('tau')));\nconst p=[];for(let q=17;q<=20.51;q+=.1)p.push([q,vb(q)]);const m=plot('c5',190,20.5,1.3,[{p,c:'#16a39a'}],'log10 N_D','V_bi (V)',17);dot(m,V('nd'),Vb,'#f2b705');\nT('d1',ni.toExponential(1).replace('e+','×10^')+' cm⁻³');T('d2',fx(Vb,3)+' V');T('d3',fx(W*1e4,2)+' µm');T('d4',fx(2*Vb/W/1e3,1)+' kV/cm');T('d5',fx(L*1e4)+' µm');T('d6',fx(L/180e-4,1)+'×')}},\n{n:'Rugi dan degradasi',h:()=>`<h2>Rugi sistem, performance ratio, dan degradasi modul</h2><div class=\"card\"><p>Energi nyata selalu di bawah energi ideal. Performance ratio (PR) adalah perkalian faktor-faktor yang tersisa setelah debu, suhu, kabel, ketidakcocokan (<i>mismatch</i>), dan elektronik. Di atas itu, modul kristalin kehilangan daya sedikit demi sedikit: penurunan awal akibat <i>light-induced degradation</i> (LID) di tahun pertama, lalu laju degradasi tahunan.</p><div class=\"eq\">PR = (1&minus;L<sub>debu</sub>)(1&minus;L<sub>suhu</sub>)(1&minus;L<sub>lain</sub>) &nbsp;|&nbsp; P(y) = P<sub>0</sub>(1&minus;LID)(1&minus;r)<sup>y&minus;1</sup></div>\n${sl('so','Rugi debu dan bayangan',0,15,.5,4,'%',1)}${sl('tp','Rugi suhu',0,20,.5,9,'%',1)}${sl('ot','Rugi kabel, mismatch, controller',0,12,.5,6,'%',1)}${sl('dg','Laju degradasi tahunan r',.2,1.5,.05,.7,'%/th',2)}<canvas id=\"c6\"></canvas><p class=\"lg\">Daya relatif modul terhadap tahun ke-0 (%).</p>\n${res([['g1','Performance ratio'],['g2','Daya tahun ke-25'],['g3','Energi 25 th vs ideal'],['g4','Turun di bawah 80%']])}${note('LID 1,5% di tahun pertama dan r konstan adalah penyederhanaan. Tinjauan Jordan dan Kurtz (2013) melaporkan median degradasi modul kristalin sekitar 0,5%/tahun dengan sebaran lebar. Pakai data produk dan lokasi untuk keputusan nyata.')}</div>`,\n u:()=>{const so=V('so')/100,tp=V('tp')/100,ot=V('ot')/100,r=V('dg')/100,pr=(1-so)*(1-tp)*(1-ot),P=y=>y?100*(1-.015)*Math.pow(1-r,y-1):100,p=[];let s=0,b=null;for(let y=0;y<=25;y++){p.push([y,P(y)]);if(y)s+=P(y)/100;if(b==null&&P(y)<80)b=y}\nplot('c6',190,25,100,[{p,c:'#e0a100'}],'tahun','P (%)');T('g1',fx(pr*100,1)+' %');T('g2',fx(P(25),1)+' %');T('g3',fx(s*pr/25*100,1)+' %');T('g4',b?'tahun '+b:'tidak dalam 25 th')}},\n{n:'Baterai',h:()=>`<h2>Baterai: kedalaman pengosongan, suhu, dan umur</h2><div class=\"card\"><p>Baterai biasanya komponen yang paling dulu diganti pada PJUTS. Umurnya dibatasi dua hal: jumlah siklus (makin dalam dikosongkan, makin pendek) dan umur kalender (makin panas, makin cepat menua, karena reaksi kimia mengikuti hukum Arrhenius). Umur efektif adalah yang lebih pendek dari keduanya.</p><div class=\"eq\">N(DoD) = N<sub>50</sub>(50/DoD)<sup>k</sup> &nbsp;|&nbsp; f(T) = 2<sup>&minus;(T&minus;25)/&Delta;T</sup> &nbsp;|&nbsp; umur = min(N&middot;f/365, umur<sub>kalender</sub>&middot;f)</div>\n<label class=\"sl\"><span>Kimia baterai</span><select id=\"bc\"><option value=\"v\">VRLA (timbal-asam)</option><option value=\"l\">LiFePO&#8324; (Li-ion)</option></select></label>${sl('bd','Kedalaman pengosongan harian',30,100,5,50,'%')}${sl('bt','Suhu rata-rata baterai',15,50,1,30,'°C')}<canvas id=\"c7\"></canvas><p class=\"lg\">Merah: VRLA. Hijau: LiFePO&#8324;. Titik kuning: pengaturan sekarang (siklus hidup vs DoD pada 25 &deg;C).</p>\n${res([['h1','Siklus hidup'],['h2','Umur dari siklus'],['h3','Umur kalender'],['h4','Umur efektif']])}${note('bentuk persamaan empiris yang umum dipakai. Angka bawaan ilustratif: VRLA N<sub>50</sub> 600, k 1,1, kalender 6 th, &Delta;T 8 &deg;C; LiFePO&#8324; N<sub>50</sub> 4000, k 1,6, kalender 12 th, &Delta;T 15 &deg;C. Produk nyata berbeda, jadi baca lembar data dan kurva siklus pabrikan.')}</div>`,\n u:()=>{const B={v:[600,1.1,6,8],l:[4000,1.6,12,15]},c=$('#bc').value const ARENA={dash:['Distrik 1','Jalan Dusun','1 ketukan','Nyalakan PJU'],drive:['Distrik 2','Jalan Malam','Kiri · Kanan','Kejar terang'],stack:['Distrik 3','Lapangan Tiang','Ketuk','Tiang lurus'],grid:['Distrik 4','Hutan & Cermin','Putar','Sinar ke panel'],tilt:['Distrik 5','Cakrawala','Ketuk','Capai 90%'],sci:['Distrik 6','Laboratorium','Pilih mode','Kuasai 14 bab']};
function cover(k){const a=ARENA[k]||[],ic=document.querySelector('.g[data-g="'+k+'"] .ic');
 intro.style.setProperty('--gc',COL[k]);
 document.getElementById('in-d').textContent=(a[0]||'')+' · Sunrise on the Kiarakoneng';
 document.getElementById('in-i').innerHTML=ic?ic.innerHTML:'';
 const lb=['Arena','Kontrol','Tujuan'];document.getElementById('in-c').innerHTML=lb.map((l,i)=>'<span><em>'+l+'</em>'+(a[i+1]||'')+'</span>').join('')}
const intro=document.getElementById('intro');let pend=null;
function showIntro(k){intro.style.background=COL[k];const d=INTRO[k];pend=k;cover(k);document.getElementById('in-b').textContent=d.b;document.getElementById('in-t').textContent=d.t;document.getElementById('in-s').textContent=d.s;document.getElementById('in-m').textContent=d.m;intro.classList.remove('hide');document.documentElement.style.overflow='hidden';document.getElementById('in-go').focus()}
function hideIntro(){intro.classList.add('hide');pend=null;document.documentElement.style.overflow=''}
document.getElementById('in-go').addEventListener('click',()=>{const k=pend;hideIntro();open(k)});
document.getElementById('in-no').addEventListener('click',hideIntro);
document.querySelectorAll('.g').forEach(b=>b.addEventListener('click',()=>showIntro(b.dataset.g)));
addEventListener('message',e=>{if(fr&&e.source===fr.contentWindow&&e.data==='sa-back'){if(history.state&&history.state.g)history.back();else close()}});
addEventListener('popstate',close);

addEventListener('message',e=>{if(fr&&e.source===fr.contentWindow&&e.data&&e.data.sa==='music')hmStart(e.data.key)});document.getElementById('mus').addEventListener('click',()=>{hOn=!hOn;try{localStorage.setItem('kiara_music',hOn?'1':'0')}catch(e){}if(hOn)hmStart(hKey);else hmStop();hmSync()});
